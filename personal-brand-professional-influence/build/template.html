<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人品牌与专业影响力 · 交互式自学课程</title>
<meta name="description" content="从专业定位、内容生产、平台运营、影响力积累到商业变现的系统性自学课程。基于学术研究、平台官方文档与行业研究构建。">
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#F7F8FA; --card:#FFFFFF;
  --text:#17243A; --muted:#526174; --muted2:#7A8699;
  --primary:#4263EB; --primary-deep:#3350C9; --primary-bg:#EDF1FD;
  --teal:#159A8C; --teal-deep:#0F7A6E; --teal-bg:#E7F5F3;
  --bg2:#EDF1F7; --border:#DEE4EC; --border2:#CBD5E1;
  --warn:#A05E1A; --warn-bg:#FBF3E4; --warn-border:#EBD9B4;
  --shadow:0 1px 2px rgba(23,36,58,.05),0 4px 14px rgba(23,36,58,.07);
  --mono:"Cascadia Code","JetBrains Mono",SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC","Inter","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.78;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
code,kbd,pre,.mono{font-family:var(--mono);font-size:.92em}
::selection{background:#D6DEF8}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
img,svg{max-width:100%}
button{font-family:inherit}

/* ============ 阅读进度条 ============ */
.readbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;background:transparent;pointer-events:none}
.readbar i{display:block;height:100%;width:0;background:var(--primary);transition:width .1s linear}

/* ============ 布局骨架 ============ */
.shell{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:272px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;transition:transform .25s ease}
.sb-brand{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.sb-brand .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;color:var(--text);letter-spacing:.3px}
.sb-brand .logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--teal));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.sb-brand .sub{font-size:11.5px;color:var(--muted2);margin-top:5px;line-height:1.5}
.sb-search{padding:10px 12px;border-bottom:1px solid var(--border)}
.sb-search .box{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:6px 10px}
.sb-search .box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(66,99,235,.12)}
.sb-search input{border:none;outline:none;flex:1;font-size:13px;background:transparent;color:var(--text);font-family:inherit;min-width:0}
.sb-search .kbd{font-size:10.5px;color:var(--muted2);border:1px solid var(--border);border-radius:4px;padding:0 5px;background:#fff;flex:none}
.nav{flex:1;overflow-y:auto;padding:8px 10px 16px;scrollbar-width:thin}
.nav-group{font-size:10.5px;color:var(--muted2);letter-spacing:1.6px;margin:14px 8px 5px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--text);font-size:13.5px;cursor:pointer;user-select:none;border-left:3px solid transparent;line-height:1.4}
.nav-item:hover{background:var(--bg2);text-decoration:none}
.nav-item.active{background:var(--primary-bg);color:var(--primary-deep);border-left-color:var(--primary);font-weight:600}
.nav-item .ni{width:20px;text-align:center;font-size:12px;color:var(--muted2);flex:none;font-weight:700}
.nav-item.active .ni{color:var(--primary)}
.nav-item .nm{flex:1;min-width:0}
.nav-item .nm small{display:block;font-size:11px;color:var(--muted2);font-weight:400}
.nav-item.done .ni{color:var(--teal)}
.nav-badge{margin-left:auto;font-size:10px;color:var(--muted2);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:0 7px;line-height:16px;flex:none}
.nav-badge.full{color:var(--teal-deep);border-color:#BFE3DE;background:var(--teal-bg)}
.nav-sub{padding-left:12px;overflow:hidden}
.nav-sub .nav-item{font-size:12.6px;padding:5px 9px;color:var(--muted)}
.nav-sub .nav-item.active{color:var(--primary-deep)}
.nav-sub .nav-item .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border2);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.nav-sub .nav-item .dot.on{background:var(--teal);border-color:var(--teal)}
.sb-foot{border-top:1px solid var(--border);padding:10px 14px;font-size:11px;color:var(--muted2)}
.sb-foot .pbar{height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.sb-foot .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--teal));transition:width .3s}
.sb-foot .row{display:flex;justify-content:space-between;align-items:center}
.sb-foot button{font-size:10.5px;color:var(--muted2);background:none;border:1px solid var(--border);border-radius:5px;padding:1px 7px;cursor:pointer}
.sb-foot button:hover{color:var(--primary);border-color:var(--primary)}

/* ============ 主区域 ============ */
.main{margin-left:272px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:90;background:rgba(247,248,250,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 26px}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{color:#B6C2D4}
.hamburger{display:none;border:1px solid var(--border);background:#fff;border-radius:8px;width:36px;height:36px;font-size:17px;color:var(--text);cursor:pointer;flex:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.top-progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.top-progress .bar{width:88px;height:6px;background:var(--border);border-radius:4px;overflow:hidden}
.top-progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--teal));transition:width .3s}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:9px;padding:7px 14px;font-size:13.5px;cursor:pointer;transition:all .15s;text-decoration:none;line-height:1.5}
.btn:hover{border-color:var(--primary);color:var(--primary);text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-deep);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.teal:hover{background:var(--teal-deep);color:#fff}
.btn.sm{padding:4px 11px;font-size:12.5px;border-radius:7px}
.btn.on{background:var(--teal-bg);border-color:#BFE3DE;color:var(--teal-deep)}
.content-wrap{display:flex;gap:26px;max-width:1420px;width:100%;margin:0 auto;padding:24px 30px 90px}
.article{flex:1;min-width:0;max-width:880px}
.aside{width:292px;flex:none;align-self:flex-start;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin}
.aside .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.aside h4{font-size:12px;color:var(--muted2);letter-spacing:1.2px;margin-bottom:8px;font-weight:700}
.aside .toc a{display:block;font-size:12.8px;color:var(--muted);padding:4px 0 4px 10px;border-left:2px solid var(--border);line-height:1.5}
.aside .toc a:hover{color:var(--primary);border-left-color:var(--primary);text-decoration:none}
.aside .toc a.lv3{padding-left:20px;font-size:12.2px}
.aside .term{font-size:12.6px;margin-bottom:7px;line-height:1.55}
.aside .term b{color:var(--text)}
.aside .term span{color:var(--muted)}
.aside .src{font-size:12.2px;color:var(--muted);padding:4px 0;border-bottom:1px dashed var(--border);line-height:1.5}
.aside .src:last-child{border-bottom:none}
.aside .src a{font-weight:600}
.mobile-toc{display:none}
.overlay{display:none;position:fixed;inset:0;background:rgba(23,36,58,.35);z-index:95}
.overlay.show{display:block}

/* ============ 通用内容组件 ============ */
.page-head{margin-bottom:22px}
.page-head .kicker{font-size:12px;color:var(--primary);font-weight:700;letter-spacing:1.5px;margin-bottom:6px}
.page-head h1{font-size:27px;line-height:1.35;letter-spacing:.3px}
.page-head .lead{font-size:15px;color:var(--muted);margin-top:10px;max-width:760px}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2px 11px}
.chip b{color:var(--text);font-weight:600}
.chip.blue{color:var(--primary-deep);background:var(--primary-bg);border-color:#CBD9F8}
.chip.teal{color:var(--teal-deep);background:var(--teal-bg);border-color:#BFE3DE}
.sec{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px 30px;margin-bottom:20px;scroll-margin-top:76px}
.sec>h2{font-size:20px;line-height:1.4;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:9px}
.sec>h2 .no{font-size:12px;color:var(--primary);font-weight:700;letter-spacing:1px;flex:none;font-family:var(--mono)}
.sec h3{font-size:16.5px;margin:20px 0 8px;display:flex;align-items:center;gap:7px}
.sec h3::before{content:"";width:4px;height:15px;background:var(--primary);border-radius:2px;flex:none}
.sec h4{font-size:14.5px;margin:14px 0 6px;color:var(--text)}
.sec p{margin-bottom:11px}
.sec ul,.sec ol{margin:0 0 12px 22px}
.sec li{margin-bottom:5px}
.sec strong{font-weight:700}
.sec blockquote{margin:12px 0;padding:10px 16px;border-left:3px solid var(--primary);background:var(--primary-bg);border-radius:0 8px 8px 0;color:var(--text);font-size:14.5px}
.sec blockquote .src-in{display:block;font-size:12px;color:var(--muted);margin-top:5px}
sup.ref{font-family:var(--mono);font-size:10.5px;color:var(--primary);cursor:pointer;margin-left:2px;vertical-align:super}
sup.ref:hover{text-decoration:underline}
table.tb{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:13.5px;background:#fff}
table.tb th{background:var(--bg2);text-align:left;padding:8px 11px;border:1px solid var(--border);font-weight:700;color:var(--text);white-space:nowrap}
table.tb td{padding:8px 11px;border:1px solid var(--border);color:var(--muted);vertical-align:top;line-height:1.6}
table.tb td b{color:var(--text)}
table.tb tr:hover td{background:#FAFBFD}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 7px;line-height:18px;letter-spacing:.5px;vertical-align:middle;flex:none}
.tag.r{background:var(--primary-bg);color:var(--primary-deep);border:1px solid #CBD9F8}
.tag.o{background:var(--teal-bg);color:var(--teal-deep);border:1px solid #BFE3DE}
.tag.p{background:var(--bg2);color:var(--muted);border:1px solid var(--border)}
.tag.w{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.callout{border-radius:10px;padding:13px 16px;margin:13px 0;font-size:14px;border:1px solid;line-height:1.7}
.callout .ct{font-weight:700;font-size:12.5px;letter-spacing:.8px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.callout p:last-child{margin-bottom:0}
.c-research{background:var(--primary-bg);border-color:#CBD9F8}
.c-research .ct{color:var(--primary-deep)}
.c-official{background:var(--teal-bg);border-color:#BFE3DE}
.c-official .ct{color:var(--teal-deep)}
.c-practice{background:var(--bg2);border-color:var(--border)}
.c-practice .ct{color:var(--muted)}
.c-warn{background:var(--warn-bg);border-color:var(--warn-border)}
.c-warn .ct{color:var(--warn)}
details.fold{border:1px solid var(--border);border-radius:10px;margin:13px 0;background:#fff;overflow:hidden}
details.fold>summary{cursor:pointer;padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--primary);font-size:11px;transition:transform .15s;flex:none}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary:hover{color:var(--primary)}
details.fold .fold-body{padding:4px 18px 14px;border-top:1px solid var(--border);font-size:14px}
details.fold .fold-body p{margin-bottom:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:13px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:13px 0}
.mini-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:13px 15px;font-size:13.5px}
.mini-card b{display:block;font-size:13.5px;margin-bottom:4px;color:var(--text)}
.mini-card p{color:var(--muted);font-size:12.8px;margin:0;line-height:1.65}
.diagram{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 14px 12px;margin:15px 0;text-align:center}
.diagram .cap{font-size:12px;color:var(--muted2);margin-top:8px;text-align:center;line-height:1.6}
.diagram svg{max-width:100%;height:auto}
.steps{counter-reset:st;list-style:none;margin-left:0}
.steps li{counter-increment:st;position:relative;padding-left:34px;margin-bottom:10px}
.steps li::before{content:counter(st);position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.exercise{background:linear-gradient(180deg,#fff, #FBFCFE);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:12px;padding:20px 24px;margin:18px 0}
.exercise h3{margin-top:0}
.exercise h3::before{background:var(--teal)}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;background:#fff;font-size:13.8px;cursor:pointer;transition:all .15s}
.task:hover{border-color:var(--teal)}
.task input{margin-top:4px;accent-color:var(--teal);width:15px;height:15px;flex:none;cursor:pointer}
.task.done{background:var(--teal-bg);border-color:#BFE3DE}
.task.done .t{color:var(--teal-deep);text-decoration:line-through}
.task .out{display:block;font-size:12px;color:var(--muted2);margin-top:2px}
.sec-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dashed var(--border)}
.pn-nav{display:flex;gap:14px;margin-top:26px}
.pn-nav a{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);transition:all .15s;min-width:0}
.pn-nav a:hover{border-color:var(--primary);text-decoration:none}
.pn-nav .dir{font-size:11.5px;color:var(--muted2);letter-spacing:1px;margin-bottom:3px}
.pn-nav .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-nav a.next{text-align:right}

/* ============ 首页 ============ */
.hero{background:linear-gradient(120deg,#1E2F52 0%,#2B4A86 55%,#12706A 130%);border-radius:18px;color:#fff;padding:40px 44px;margin-bottom:24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .kicker{font-size:12px;letter-spacing:2.5px;opacity:.75;margin-bottom:12px;font-weight:600}
.hero h1{font-size:34px;letter-spacing:1px;line-height:1.3}
.hero .sub{font-size:15px;opacity:.88;margin-top:12px;max-width:780px;line-height:1.8}
.hero .meta{display:flex;gap:34px;margin-top:24px;flex-wrap:wrap}
.hero .meta div{font-size:12px;opacity:.72}
.hero .meta b{display:block;font-size:22px;opacity:1;font-weight:700;font-family:var(--mono)}
.hero .cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.hero .cta .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(4px)}
.hero .cta .btn:hover{background:rgba(255,255,255,.24);color:#fff}
.hero .cta .btn.solid{background:#fff;color:#1E2F52;border-color:#fff}
.home-sec{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:20px}
.home-sec>h2{font-size:19px;margin-bottom:6px;display:flex;align-items:center;gap:9px}
.home-sec>.desc{font-size:13.5px;color:var(--muted);margin-bottom:16px}
.stage-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stage-box{border:1px solid var(--border);border-radius:12px;padding:15px 16px;background:var(--bg);position:relative}
.stage-box .st{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--primary);margin-bottom:5px}
.stage-box h3{font-size:15px;margin-bottom:6px}
.stage-box p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.stage-box .mods{display:flex;flex-wrap:wrap;gap:5px}
.stage-box .mods span{font-size:10.5px;background:#fff;border:1px solid var(--border);border-radius:5px;padding:1px 7px;color:var(--muted)}
.mod-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:19px 21px;cursor:pointer;transition:all .15s;display:block;color:var(--text)}
.mod-card:hover{border-color:var(--primary);box-shadow:var(--shadow);text-decoration:none;transform:translateY(-1px)}
.mod-card .mc-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mod-card .mc-no{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--primary);border-radius:7px;padding:2px 8px;flex:none}
.mod-card .mc-stage{font-size:10.5px;color:var(--muted2);margin-left:auto;flex:none}
.mod-card h3{font-size:15.5px;margin-bottom:5px}
.mod-card p{font-size:12.8px;color:var(--muted);line-height:1.65;margin-bottom:10px}
.mod-card .mc-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted2)}
.mod-card .mc-bar{flex:1;height:5px;background:var(--border);border-radius:4px;overflow:hidden}
.mod-card .mc-bar i{display:block;height:100%;background:var(--teal);width:0}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-row .fchip{font-size:12.5px;border:1px solid var(--border);background:#fff;border-radius:20px;padding:4px 14px;cursor:pointer;color:var(--muted)}
.filter-row .fchip:hover{border-color:var(--primary);color:var(--primary)}
.filter-row .fchip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.src-table{width:100%;border-collapse:collapse;font-size:13px}
.src-table th{background:var(--bg2);padding:8px 10px;border:1px solid var(--border);text-align:left;font-size:12px;color:var(--muted);white-space:nowrap}
.src-table td{padding:9px 10px;border:1px solid var(--border);vertical-align:top;line-height:1.6}
.src-table td.t{font-weight:600;color:var(--text);min-width:200px}
.src-table td.m{color:var(--muted);font-size:12.5px}
.src-table tr.hl td{background:var(--primary-bg)}
.src-table a{font-weight:600;word-break:break-all}
/* 测验 */
.quiz-q{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:14px}
.quiz-q .q{font-weight:600;font-size:14.5px;margin-bottom:10px;display:flex;gap:8px}
.quiz-q .q .qn{font-family:var(--mono);color:var(--primary);flex:none}
.quiz-opt{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:7px;cursor:pointer;font-size:13.8px;transition:all .12s;line-height:1.55}
.quiz-opt:hover{border-color:var(--primary)}

<script>
"use strict";
/* ==================== 数据（由构建脚本注入） ==================== */
var COURSE = { modules: [], sources: [] };
/*__DATA__*/

/* ==================== 工具函数 ==================== */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function stripTags(html){ return html.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim(); }
function byId(arr, id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function srcById(id){ for(var i=0;i<COURSE.sources.length;i++) if(COURSE.sources[i].id===id) return COURSE.sources[i]; return null; }
var STORE_KEY = "pbi_progress_v1";
var store = { ok:true, data:{ sections:{}, tasks:{}, quiz:{} } };
try{
  var raw = localStorage.getItem(STORE_KEY);
  if(raw){ try{ store.data = JSON.parse(raw); }catch(e){} }
  localStorage.setItem(STORE_KEY, JSON.stringify(store.data));
}catch(e){ store.ok = false; }
function save(){ if(!store.ok) return; try{ localStorage.setItem(STORE_KEY, JSON.stringify(store.data)); }catch(e){ store.ok=false; renderStoreNote(); } }
function isSectionDone(sid){ return !!store.data.sections[sid]; }
function isTaskDone(tid){ return !!store.data.tasks[tid]; }
function renderStoreNote(){
  var n = $("storeNote");
  if(!n) return;
  if(!store.ok){ n.style.display="block"; n.textContent="⚠ 当前浏览器禁止本地存储，学习进度仅在本次会话有效。"; }
}
/* 扁平章节列表 */
var FLAT = [];
COURSE.modules.forEach(function(m){
  FLAT.push({ type:"module", id:m.id, mid:m.id, title:"模块 "+m.num+" · "+m.title, mod:m });
  m.sections.forEach(function(s){ FLAT.push({ type:"section", id:s.id, mid:m.id, title:s.title, mod:m, sec:s }); });
  FLAT.push({ type:"quiz", id:m.id+"-quiz", mid:m.id, title:"模块 "+m.num+" · 知识测试", mod:m });
});
function totalSections(){ var n=0; COURSE.modules.forEach(function(m){ n+=m.sections.length; }); return n; }
function doneSections(){ var n=0; COURSE.modules.forEach(function(m){ m.sections.forEach(function(s){ if(isSectionDone(s.id)) n++; }); }); return n; }
function moduleDone(m){ var d=0,t=0; m.sections.forEach(function(s){ t++; if(isSectionDone(s.id)) d++; }); return {done:d,total:t,pct:t?Math.round(d/t*100):0}; }
function totalTasks(){ var n=0; COURSE.modules.forEach(function(m){ if(m.exercise) n+=m.exercise.tasks.length; }); return n; }
function doneTasks(){ var n=0; COURSE.modules.forEach(function(m){ if(m.exercise) m.exercise.tasks.forEach(function(t){ if(isTaskDone(t.id)) n++; }); }); return n; }
function overallPct(){ var t=totalSections(); return t?Math.round(doneSections()/t*100):0; }
function escHtmlKeepB(s){ return esc(s).replace(/&lt;(\/?)(b|strong)&gt;/g,"<$1$2>"); }

/* ==================== 侧边导航 ==================== */
function renderNav(activeRoute){
  var nav = $("nav"); nav.innerHTML = "";
  function group(label){ var g=document.createElement("div"); g.className="nav-group"; g.textContent=label; nav.appendChild(g); }
  function item(o){
    var a=document.createElement("a");
    a.className="nav-item"+(o.active?" active":"")+(o.done?" done":"");
    a.href=o.href;
    a.innerHTML='<span class="ni">'+o.icon+'</span><span class="nm">'+esc(o.label)+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</span>'+(o.badge!=null?'<span class="nav-badge'+(o.badge==="✓"?" full":"")+'">'+o.badge+'</span>':'');
    nav.appendChild(a); return a;
  }
  group("课程总览");
  item({icon:"◈",label:"课程首页",href:"#/",active:activeRoute==="home"});
  item({icon:"➤",label:"学习路径",href:"#/path",active:activeRoute==="path"});
  item({icon:"✦",label:"实战项目",href:"#/project",active:activeRoute==="project"});
  item({icon:"▤",label:"资料库",href:"#/library",active:activeRoute==="library"});
  group("课程模块");
  COURSE.modules.forEach(function(m){
    var mp = moduleDone(m);
    var badge = mp.done===mp.total ? "✓" : (mp.done+"/"+mp.total);
    var a = item({icon:"M"+m.num,label:m.title,sub:m.sub,href:"#/m/"+m.id,active:activeRoute==="module:"+m.id,badge:badge,done:mp.done===mp.total});
    var wrap=document.createElement("div"); wrap.className="nav-sub";
    m.sections.forEach(function(s){
      var b=document.createElement("a");
      b.className="nav-item"+(activeRoute==="section:"+s.id?" active":"");
      b.href="#/m/"+m.id+"/"+s.id;
      b.innerHTML='<span class="dot'+(isSectionDone(s.id)?" on":"")+'">'+(isSectionDone(s.id)?"✓":"")+'</span><span class="nm">'+esc(s.title)+'</span>';
      wrap.appendChild(b);
    });
    var q=document.createElement("a");
    q.className="nav-item"+(activeRoute==="quiz:"+m.id?" active":"");
    q.href="#/m/"+m.id+"/quiz";
    q.innerHTML='<span class="dot">?</span><span class="nm">知识测试</span>';
    wrap.appendChild(q);
    nav.appendChild(wrap);
  });
}

  });
}

    + '</div>';
  /* 知识地图 */
  html += '<div class="home-sec"><h2>🗺 知识体系地图</h2>'

    + '</div>';
  /* 学习路径 */
  html += '<div class="home-sec"><h2>➤ 四阶段学习路线</h2>'

  html += '<div class="home-sec"><h2>📚 课程模块</h2><div class="desc">点击卡片进入模块。每个模块包含学习目标、概念体系、研究证据、方法工具、操作流程、案例、练习与自测。</div>'

    + '<div class="mod-cards" id="modCards">';
  COURSE.modules.forEach(function(m){
    var mp=moduleDone(m);
    html += '<a class="mod-card" data-stage="'+m.stage+'" href="#/m/'+m.id+'"><div class="mc-top"><span class="mc-no">模块 '+m.num+'</span><span class="mc-stage">阶段 '+["一","二","三","四"][m.stage-1]+'</span></div>'
      + '<h3>'+esc(m.title)+'</h3><p>'+esc(m.sub)+'</p>'
      + '<div class="mc-foot"><div class="mc-bar"><i style="width:'+mp.pct+'%"></i></div><span>'+mp.done+'/'+mp.total+' 节 · '+esc(m.hours)+'</span></div></a>';
  });
  html += '</div></div>';
  /* 首页模块筛选 */
  var mf = null;
  setTimeout(function(){
    mf = $("modFilter");
    if(!mf) return;

  /* 实战项目 */
  html += '<div class="home-sec"><h2>✦ 综合实战项目</h2>'

  renderNav("quiz:"+m.id);

    var correct=0, answered=0;
    m.quiz.forEach(function(q,qi){
      var wrap=document.querySelector('.quiz-q[data-q="'+qi+'"]');
      var sel=wrap.querySelector('input:checked');
      var exp=$("exp-"+qi);
      wrap.querySelectorAll(".quiz-opt").forEach(function(opt,oi){
        opt.classList.add("lock");
        if(oi===q.answer) opt.classList.add("correct");

      exp.classList.add("show");
      if(sel) answered++;
      if(sel && parseInt(sel.value,10)===q.answer) correct++;
    });
    var r=$("quizResult"); r.style.display="block";
    var pct=Math.round(correct/m.quiz.length*100);
    r.innerHTML='<div class="score">'+correct+' / '+m.quiz.length+'</div><div style="margin-top:6px;font-size:14px">'+(pct>=80?"掌握良好，可以进入下一模块。":pct>=60?"基本理解，建议回顾错题对应的章节。":"建议重读本模块后再测。")+'</div>';
    try{ store.data.quiz[m.id]={score:correct,total:m.quiz.length,at:Date.now()}; save(); }catch(e){}
  };
  $("quizReset").onclick=function(){ location.hash="#/m/"+m.id+"/quiz"; route(); };
}

  var pop=$("searchPop");
  q=q.trim();
  if(!q){ pop.classList.remove("show"); pop.innerHTML=""; return; }
  var ql=q.toLowerCase();
  var hits=[];
  SEARCH_INDEX.forEach(function(it){
    var ti=it.title.toLowerCase().indexOf(ql), bi=it.text.toLowerCase().indexOf(ql);
    if(ti>=0||bi>=0){ hits.push({it:it,score:(ti>=0?100:0)+(ti===0?50:0)+(bi>=0?10:0),ti:ti,bi:bi}); }
  });
  hits.sort(function(a,b){ return b.score-a.score; });
  hits=hits.slice(0,15);
  if(!hits.length){ pop.innerHTML='<div class="sr-empty">未找到与「'+esc(q)+'」匹配的内容。试试更短的关键词，或到 <a href="#/library">资料库</a> 浏览来源。</div>'; pop.classList.add("show"); return; }
  pop.innerHTML = hits.map(function(h,hi){
    var it=h.it;
    var title=esc(it.title), text=esc(it.text.slice(0,140));
    if(h.ti>=0){ title=esc(it.title.slice(0,h.ti))+'<span class="mt">'+esc(it.title.slice(h.ti,h.ti+q.length))+'</span>'+esc(it.title.slice(h.ti+q.length)); }
    if(h.bi>=0 && h.bi<130){ text=esc(it.text.slice(0,h.bi))+'<span class="mt">'+esc(it.text.slice(h.bi,h.bi+q.length))+'</span>'+esc(it.text.slice(h.bi+q.length,h.bi+q.length+60)); }
    return '<a class="sr-item" href="'+it.href+'"><div class="t"><span class="tagline">'+esc(it.type)+(typeof it.mod==="number"?" · M"+it.mod:"")+'</span>'+title+'</div><div class="d">'+text+'</div></a>';
  }).join("");
  pop.classList.add("show"); searchSel=-1;
  pop.querySelectorAll(".sr-item").forEach(function(a){ a.onclick=function(){ pop.classList.remove("show"); $("sbSearchInput").blur(); }; });
}

/* ==================== 路由 ==================== */
function route(){
  var h=location.hash||"#/";
  var parts=h.replace(/^#\/?/,"").split("/").filter(Boolean);
  var article=$("article");
  window.scrollTo(0,0);
  closeSidebar();
  if(parts.length===0){ renderHome(); }
  else if(parts[0]==="path"){ renderPath(); }
  else if(parts[0]==="project"){ renderProject(); }
  else if(parts[0]==="library"){ renderLibrary(parts[1]||null); }
  else if(parts[0]==="m"){
    var m=byId(COURSE.modules,parts[1]);
    if(!m){ renderHome(); return; }
    if(parts[2]==="quiz"||!parts[2]){ if(parts[2]==="quiz") renderQuizPage(m); else renderModulePage(m); }
    else{
      var s=null; m.sections.forEach(function(x){ if(x.id===parts[2]) s=x; });
      if(s) renderSectionPage(m,s); else renderModulePage(m);
    }
  }
  else renderHome();
  renderProgress(); renderStoreNote();
  updateReadBar();
}

/* ==================== 全局事件 ==================== */
function bindGlobal(){
  var input=$("sbSearchInput");
  input.addEventListener("input",function(){ doSearch(input.value); });
  input.addEventListener("keydown",function(e){
    var pop=$("searchPop"); var items=pop.querySelectorAll(".sr-item");
    if(e.key==="Escape"){ pop.classList.remove("show"); input.blur(); }
    else if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      if(!items.length) return;
      searchSel += (e.key==="ArrowDown"?1:-1);
      if(searchSel<0) searchSel=items.length-1; if(searchSel>=items.length) searchSel=0;
      items.forEach(function(a,i){ a.classList.toggle("sel",i===searchSel); });
      items[searchSel].scrollIntoView({block:"nearest"});
    }
    else if(e.key==="Enter"){
      var sel=pop.querySelector(".sr-item.sel")||items[0];
      if(sel){ location.hash=sel.getAttribute("href"); pop.classList.remove("show"); input.blur(); }
    }
  });
  input.addEventListener("focus",function(){ if(input.value.trim()) doSearch(input.value); });
  document.addEventListener("click",function(e){
    if(!e.target.closest(".sb-search")) $("searchPop").classList.remove("show");
    var doneBtn=e.target.closest("[data-done]");
    if(doneBtn){
      var sid=doneBtn.getAttribute("data-done");
      if(isSectionDone(sid)) delete store.data.sections[sid]; else store.data.sections[sid]=Date.now();
      save();
      doneBtn.classList.toggle("on");
      doneBtn.textContent = isSectionDone(sid)?"✓ 已学完（点击取消）":"标记为已学完";
      renderNav(currentRoute()); renderProgress();
      var sec=doneBtn.closest(".sec"); if(sec){ sec.style.borderColor = isSectionDone(sid)?"#BFE3DE":""; }
    }
    var tcb=e.target.closest("[data-task]");
    if(tcb && e.target.type==="checkbox"){
      var tid=tcb.getAttribute("data-task");
      if(isTaskDone(tid)) delete store.data.tasks[tid]; else store.data.tasks[tid]=Date.now();
      save(); tcb.classList.toggle("done", isTaskDone(tid));
      renderProgress();
    }
    /* 来源引用跳转 */
    var ref=e.target.closest("sup.ref");
    if(ref){ var rid=ref.getAttribute("data-src"); if(rid){ location.hash="#/library/"+rid; } }
  });
  $("hamburger").onclick=function(){ $("sidebar").classList.add("open"); $("overlay").classList.add("show"); };
  $("overlay").onclick=closeSidebar;
  $("resetBtn").onclick=function(){
    if(confirm("确定要清空全部学习进度、任务勾选与测试记录吗？此操作不可恢复。")){
      store.data={sections:{},tasks:{},quiz:{}}; save(); route();
    }
  };
  $("toTop").onclick=function(){ window.scrollTo({top:0,behavior:"smooth"}); };
  window.addEventListener("scroll",updateReadBar,{passive:true});
  window.addEventListener("hashchange",route);
}
function closeSidebar(){ $("sidebar").classList.remove("open"); $("overlay").classList.remove("show"); }
function currentRoute(){
  var h=location.hash||"#/"; var p=h.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(!p.length) return "home";
  if(p[0]==="m"){ if(p[2]==="quiz") return "quiz:"+p[1]; if(p[2]) return "section:"+p[2]; return "module:"+p[1]; }
  return p[0];
}
function updateReadBar(){
  var st=window.scrollY, dh=document.body.scrollHeight-window.innerHeight;
  var p= dh>0 ? Math.min(100, st/dh*100) : 0;
  $("readBar").style.width=p+"%";
  $("toTop").style.display = st>500?"flex":"none";
}
