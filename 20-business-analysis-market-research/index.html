<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="商业分析与市场研究系统化自学知识地图：18个知识模块、6个学习阶段、3个综合项目、12个可复用工具模板与可核验的权威资源索引。">
<title>商业分析与市场研究 · 系统化自学知识地图 | Business Analysis &amp; Market Research</title>
<style>
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --ink:#202A35; --ink2:#687482;
  --accent:#285F70; --accent2:#6D8F83; --warm:#C68B52;
  --line:#E3E7E5; --tint:#EAF1EF; --tint2:#F1F4F2;
  --danger:#A4553F;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --en:"Inter","Aptos",Arial,sans-serif;
  --mono:"Cascadia Mono","Consolas","SF Mono","Courier New",monospace;
  --sh:0 1px 2px rgba(32,42,53,.05),0 1px 3px rgba(32,42,53,.04);
  --sh2:0 2px 8px rgba(32,42,53,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(40,95,112,.28)}
a:hover{border-bottom-color:var(--accent)}
::selection{background:rgba(40,95,112,.18)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1660px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand .t1{font-family:var(--en);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.brand .t2{font-size:12px;color:var(--ink2);white-space:nowrap}
.nav-tabs{display:flex;gap:2px;margin-left:8px;flex-wrap:wrap}
.nav-tabs button{background:none;border:none;padding:7px 13px;font-size:13.5px;color:var(--ink2);border-radius:7px;font-weight:500}
.nav-tabs button:hover{background:var(--tint2);color:var(--ink)}
.nav-tabs button.on{background:var(--tint);color:var(--accent);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.searchwrap{position:relative}
.searchwrap input{width:220px;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px;color:var(--ink)}
.searchwrap input:focus{border-color:var(--accent2);outline:none;box-shadow:0 0 0 3px rgba(40,95,112,.10)}
.searchwrap .sicon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:13px}
.sresults{position:absolute;top:calc(100% + 6px);right:0;width:380px;max-height:420px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh2);display:none;z-index:80}
.sresults.open{display:block}
.sresults .sr-group{font-size:11.5px;color:var(--ink2);padding:8px 12px 4px;letter-spacing:.05em;text-transform:uppercase}
.sresults .sr-item{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 12px;font-size:13px;color:var(--ink);border-bottom:1px solid var(--tint2)}
.sresults .sr-item:hover{background:var(--tint)}
.sresults .sr-item .tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--tint);color:var(--accent);margin-right:8px;font-weight:600}
.sresults .sr-empty{padding:14px;font-size:13px;color:var(--ink2)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.prog .bar{width:88px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.prog button{background:none;border:1px solid var(--line);border-radius:6px;font-size:11.5px;color:var(--ink2);padding:3px 8px}
.prog button:hover{border-color:var(--accent2);color:var(--accent)}
.hamburger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:16px;color:var(--ink)}

/* ---------- layout ---------- */
.layout{max-width:1660px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr) 302px;align-items:start}
.sidebar{position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;border-right:1px solid var(--line);padding:18px 12px 40px 18px;background:var(--bg)}
.sb-title{font-size:11.5px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase;margin:0 4px 8px;font-weight:600}
.sb-search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;margin-bottom:14px;background:var(--surface)}
.sb-search:focus{border-color:var(--accent2);outline:none}
.sb-stage{margin-bottom:14px}
.sb-stage-h{display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:12px;color:var(--ink2);font-weight:600}
.sb-stage-h .st{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:5px;background:var(--accent);color:#fff;font-size:11px;font-family:var(--en);font-weight:700}
.sb-mod{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;padding:6px 8px;border-radius:7px;font-size:13px;color:var(--ink);line-height:1.4}
.sb-mod:hover{background:var(--surface);box-shadow:var(--sh)}
.sb-mod.on{background:var(--surface);box-shadow:inset 2px 0 0 var(--accent);font-weight:600;color:var(--accent)}
.sb-mod .code{font-family:var(--en);font-size:10.5px;font-weight:700;color:var(--ink2);background:var(--tint2);border-radius:4px;padding:1px 5px;flex:none}
.sb-mod.on .code{background:var(--tint);color:var(--accent)}
.sb-mod .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;margin-left:auto}
.sb-mod .dot.done{background:var(--accent2)}
.sb-hidden{display:none}
.main{min-width:0;padding:26px 34px 60px}
.aux{position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;border-left:1px solid var(--line);padding:26px 20px 60px;background:var(--bg)}
.aux-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.aux-card h4{font-size:12px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;margin-bottom:8px;font-weight:700}
.aux-card ul{list-style:none}
.aux-card li{font-size:13px;padding:4px 0;border-bottom:1px dashed var(--tint2);display:flex;gap:8px;align-items:flex-start}
.aux-card li:last-child{border-bottom:none}
.aux-card li .k{color:var(--accent2);font-weight:700;font-size:11px;font-family:var(--en);flex:none;padding-top:2px}
.aux-link{display:block;width:100%;text-align:left;background:none;border:none;font-size:13px;color:var(--ink);padding:5px 6px;border-radius:6px}
.aux-link:hover{background:var(--tint)}
.aux-check{display:flex;gap:8px;font-size:13px;padding:5px 0;align-items:flex-start;cursor:pointer}
.aux-check input{margin-top:4px;accent-color:var(--accent)}
.footer{border-top:1px solid var(--line);padding:26px 34px 40px;color:var(--ink2);font-size:12.5px;max-width:1660px;margin:0 auto}
.overlay{display:none;position:fixed;inset:0;background:rgba(32,42,53,.35);z-index:55}
.overlay.open{display:block}

/* ---------- generic content ---------- */
.hero{padding:8px 0 4px}
.hero .kicker{font-family:var(--en);font-size:12px;letter-spacing:.14em;color:var(--accent2);font-weight:700;text-transform:uppercase;margin-bottom:10px}
.hero h1{font-family:var(--en);font-size:34px;line-height:1.2;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.hero h1 .cn{display:block;font-family:var(--sans);font-size:21px;font-weight:700;color:var(--ink);margin-top:6px;letter-spacing:.01em}
.hero p.lead{max-width:760px;color:var(--ink2);font-size:14.5px;margin-top:12px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 8px;max-width:760px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{font-family:var(--en);font-size:24px;font-weight:800;color:var(--accent);display:block;line-height:1.2}
.stat span{font-size:12px;color:var(--ink2)}
.section{margin-top:38px}
.section>h2{font-size:21px;font-weight:800;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.section>h2 .no{font-family:var(--en);font-size:13px;color:var(--accent2);font-weight:700}
.section>.desc{color:var(--ink2);font-size:13.5px;max-width:820px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:8px}
.card h3 .en{font-family:var(--en);font-weight:600;font-size:12.5px;color:var(--ink2);margin-left:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--tint2);border:1px solid transparent;color:var(--ink2);border-radius:20px;padding:3px 12px;font-size:12.5px;font-weight:500}
button.chip:hover{border-color:var(--accent2);color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .st{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:5px;background:var(--accent);color:#fff;font-size:10.5px;font-family:var(--en);font-weight:700;padding:0 3px}
.chip.on .st{background:rgba(255,255,255,.25)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:2px 8px;letter-spacing:.02em}
.b-core{background:var(--accent);color:#fff}
.b-adv{background:var(--accent2);color:#fff}
.b-opt{background:#EDE6DA;color:#7A5B33}
.b-lv1{background:var(--accent);color:#fff}
.b-lv2{background:var(--accent2);color:#fff}
.b-lv3{background:#EDE6DA;color:#7A5B33}
.b-lv4{background:var(--tint);color:var(--accent)}
.note{background:var(--tint);border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;color:#3d4a56;margin:12px 0}
.note.warn{background:#F7F0E6;border-left-color:var(--warm)}
.note b{color:var(--ink)}
details.fold{border:1px solid var(--line);border-radius:9px;background:var(--surface);margin:10px 0;box-shadow:var(--sh)}
details.fold>summary{cursor:pointer;list-style:none;padding:11px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--accent2);font-size:11px;transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary:hover{background:var(--tint2)}
details.fold .fold-body{padding:4px 18px 16px;border-top:1px solid var(--tint2)}
details.fold .fold-body>:first-child{margin-top:10px}
.method{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:12px 0;box-shadow:var(--sh);overflow:hidden}
.method-h{padding:13px 18px;background:var(--tint2);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.method-h .n{font-weight:800;font-size:15px}
.method-h .en{font-family:var(--en);font-size:12px;color:var(--ink2);font-weight:600}
.method-b{padding:6px 18px 16px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:4px 14px;font-size:13.5px;margin:10px 0}
.kv dt{color:var(--ink2);font-weight:700;font-size:12.5px;padding-top:2px}
.kv dd{margin:0}
.kv dd.ok{color:#3F6B4F}
.kv dd.no{color:var(--danger)}
ol.steps{counter-reset:st;list-style:none;margin:10px 0}
ol.steps li{counter-increment:st;position:relative;padding:5px 0 5px 34px;font-size:13.5px}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:8px;width:21px;height:21px;border-radius:50%;background:var(--tint);color:var(--accent);font-family:var(--en);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
ul.tick{list-style:none}
ul.tick li{position:relative;padding:3px 0 3px 20px;font-size:13.5px}
ul.tick li::before{content:"—";position:absolute;left:2px;color:var(--accent2)}
.formula{background:var(--tint2);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-family:var(--mono);font-size:13.5px;margin:10px 0;overflow-x:auto;white-space:pre-wrap;color:#2c3a46}
.vars{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.vars th,.vars td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.vars th{background:var(--tint2);font-size:12px;color:var(--ink2);font-weight:700}
.vars td:first-child{font-family:var(--mono);white-space:nowrap;color:var(--accent)}
.exbox{border:1px dashed var(--accent2);border-radius:8px;padding:12px 16px;margin:10px 0;background:rgba(234,241,239,.4);font-size:13.5px}
.exbox .ex-t{font-weight:700;font-size:12.5px;color:var(--accent);letter-spacing:.04em;margin-bottom:6px}
.res-item{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--tint2);align-items:flex-start}
.res-item:last-child{border-bottom:none}
.res-item .rl{flex:none;width:52px;padding-top:2px}
.res-item .rb{min-width:0;flex:1}
.res-item .rt{font-size:14px;font-weight:600}
.res-item .rm{font-size:12px;color:var(--ink2);margin-top:1px}
.res-item .rp{font-size:12.5px;color:#3d4a56;margin-top:4px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--sh)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
table.tbl th{background:var(--tint2);font-size:12px;color:var(--ink2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--tint2);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:rgba(234,241,239,.35)}
table.tbl td:first-child{font-weight:700;white-space:nowrap}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0;box-shadow:var(--sh)}
.fig svg{width:100%;height:auto;display:block}
.fig-cap{font-size:12px;color:var(--ink2);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.mm-chip{cursor:pointer}
.mm-chip rect{transition:filter .15s}
.mm-chip:hover rect{filter:brightness(.95)}
.dg-node{cursor:pointer}
.dg-node circle{transition:r .15s}
.dg-node:hover circle{stroke:var(--accent);stroke-width:2.5}
.dg-edge{transition:opacity .2s}
.dg-dim{opacity:.12}
.dg-hi{stroke:var(--accent)!important;stroke-width:2.4px!important;opacity:1!important}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent2);margin-right:6px;vertical-align:middle}
.legend i.d{border-top-style:dashed;border-top-color:var(--ink2)}
.tam-wrap{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.tam-ctrl{display:grid;gap:10px}
.tam-ctrl label{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;font-weight:600}
.tam-ctrl label output{font-family:var(--en);color:var(--accent);font-weight:700}
.tam-ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.tam-out{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.tam-out .o{background:var(--tint);border-radius:8px;padding:10px;text-align:center}
.tam-out .o b{display:block;font-family:var(--en);font-size:17px;color:var(--accent)}
.tam-out .o span{font-size:11.5px;color:var(--ink2)}
.proj-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.proj-h .pid{font-family:var(--en);font-weight:800;color:var(--accent2);font-size:13px}
.stepgrid{counter-reset:pg;list-style:none;margin:12px 0}
.stepgrid li{counter-increment:pg;position:relative;padding:6px 0 6px 40px;font-size:13.5px}
.stepgrid li::before{content:counter(pg);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;font-family:var(--en);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stepgrid li b{display:block}
.tpl-block{margin:12px 0}
.tpl-block h5{font-size:13px;color:var(--accent);margin-bottom:6px;letter-spacing:.03em}
.ck{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px;cursor:pointer}
.ck input{margin-top:4px;accent-color:var(--accent)}
.q-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.q-head .qcode{font-family:var(--en);font-size:12px;font-weight:800;color:var(--accent2)}
.q-head .qtitle{font-size:20px;font-weight:800;line-height:1.3}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.modnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.modnav button{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-size:13px;color:var(--ink);text-align:left;box-shadow:var(--sh)}
.modnav button:hover{border-color:var(--accent2);color:var(--accent)}
.modnav button .d{display:block;font-size:11px;color:var(--ink2)}
.modnav button:disabled{opacity:.4;cursor:default}
.checkline{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--tint2);cursor:pointer}
.checkline:last-child{border-bottom:none}
.checkline input{margin-top:4px;accent-color:var(--accent)}
.checkline.done span{color:var(--ink2);text-decoration:line-through}
.kv-chips{display:flex;gap:6px;flex-wrap:wrap}
.kv-chips .chip{font-size:11.5px;padding:2px 10px}
.qc-list{counter-reset:qc;list-style:none}
.qc-list li{counter-increment:qc;position:relative;padding:4px 0 4px 30px;font-size:13.5px}
.qc-list li::before{content:"✓";position:absolute;left:2px;top:5px;color:var(--accent2);font-weight:700}
.src-yes{color:#3F6B4F;font-weight:700}
.empty-tip{font-size:13px;color:var(--ink2);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:9px}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .layout{grid-template-columns:232px minmax(0,1fr)}
  .aux{position:static;height:auto;border-left:none;border-top:1px solid var(--line);grid-column:1 / -1;order:3;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;padding:22px 34px 40px}
  .aux-card{margin-bottom:0}
  .main{grid-column:2}
  .sidebar{grid-row:1 / span 2}
}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:57px;bottom:0;width:264px;background:var(--surface);z-index:58;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--sh2);grid-row:auto}
  .sidebar.open{transform:none}
  .main{grid-column:1;padding:20px 18px 50px}
  .aux{padding:18px}
  .hamburger{display:block}
  .nav-tabs{display:none}
  .statrow{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
  .tam-wrap{grid-template-columns:1fr}
  .hero h1{font-size:27px}
  .hero h1 .cn{font-size:17px}
  .searchwrap input{width:150px}
  .sresults{width:min(340px,calc(100vw - 40px))}
  .brand .t1{font-size:13px}
  .brand .t2{display:none}
  .prog .bar{width:56px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media print{
  .topbar,.sidebar,.aux,.footer,.overlay{display:none}
  .main{padding:0}
  body{background:#fff}
}

      {h:"敏感性", items:["留存率 ±、客单价 ±、CAC ± 对结论的影响","最需验证的假设排序"]}
    ],
    fields:[
      {k:"指标卡", v:"公式 / 取值 / 来源 / 口径"},
      {k:"分组建模", v:"按渠道或客群拆分，不用总体平均"},
      {k:"阈值语境", v:"引用 LTV/CAC 等经验值时必须注明来源模式"}
    ],
    note:"阈值（如 LTV/CAC≥3）来自特定商业模式的经验总结，不是普适定律。"
  },
  {
    id:"T9", name:"商业假设登记表", purpose:"把不确定性集中管理，按「影响×不确定性÷验证成本」排验证顺序。",
    logic:"假设必须可证伪；证据分层记录；排序决定研究计划，而不是「有什么数据验什么」。",
    blocks:[
      {h:"假设条目", items:["假设陈述（含数字与条件）","类型：市场/客户/技术/运营/财务","可证伪条件：什么证据推翻它"]},
      {h:"证据与置信度", items:["现有证据与来源","证据分层：事实/估计/推算/判断","置信度：高/中/低 + 理由"]},
      {h:"优先级", items:["影响程度（对结论的影响）","不确定性（当前证据多寡）","验证成本与周期","优先级 = 影响 × 不确定性 ÷ 成本"]},
      {h:"状态跟踪", items:["未验证 / 验证中 / 已支持 / 已推翻","更新日期与依据"]}
    ],
    fields:[
      {k:"验证计划", v:"动作 / 负责人 / 截止 / 阈值"},
      {k:"推翻记录", v:"被推翻的假设同样重要——记录它改变了什么"}
    ],
    note:"登记表是活的：每次新证据进入都更新，而不是一次性文档。"
  },
  {
    id:"T10", name:"情景与敏感性分析模板", purpose:"在不确定性下做稳健决策，并找出最值得获取信息的参数。",
    logic:"情景内部一致（变量联动），不是只动一个参数；敏感性回答「哪个参数最关键」；结论必须带条件句。",
    blocks:[
      {h:"驱动变量", items:["识别 2–4 个关键驱动变量","变量间的依赖关系（同向/反向/阈值）"]},
      {h:"三情景", items:["基准：当前证据的中性外推","乐观：关键假设成立的组合","悲观：关键假设失效的组合","每个情景写「早期信号」与应对预案"]},
      {h:"敏感性（龙卷风）", items:["基准结果","5–8 个参数各取低/高值（其余固定）","按结果变化幅度排序","优先获取前 2–3 个参数的真实数据"]},
      {h:"盈亏平衡反解", items:["令结果=阈值，反解关键参数临界值","「至少要达到什么水平」"]},
      {h:"决策含义", items:["哪个方案在多情景下都稳健","什么证据出现就改变结论","结论的置信度与依据"]}
    ],
    fields:[
      {k:"情景卡", v:"变量组合 / 结果 / 早期信号 / 预案"},
      {k:"概率（如使用）", v:"须可校准，否则只做情景不做加权"},
      {k:"条件句", v:"「如果 X 达到 Y，则结论变为 Z」"}
    ],
    note:"虚假精确（无数据的两三位小数）比诚实的区间更有害。"
  },
  {
    id:"T11", name:"市场进入策略评估表", purpose:"在多候选市场与多进入模式中排序，并设计分阶段验证。",
    logic:"吸引力与能力必须同时评估；评分模型必须做权重敏感性；进入决策拆成阶段门。",
    blocks:[
      {h:"市场筛选矩阵", items:["维度：规模/增速/盈利性/竞争强度/壁垒/合规风险/自身匹配度","每格数据 + 来源 + 置信度","权重（与决策者确认）+ 加权分","权重 ±20% 敏感性：排序是否稳定"]},
      {h:"进入模式比较", items:["自营 / 代理 / 经销 / 合作 / 平台","四维评估：资源投入、控制度、速度、风险","与自身能力的匹配"]},
      {h:"阶段门计划", items:["阶段 0 桌面验证（规模/壁垒/合规）","阶段 1 最小暴露（渠道测试/预售）","阶段 2 单位经济验证","阶段 3 规模化复制","每阶段：继续/转向/停止判据"]},
      {h:"退出机制", items:["止损条件与触发信号","退出成本与时间"]}
    ],
    fields:[
      {k:"市场卡", v:"吸引力 / 能力 / 综合分 / 关键风险"},
      {k:"模式卡", v:"资源 / 控制 / 速度 / 风险 / 学习价值"},
      {k:"判据卡", v:"阶段 / 假设 / 指标 / 阈值 / 判据"}
    ],
    note:"「模式在他处成功」不等于「在此处能赢」——本地网络效应与资源门槛必须单独评估。"
  },
  {
    id:"T12", name:"商业研究报告提纲", purpose:"把研究输出组织成决策者可用的报告。",
    logic:"执行摘要先行；正文按「问题→方法→证据→分析→结论」；附录承载审计轨迹。",
    blocks:[
      {h:"执行摘要（1–2 页）", items:["结论（决策建议）","核心依据（3–5 条）","主要风险与不确定性","下一步行动与跟踪指标"]},
      {h:"正文", items:["研究问题与决策背景","方法与数据来源（含口径）","分析主体（结构/规模/客户/模式/经济性）","情景与风险","结论与决策选项"]},
      {h:"附录", items:["数据表与估算过程","来源登记表（标题/机构/年份/链接/访问日期）","访谈记录与编码","假设登记表","术语表"]},
      {h:"披露清单", items:["数据来源与统计期","口径与估算方法","假设与不确定性","已知局限","利益冲突（如适用）"]},
      {h:"质量自检", items:["每个结论可追溯证据","图表与正文一致、单位口径已标注","事实/估计/推论已分层","读者 10 分钟能复述结论与依据"]}
    ],
    fields:[
      {k:"版本记录", v:"版本 / 日期 / 修改内容"},
      {k:"同行评审", v:"评审人意见与回应"}
    ],
    note:"写不出执行摘要，通常说明研究没有收敛——回到问题定义。"
  }
];
</script>

<script>
"use strict";
/* ==================== 工具函数 ==================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function modById(id){ return MODULES.filter(m => m.id === id)[0]; }
function resById(id){ return RESOURCES.filter(r => r.id === id)[0]; }
function tplById(id){ return TEMPLATES.filter(t => t.id === id)[0]; }
function fmtYi(v){ const y = v / 1e8; return (y >= 100 ? y.toFixed(1) : y.toFixed(2)); }
const LEVELS = ["必读","进阶","实战","延伸"];
function levelBadge(lv){ const c = {"必读":"b-lv1","进阶":"b-lv2","实战":"b-lv3","延伸":"b-lv4"}[lv] || "b-lv4"; return '<span class="badge ' + c + '">' + esc(lv) + "</span>"; }
function priBadge(p){ const c = p === "核心必学" ? "b-core" : (p === "进阶掌握" ? "b-adv" : "b-opt"); return '<span class="badge ' + c + '">' + esc(p) + "</span>"; }

/* ==================== 进度 ==================== */
const PKEY = "bamr.progress.v1";
let progress = { t:{}, c:{} };
try { const s = localStorage.getItem(PKEY); if (s) { const p = JSON.parse(s); if (p && typeof p === "object") { progress.t = p.t || {}; progress.c = p.c || {}; } } } catch (e) {}
function saveProgress(){ try { localStorage.setItem(PKEY, JSON.stringify(progress)); } catch (e) {} }
const TOTAL_T = MODULES.reduce((a, m) => a + m.tasks.length, 0);
const TOTAL_C = MODULES.reduce((a, m) => a + m.checkpoints.length, 0);
const TOTAL_ALL = TOTAL_T + TOTAL_C;
function doneCount(){ let n = 0; for (const k in progress.t) if (progress.t[k]) n++; for (const k in progress.c) if (progress.c[k]) n++; return n; }
function moduleDone(m){
  let need = m.tasks.length + m.checkpoints.length, got = 0;
  m.tasks.forEach((_, i) => { if (progress.t["t" + m.id + "-" + i]) got++; });
  m.checkpoints.forEach((_, i) => { if (progress.c["c" + m.id + "-" + i]) got++; });
  return need > 0 && got === need;
}
function updateProgressUI(){
  const d = doneCount();
  $("#progText").textContent = d + " / " + TOTAL_ALL;
  $("#progBar").style.width = (TOTAL_ALL ? (d / TOTAL_ALL * 100) : 0) + "%";
  $$("#sidebar .sb-mod").forEach(b => {
    const id = parseInt(b.getAttribute("data-mid"), 10);
    const dot = $(".dot", b);
    if (dot) dot.classList.toggle("done", moduleDone(modById(id)));
  });
}

/* ==================== 路由 ==================== */
const state = { view: "overview", moduleId: null, stageFilter: "all", resLevel: "all", resMod: "all", resQuery: "" };
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/");
  return { path: parts[0] || "overview", arg: parts[1] || null };
}
function router(){
  const r = parseHash();
  if (r.path === "module" && r.arg !== null && modById(parseInt(r.arg, 10))) {
    state.view = "module"; state.moduleId = parseInt(r.arg, 10);
  } else if (r.path === "projects") { state.view = "projects"; }
  else if (r.path === "templates") { state.view = "templates"; }
  else if (r.path === "resources") {
    state.view = "resources";
    if (r.arg !== null && modById(parseInt(r.arg, 10))) state.resMod = r.arg;
  }
  else if (r.path === "quality") { state.view = "quality"; }
  else { state.view = "overview"; state.moduleId = null; }
  render();
  window.scrollTo(0, 0);
  closeMenu();
}

/* ==================== 侧边导航与顶部标签 ==================== */
function renderNav(){
  $("#navTabs").innerHTML = [
    ["overview", "总览"],
    ["__module__", "模块"],
    ["projects", "综合项目"],
    ["templates", "工具箱"],
    ["resources", "资源索引"],
    ["quality", "质量核验"]
  ].map(t => {
    const key = t[0] === "__module__" ? "module" : t[0];
    const route = key === "module" ? "#/module/" + (state.moduleId === null ? 0 : state.moduleId) : "#/" + key;
    const on = state.view === key;
    return '<button type="button" data-route="' + route + '" class="' + (on ? "on" : "") + '"' + (on ? ' aria-current="page"' : "") + ">" + t[1] + "</button>";
  }).join("");
}
function renderSidebar(){
  let html = '<div class="sb-title">学习阶段与模块</div>';
  html += '<input class="sb-search" id="sbSearch" type="search" placeholder="按关键词定位模块…" aria-label="模块导航内搜索">';
  STAGES.forEach(st => {
    html += '<div class="sb-stage" data-stage="' + st.id + '">';
    html += '<div class="sb-stage-h"><span class="st">' + st.id + '</span>' + esc(st.name) + "</div>";
    st.mods.forEach(mid => {
      const m = modById(mid);
      html += '<button type="button" class="sb-mod' + (state.view === "module" && state.moduleId === mid ? " on" : "") + '" data-route="#/module/' + mid + '" data-mid="' + mid + '" data-kw="' + esc((m.title + " " + m.en + " " + m.short + " " + m.concepts.map(c => c.t + " " + c.en).join(" ") + " " + m.methods.map(x => x.n).join(" ")).toLowerCase()) + '"><span class="code">' + m.code + '</span><span>' + esc(m.title) + '</span><span class="dot" title="完成状态"></span></button>';
    });
    html += "</div>";
  });
  $("#sidebar").innerHTML = html;
}

/* ==================== SVG：全局学习地图 ==================== */
function learnMapSVG(){
  const colW = 164, gap = 12, x0 = 14, chipH = 38, chipGap = 8, y0 = 62;
  let s = '<svg viewBox="0 0 1080 306" role="img" aria-label="全局学习地图：六个学习阶段与十八个模块的路径图">';
  s += "<title>全局学习地图</title><desc>按学习阶段 A 至 F 展示全部模块，点击模块可进入详情。</desc>";
  STAGES.forEach((st, i) => {
    const x = x0 + i * (colW + gap);
    const active = state.stageFilter === "all" || state.stageFilter === st.id;
    s += '<g opacity="' + (active ? 1 : 0.32) + '">';
    s += '<rect x="' + x + '" y="10" width="' + colW + '" height="42" rx="9" fill="' + (state.stageFilter === st.id ? "#285F70" : "#EAF1EF") + '" stroke="#6D8F83"/>';
    s += '<text x="' + (x + 12) + '" y="28" font-size="11" font-weight="700" fill="' + (state.stageFilter === st.id ? "#FFFFFF" : "#285F70") + '" font-family="Inter,Arial,sans-serif">阶段 ' + st.id + "</text>";
    s += '<text x="' + (x + 12) + '" y="44" font-size="12" font-weight="700" fill="' + (state.stageFilter === st.id ? "#FFFFFF" : "#202A35") + '">' + esc(st.name) + "</text>";
    st.mods.forEach((mid, k) => {
      const m = modById(mid);
      const y = y0 + k * (chipH + chipGap);
      const on = state.view === "module" && state.moduleId === mid;
      s += '<g class="mm-chip" data-route="#/module/' + mid + '" tabindex="0" role="link" aria-label="' + esc(m.code + " " + m.title) + '">';
      s += '<rect x="' + x + '" y="' + y + '" width="' + colW + '" height="' + chipH + '" rx="8" fill="' + (on ? "#285F70" : "#FFFFFF") + '" stroke="' + (on ? "#285F70" : "#E3E7E5") + '"/>';
      s += '<text x="' + (x + 10) + '" y="' + (y + 16) + '" font-size="10" font-weight="700" fill="' + (on ? "#BFD4D9" : "#687482") + '" font-family="Inter,Arial,sans-serif">' + m.code + " · " + esc(m.priority) + "</text>";
      s += '<text x="' + (x + 10) + '" y="' + (y + 31) + '" font-size="12" font-weight="600" fill="' + (on ? "#FFFFFF" : "#202A35") + '">' + esc(m.short) + "</text>";
      s += "</g>";
    });
    if (i < STAGES.length - 1) {
      const ax = x + colW + 2;
      s += '<path d="M ' + ax + " 31 L " + (ax + gap - 4) + ' 31" stroke="#6D8F83" stroke-width="2" marker-end="url(#mmArrow)"/>';
    }
    s += "</g>";
  });
  s += '<defs><marker id="mmArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#6D8F83"/></marker></defs>';
  s += '<text x="14" y="300" font-size="11" fill="#687482">阶段顺序即建议学习顺序；点击任意模块进入学习单元。颜色深浅仅表示选中状态。</text>';
  s += "</svg>";
  return s;
}

/* ==================== SVG：模块依赖关系图 ==================== */
function edgePath(a, b){
  const p1 = DEPPOS[a], p2 = DEPPOS[b], hw = 63, hh = 20;
  let sx, sy, ex, ey, c1, c2;
  if (Math.abs(p1[0] - p2[0]) < 12) {
    const dir = p2[1] > p1[1] ? 1 : -1;
    sx = p1[0]; sy = p1[1] + dir * hh; ex = p2[0]; ey = p2[1] - dir * hh;
    c1 = sx + 26 * dir; c2 = ex - 26 * dir;
    return "M " + sx + " " + sy + " C " + c1 + " " + (sy + dir * 30) + ", " + c2 + " " + (ey - dir * 30) + ", " + ex + " " + ey;
  }
  const dir = p2[0] > p1[0] ? 1 : -1;
  sx = p1[0] + dir * hw; sy = p1[1]; ex = p2[0] - dir * hw; ey = p2[1];
  c1 = sx + dir * 46; c2 = ex - dir * 46;
  return "M " + sx + " " + sy + " C " + c1 + " " + sy + ", " + c2 + " " + ey + ", " + ex + " " + ey;
}
function depGraphSVG(){
  let s = '<svg viewBox="0 0 1080 500" role="img" aria-label="模块依赖关系图">';
  s += "<title>模块依赖关系图</title><desc>展示十八个模块之间的前置、支撑与关联关系。实线为前置，虚线为支撑或关联。点击节点进入模块。</desc>";

      s += '<text x="' + (x + 12) + '" y="' + (y + 46 + j * 17) + '" font-size="10.5" fill="#687482">' + esc(ln) + "</text>";

    }

  });

}

function tamPanel(){
  return '<div class="tam-wrap"><div class="fig" style="margin:0">' + tamSVG() + "</div>" +
    '<div><div class="tam-ctrl">' +
    '<label>目标客户总数 N（万人）<output id="oN">500</label><input type="range" id="tN" min="10" max="2000" step="10" value="500">' +
    '<label>可服务比例 a（%）<output id="oA">40</label><input type="range" id="tA" min="1" max="100" value="40">' +
    '<label>可获取比例 b（%）<output id="oB">12</label><input type="range" id="tB" min="1" max="60" value="12">' +
    '<label>年均客单价 ARPU（¥）<output id="oP">600</label><input type="range" id="tP" min="10" max="5000" step="10" value="600">' +
    "</div>" +
    '<div class="tam-out"><div class="o"><b id="oT">—</b><span>TAM（亿元/年）</span></div><div class="o"><b id="oS">—</b><span>SAM（亿元/年）</span></div><div class="o"><b id="oO">—</b><span>SOM（亿元/年）</span></div></div>' +
    '<div class="formula" style="font-size:12.5px">TAM = N × ARPU\nSAM = TAM × a\nSOM = SAM × b\nSAM/TAM = <tspan id="r1">—</tspan>　SOM/SAM = <tspan id="r2">—</tspan></div>' +
    '<div class="note warn" style="margin-bottom:0">滑块参数均为<b>教学示例</b>，不对应任何真实市场。用法：调整参数观察三层如何联动，体会「口径改变则结论改变」；SOM 必须另附产能、渠道与获客能力依据，不能只由比例推出。</div>' +
    "</div></div>";
}
function bindTam(){
  const N = $("#tN"), A = $("#tA"), B = $("#tB"), P = $("#tP");
  if (!N) return;
  function upd(){
    const n = +N.value, a = +A.value, b = +B.value, p = +P.value;
    $("#oN").textContent = n; $("#oA").textContent = a; $("#oB").textContent = b; $("#oP").textContent = p;
    const tam = n * 1e4 * p, sam = tam * a / 100, som = sam * b / 100;
    $("#tamV").textContent = fmtYi(tam); $("#samV").textContent = fmtYi(sam); $("#somV").textContent = fmtYi(som);
    $("#oT").textContent = fmtYi(tam); $("#oS").textContent = fmtYi(sam); $("#oO").textContent = fmtYi(som);
    $("#r1").textContent = (a / 100 * 100).toFixed(0) + "%"; $("#r2").textContent = (b / 100 * 100).toFixed(0) + "%";
  }
  [N, A, B, P].forEach(el => el.addEventListener("input", upd));
  upd();
}

/* ==================== 搜索 ==================== */
const SEARCH_INDEX = [];
MODULES.forEach(m => {
  SEARCH_INDEX.push({
    type: "模块", label: m.code + " " + m.title, sub: m.en,
    route: "#/module/" + m.id,
    kw: (m.title + " " + m.en + " " + m.short + " " + m.question + " " + m.concepts.map(c => c.t + " " + c.en).join(" ") + " " + m.methods.map(x => x.n + " " + x.en).join(" ")).toLowerCase()
  });
  m.res.forEach(id => {
    const r = resById(id);
    if (r) SEARCH_INDEX.push({ type: "资源", label: r.title, sub: r.org, route: "#/resources/" + m.id, kw: (r.title + " " + r.org + " " + r.purpose + " " + r.level + " " + r.type).toLowerCase() });
  });
});
TEMPLATES.forEach(t => SEARCH_INDEX.push({ type: "模板", label: t.id + " " + t.name, sub: t.purpose.slice(0, 40), route: "#/templates", kw: (t.name + " " + t.purpose + " " + t.logic + " " + t.blocks.map(b => b.h + b.items.join("")).join(" ")).toLowerCase() }));
PROJECTS.forEach(p => SEARCH_INDEX.push({ type: "项目", label: p.id + " " + p.title, sub: p.summary.slice(0, 40), route: "#/projects", kw: (p.title + " " + p.summary + " " + p.steps.map(s => s.t + s.d).join(" ")).toLowerCase() }));

function bindGlobalSearch(){
  const input = $("#globalSearch"), box = $("#searchResults");
  function render(list){
    if (!list.length) { box.innerHTML = '<div class="sr-empty">没有匹配结果。试试英文术语或更短的关键词。</div>'; box.classList.add("open"); return; }
    let html = "";
    const groups = {};
    list.forEach(r => { (groups[r.type] = groups[r.type] || []).push(r); });
    Object.keys(groups).forEach(g => {
      html += '<div class="sr-group">' + g + "</div>";
      groups[g].slice(0, 6).forEach(r => {
        html += '<button type="button" class="sr-item" data-route="' + r.route + '"><span class="tag">' + r.type + "</span>" + esc(r.label) + '<br><span style="font-size:11.5px;color:var(--ink2)">' + esc(r.sub) + "</span></button>";
      });
    });
    box.innerHTML = html;
    box.classList.add("open");
  }
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 1) { box.classList.remove("open"); return; }
    const list = SEARCH_INDEX.filter(r => r.kw.indexOf(q) >= 0 || r.label.toLowerCase().indexOf(q) >= 0).slice(0, 12);
    render(list);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const q = input.value.trim().toLowerCase();
      const first = SEARCH_INDEX.filter(r => r.kw.indexOf(q) >= 0 || r.label.toLowerCase().indexOf(q) >= 0)[0];
      if (first) { location.hash = first.route; box.classList.remove("open"); input.blur(); }
    } else if (e.key === "Escape") { box.classList.remove("open"); input.blur(); }
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".searchwrap")) box.classList.remove("open");
  });
}

/* ==================== 侧栏筛选 ==================== */
function bindSidebarSearch(){
  document.addEventListener("input", e => {
    if (e.target && e.target.id === "sbSearch") {
      const q = e.target.value.trim().toLowerCase();
      $$("#sidebar .sb-mod").forEach(b => {
        b.classList.toggle("sb-hidden", q.length > 0 && b.getAttribute("data-kw").indexOf(q) < 0);
      });
      $$("#sidebar .sb-stage").forEach(s => {
        const any = $$(".sb-mod", s).some(b => !b.classList.contains("sb-hidden"));
        s.style.display = any ? "" : "none";
      });
    }
    if (e.target && e.target.id === "resQuery") {
      state.resQuery = e.target.value.trim().toLowerCase();
      $$("#main .res-item").forEach(it => {
        const txt = it.textContent.toLowerCase();
        it.style.display = (!state.resQuery || txt.indexOf(state.resQuery) >= 0) ? "" : "none";
      });
    }
  });
  document.addEventListener("change", e => {
    if (e.target && e.target.id === "resModSel") {
      state.resMod = e.target.value;
      render();
    }
  });
}

/* ==================== 渲染与事件 ==================== */
function render(){
  renderNav();
  renderSidebar();
  const main = $("#main");
  if (state.view === "module") main.innerHTML = renderModuleView();
  else if (state.view === "projects") main.innerHTML = renderProjects();
  else if (state.view === "templates") main.innerHTML = renderTemplates();
  else if (state.view === "resources") main.innerHTML = renderResources();
  else if (state.view === "quality") main.innerHTML = renderQuality();
  else main.innerHTML = renderOverview();
  $("#aux").innerHTML = renderAux();
  if (state.view === "overview") bindTam();
  updateProgressUI();
}
function closeMenu(){ $("#sidebar").classList.remove("open"); $("#overlay").classList.remove("open"); }
function bindEvents(){
  window.addEventListener("hashchange", router);
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-route]");
    if (t) {
      if (t.tagName === "A") return;
      e.preventDefault();
      if (location.hash === t.getAttribute("data-route")) { router(); }
      else location.hash = t.getAttribute("data-route");
      return;
    }
    const act = e.target.closest("[data-action]");
    if (act) {
      const a = act.getAttribute("data-action");
      if (a === "stagefilter") { state.stageFilter = act.getAttribute("data-stage"); render(); }
      else if (a === "resfilter") {
        state.resLevel = "all";
        const lv = act.getAttribute("data-level");
        $$("#resFilters .chip").forEach(c => c.classList.remove("on"));
        act.classList.add("on");
        $$("#main .res-item").forEach(it => { it.style.display = (lv === "all" || it.getAttribute("data-level") === lv) ? "" : "none"; });
      }
      else if (a === "reslevel") { state.resLevel = act.getAttribute("data-level"); render(); }
      else if (a === "reset") {
        if (confirm("确定要清空全部学习进度吗？此操作不可撤销。")) {
          progress = { t:{}, c:{} }; saveProgress(); render();
        }
      }
    }
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target && e.target.hasAttribute && e.target.hasAttribute("data-route") && e.target.tagName !== "BUTTON" && e.target.tagName !== "A") {
      e.preventDefault(); location.hash = e.target.getAttribute("data-route");
    }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t && t.hasAttribute && t.hasAttribute("data-tid")) {
      progress.t[t.getAttribute("data-tid")] = t.checked;
      saveProgress();
      const line = t.closest(".checkline"); if (line) line.classList.toggle("done", t.checked);
      updateProgressUI();
    }
    if (t && t.hasAttribute && t.hasAttribute("data-cid")) {
      progress.c[t.getAttribute("data-cid")] = t.checked;
      saveProgress();
      const line = t.closest(".checkline"); if (line) line.classList.toggle("done", t.checked);
      updateProgressUI();
    }
  });
  $("#btnReset").addEventListener("click", () => {
    if (confirm("确定要清空全部学习进度吗？此操作不可撤销。")) { progress = { t:{}, c:{} }; saveProgress(); render(); }
  });
  $("#btnMenu").addEventListener("click", () => { $("#sidebar").classList.add("open"); $("#overlay").classList.add("open"); });
  $("#overlay").addEventListener("click", closeMenu);
  document.addEventListener("mouseover", e => {
    const n = e.target.closest ? e.target.closest(".dg-node") : null;
    if (!n) return;
    const id = parseInt(n.getAttribute("data-mid"), 10);
    MODULES.forEach(m => { const g = document.getElementById("dgn" + m.id); if (g) g.style.opacity = (m.id === id) ? 1 : 0.35; });
    DEPEDGES.forEach((ed, i) => {
      const p = document.getElementById("dge" + i), l = document.getElementById("dgl" + i);
      const inc = ed[0] === id || ed[1] === id;
      if (p) { p.style.opacity = inc ? 1 : 0.08; p.classList.toggle("dg-hi", inc); }
      if (l) l.style.opacity = inc ? 1 : 0.08;
    });
  });
  document.addEventListener("mouseout", e => {
    if (e.target.closest && e.target.closest(".dg-node")) {
      MODULES.forEach(m => { const g = document.getElementById("dgn" + m.id); if (g) g.style.opacity = 1; });
      DEPEDGES.forEach((ed, i) => {
        const p = document.getElementById("dge" + i), l = document.getElementById("dgl" + i);
        if (p) { p.style.opacity = 0.85; p.classList.remove("dg-hi"); }
        if (l) l.style.opacity = 1;
      });
    }
  });
}

function init(){

  bindSidebarSearch();
  router();
}
init();
