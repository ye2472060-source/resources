<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sales &amp; Negotiation Mastery — 销售与谈判能力系统学习。17个模块、五阶段学习路径、工具库、综合案例与模拟训练。">
<title>Sales &amp; Negotiation Mastery · 销售与谈判能力系统学习</title>
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#182230; --ink2:#667085;
  --navy:#233B5D; --blue:#4776A8; --teal:#7BA69A;
  --blue-soft:#EAF0F7; --green-soft:#EAF2EF; --line:#E2E7EE;
  --warn-soft:#FBF3E8; --warn-line:#E4C79A; --warn-ink:#8A5A1E;
  --risk-soft:#FBECEC; --risk-line:#E3B4B4; --risk-ink:#9B3A3A;
  --dispute-soft:#F2EEF7; --dispute-line:#C9BCE0; --dispute-ink:#5B4A86;
  --font-cn:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-en:Inter,"Segoe UI",Arial,sans-serif;
  --mono:"SF Mono",Consolas,"Courier New",monospace;
  --r:10px; --shadow:0 1px 2px rgba(24,34,48,.05);
  --topbar-h:58px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-cn);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.35;color:var(--navy);font-weight:700}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
p{margin:.65em 0}
strong{color:var(--navy)}
code{font-family:var(--mono);font-size:.9em;background:var(--blue-soft);padding:.1em .4em;border-radius:4px;color:var(--navy)}
::selection{background:var(--blue-soft)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ============ 顶栏 ============ */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--line);z-index:100;display:flex;align-items:center;gap:18px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-en);font-weight:700;color:var(--navy);white-space:nowrap;cursor:pointer}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;letter-spacing:-.5px}
.brand small{font-family:var(--font-cn);font-weight:500;color:var(--ink2);font-size:12px;margin-left:2px}
.topnav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav a{padding:6px 11px;border-radius:7px;color:var(--ink2);font-size:14px;white-space:nowrap;font-weight:500}
.topnav a:hover{background:var(--blue-soft);color:var(--navy);text-decoration:none}
.topnav a.on{background:var(--navy);color:#fff}
.top-right{display:flex;align-items:center;gap:10px}
.searchbox{position:relative}
.searchbox input{width:210px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px 0 32px;font-size:14px;color:var(--ink);font-family:var(--font-cn);transition:width .2s}
.searchbox input:focus{width:260px;border-color:var(--blue);outline:none;background:#fff}
.searchbox .ic{position:absolute;left:9px;top:8px;color:var(--ink2);font-size:15px}
.search-results{position:absolute;top:42px;right:0;width:380px;max-height:420px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(24,34,48,.14);display:none;z-index:200}
.search-results.open{display:block}
.search-results .sr-item{display:block;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.search-results .sr-item:last-child{border-bottom:0}
.search-results .sr-item:hover{background:var(--blue-soft)}
.search-results .sr-item .t{font-size:14px;font-weight:600;color:var(--navy)}
.search-results .sr-item .c{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-results .sr-empty{padding:16px;color:var(--ink2);font-size:13px;text-align:center}
.prog-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.prog-chip b{color:var(--navy);font-family:var(--font-en)}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:38px;height:36px;font-size:17px;color:var(--navy);cursor:pointer}

/* ============ 主体布局 ============ */
.app{display:grid;grid-template-columns:248px minmax(0,1fr) 216px;gap:26px;max-width:1440px;margin:0 auto;padding:calc(var(--topbar-h) + 22px) 22px 60px}
.sidebar{position:sticky;top:calc(var(--topbar-h) + 22px);height:calc(100vh - var(--topbar-h) - 44px);overflow-y:auto;padding-right:6px}
.sidebar h4{font-size:12px;color:var(--ink2);letter-spacing:.08em;margin:18px 0 8px;font-weight:600}
.sidebar h4:first-child{margin-top:0}
.side-nav a{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:7px;font-size:13.5px;color:var(--ink2);line-height:1.45;border-left:2px solid transparent}
.side-nav a:hover{background:var(--blue-soft);color:var(--navy);text-decoration:none}
.side-nav a.on{background:var(--blue-soft);color:var(--navy);font-weight:600;border-left-color:var(--blue)}
.side-nav a .no{font-family:var(--font-en);font-size:11px;color:var(--ink2);min-width:20px}
.side-nav a .dot{width:7px;height:7px;border-radius:50%;background:var(--line);margin-left:auto;flex:none}
.side-nav a.done .dot{background:var(--teal)}
.rail{position:sticky;top:calc(var(--topbar-h) + 22px);height:calc(100vh - var(--topbar-h) - 44px);overflow-y:auto;font-size:13px}
.rail h4{font-size:12px;color:var(--ink2);letter-spacing:.08em;margin:0 0 8px}
.rail a{display:block;padding:4px 8px;border-radius:6px;color:var(--ink2);line-height:1.5}
.rail a:hover{background:var(--blue-soft);color:var(--navy);text-decoration:none}
.rail a.on{color:var(--navy);font-weight:600;background:var(--blue-soft)}
.rail .rail-tools{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}

/* ============ 页面通用 ============ */
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:34px 38px 28px;margin-bottom:22px}
.kicker{font-size:12.5px;letter-spacing:.14em;color:var(--blue);font-weight:700;margin:0 0 10px;text-transform:uppercase}
.page-head h1{font-size:31px;margin:0 0 12px}
.lead{font-size:16.5px;color:var(--ink2);max-width:760px;margin:0}
.goals{margin:18px 0 0;padding:14px 18px;background:var(--blue-soft);border-radius:10px;list-style:none;display:grid;gap:6px}
.goals li{font-size:14px;color:var(--navy);padding-left:20px;position:relative}
.goals li::before{content:"✓";position:absolute;left:0;color:var(--teal);font-weight:700}
.page-toc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:22px;font-size:13.5px}
.page-toc b{font-size:12px;color:var(--ink2);letter-spacing:.1em;display:block;margin-bottom:6px}
.page-toc ol{margin:0;padding-left:20px;columns:2;column-gap:36px}
.page-toc li{margin:2px 0;break-inside:avoid}
.page-toc a{color:var(--ink2)}
.page-toc a:hover{color:var(--blue)}

.prose{max-width:860px}
.prose h2{font-size:23px;margin:44px 0 14px;padding-top:10px;border-top:1px solid var(--line)}
.prose h2:first-child{margin-top:6px;border-top:0;padding-top:0}
.prose h3{font-size:18.5px;margin:30px 0 10px}
.prose h4{font-size:16px;margin:22px 0 8px}
.prose p,.prose li{font-size:15.5px}
.prose ul,.prose ol{padding-left:24px;margin:.6em 0}
.prose li{margin:.3em 0}
.prose>h2 .h2no{color:var(--blue);font-family:var(--font-en);margin-right:8px;font-size:.85em}

/* 提示框 */
.callout{border-radius:10px;padding:14px 18px;margin:18px 0;border:1px solid var(--line);background:var(--surface);font-size:14.5px}
.callout p{margin:.3em 0}
.callout .c-title{font-weight:700;font-size:13px;letter-spacing:.05em;margin-bottom:4px}
.c-evidence{background:var(--green-soft);border-color:#CFE3DB}
.c-evidence .c-title{color:#3E6B5C}
.c-theory{background:var(--blue-soft);border-color:#CBD9E8}
.c-theory .c-title{color:var(--navy)}
.c-practice{background:#F4F6F8;border-color:var(--line)}
.c-practice .c-title{color:var(--ink2)}
.c-example{background:#FFFDF7;border-color:#E8DFC6}
.c-example .c-title{color:#7A6524}
.c-warn{background:var(--warn-soft);border-color:var(--warn-line)}
.c-warn .c-title{color:var(--warn-ink)}
.c-risk{background:var(--risk-soft);border-color:var(--risk-line)}
.c-risk .c-title{color:var(--risk-ink)}
.c-dispute{background:var(--dispute-soft);border-color:var(--dispute-line)}
.c-dispute .c-title{color:var(--dispute-ink)}

/* 卡片与网格 */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14px}
.card h4{margin:0 0 8px;font-size:15px}
.card p,.card li{font-size:13.8px;color:var(--ink2);line-height:1.7}
.card p:last-child,.card ul:last-child{margin-bottom:0}

/* 表格 */
.table-wrap{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.8px;min-width:560px}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-weight:600;font-size:13px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.65}
tbody tr:nth-child(even){background:#FAFBFD}
td:first-child{font-weight:600;color:var(--navy);white-space:nowrap}

/* 定义 */
.def{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:12px 16px;margin:12px 0}
.def .def-term{font-weight:700;color:var(--navy);margin:0 0 2px;font-size:15px}
.def p:last-child{margin:0;font-size:14px;color:var(--ink2)}

/* 步骤 */
.steps{list-style:none;padding:0;margin:18px 0;counter-reset:step}
.steps li{counter-increment:step;position:relative;padding:10px 14px 10px 52px;background:var(--surface);border:1px solid var(--line);border-radius:9px;margin:8px 0;font-size:14.5px}
.steps li::before{content:counter(step);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--navy);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:var(--font-en)}
.steps li b{color:var(--navy)}

/* 图示 */
.fig-slot{background:var(--surface);border:1px dashed var(--line);border-radius:10px;margin:20px 0;padding:0;overflow:hidden}
.fig-slot figcaption{font-size:12.5px;color:var(--ink2);padding:8px 14px;border-top:1px solid var(--line);background:#FAFBFD}
.fig-slot svg{display:block;width:100%;height:auto}
figure{margin:20px 0}

/* 参考与工具引用 */
.ref-list{margin:16px 0;font-size:13.5px}
.ref-list p{margin:.35em 0;color:var(--ink2);line-height:1.65}
.ref-tag{display:inline-block;font-family:var(--font-en);font-size:11px;font-weight:700;background:var(--blue-soft);color:var(--navy);border-radius:5px;padding:1px 6px;margin-right:6px;cursor:pointer;border:1px solid #CBD9E8}
.ref-tag:hover{background:var(--navy);color:#fff}
.tool-ref{font-size:14px;background:var(--green-soft);border-radius:8px;padding:8px 14px;display:inline-block;margin:10px 0}
.note{font-size:13.5px;color:var(--ink2)}

/* 测验 */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:26px 0}
.quiz .q-title{font-weight:700;color:var(--navy);margin:0 0 12px;font-size:15px}
.q-list{margin:0;padding-left:0;list-style:none;counter-reset:q}
.q-list>li{counter-increment:q;padding:14px 0;border-top:1px solid var(--line)}
.q-list>li:first-child{border-top:0}
.q-stem{font-size:14.5px;font-weight:600;color:var(--ink);margin:0 0 8px}
.q-stem::before{content:"Q" counter(q) " ";color:var(--blue);font-family:var(--font-en)}
.q-opts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.q-opts li{font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff;transition:all .12s;user-select:none}
.q-opts li:hover{border-color:var(--blue);background:var(--blue-soft)}
.q-opts li.picked{border-color:var(--blue);background:var(--blue-soft)}
.q-opts li.right{border-color:var(--teal);background:var(--green-soft);color:#2F5D4E;font-weight:600}
.q-opts li.wrong{border-color:var(--risk-line);background:var(--risk-soft);color:var(--risk-ink)}
.q-exp{display:none;margin-top:10px;font-size:13.5px;color:var(--ink2);background:#FAFBFD;border-radius:8px;padding:10px 14px}
.q-exp.show{display:block}
.quiz .q-score{font-size:13px;color:var(--ink2);margin-top:12px;text-align:right}

/* 练习 */
.practice{background:var(--green-soft);border:1px solid #CFE3DB;border-radius:12px;padding:18px 22px;margin:26px 0}
.practice h4{margin:0 0 10px;color:#3E6B5C}
.practice ol,.practice ul{margin:0;padding-left:22px}
.practice li{font-size:14px;margin:.4em 0;color:#2C4A40}

/* 模块页脚 */
.mod-foot{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--navy);border-radius:9px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-cn);transition:all .15s}
.btn:hover{border-color:var(--blue);background:var(--blue-soft)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--blue);border-color:var(--blue)}
.btn.done{background:var(--green-soft);border-color:#CFE3DB;color:#3E6B5C}
.btn-complete{align-self:flex-start}
.fill-hint{margin-top:10px}
.related{font-size:14px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.related h4{margin:0 0 6px;font-size:13px;color:var(--ink2);letter-spacing:.06em}
.related p{margin:0}

/* ============ 首页 ============ */
.hero{background:linear-gradient(135deg,#233B5D 0%,#2E4C74 55%,#4776A8 100%);border-radius:16px;padding:46px 44px;color:#fff;margin-bottom:24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .eyebrow{font-family:var(--font-en);font-size:12.5px;letter-spacing:.22em;opacity:.75;margin:0 0 12px;font-weight:600}
.hero h1{color:#fff;font-size:41px;margin:0 0 8px;letter-spacing:-.5px}
.hero .sub{font-size:19px;opacity:.92;margin:0 0 18px;font-weight:500}
.hero p.desc{font-size:15px;opacity:.85;max-width:720px;margin:0 0 24px;line-height:1.85}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.22)}
.hero .btn-primary{background:#fff;color:var(--navy);border-color:#fff}
.hero .btn-primary:hover{background:var(--blue-soft);color:var(--navy)}
.hero-stats{display:flex;gap:34px;margin-top:28px;flex-wrap:wrap}
.hero-stats div{font-size:13px;opacity:.8}
.hero-stats b{display:block;font-size:24px;font-family:var(--font-en);font-weight:700;opacity:1;line-height:1.2}
.home-sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 30px;margin-bottom:22px}
.home-sec h2{font-size:20px;margin:0 0 4px}
.home-sec .sec-sub{font-size:13.5px;color:var(--ink2);margin:0 0 18px}
.stage-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stage-card{border:1px solid var(--line);border-radius:11px;padding:15px 15px 13px;cursor:pointer;transition:all .15s;background:#fff;position:relative}
.stage-card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(35,59,93,.08);transform:translateY(-2px)}
.stage-card .no{font-family:var(--font-en);font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.1em}
.stage-card h3{font-size:15px;margin:6px 0 6px}
.stage-card p{font-size:12.5px;color:var(--ink2);margin:0;line-height:1.6}
.stage-card .bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.stage-card .bar i{display:block;height:100%;background:var(--teal);border-radius:2px}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px}
.mod-card{border:1px solid var(--line);border-radius:11px;padding:14px 16px;cursor:pointer;background:#fff;transition:all .15s;display:flex;gap:12px;align-items:flex-start}
.mod-card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(35,59,93,.08)}
.mod-card .num{font-family:var(--font-en);font-size:19px;font-weight:800;color:var(--blue);line-height:1.2;min-width:34px}
.mod-card h3{font-size:14.5px;margin:0 0 3px}
.mod-card p{font-size:12px;color:var(--ink2);margin:0;line-height:1.5}
.mod-card .st{font-size:11px;color:var(--teal);font-weight:600;margin-top:5px;display:block}
.mod-card.completed .num{color:var(--teal)}
.tool-quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tool-quick a{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--navy);font-weight:600;background:#fff;display:flex;align-items:center;gap:9px}
.tool-quick a:hover{border-color:var(--blue);background:var(--blue-soft);text-decoration:none}
.tool-quick a .tico{color:var(--teal);font-size:15px}
.continue-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.continue-box .ctext{flex:1;min-width:220px}
.continue-box .ctext b{color:var(--navy)}
.continue-box .ctext p{margin:4px 0 0;font-size:13.5px;color:var(--ink2)}

/* ============ 知识地图 / 路径 ============ */
.map-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;overflow-x:auto}
.map-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:14px 2px 0}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.path-stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 30px;margin-bottom:18px;position:relative;border-left:4px solid var(--blue)}
.path-stage .ps-kicker{font-size:12px;letter-spacing:.16em;color:var(--blue);font-weight:700;margin:0 0 6px}
.path-stage h2{font-size:21px;margin:0 0 10px}
.path-stage .ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.path-stage .ps-grid h4{font-size:13px;color:var(--ink2);letter-spacing:.06em;margin:0 0 6px}
.path-stage ul{margin:0;padding-left:20px;font-size:14px}
.path-stage li{margin:.25em 0;color:var(--ink2)}
.path-stage .ps-meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.path-stage .ps-meta b{color:var(--navy)}

/* ============ 工具库 ============ */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:24px 28px;margin-bottom:20px}
.tool-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tool-head h3{margin:0;font-size:18.5px}
.tool-when{font-size:14px;color:var(--ink2);margin:6px 0 14px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 10px;background:var(--blue-soft);color:var(--navy);white-space:nowrap}
.pill-teal{background:var(--green-soft);color:#3E6B5C}
.pill-stage{background:#F4F6F8;color:var(--ink2)}
details.fill{margin:14px 0}
details.fill summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--blue);padding:6px 0}
details.fill summary:hover{color:var(--navy)}
details.case-b summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--blue);padding:8px 12px;background:var(--blue-soft);border-radius:8px;margin:8px 0}
details.case-b summary:hover{color:var(--navy)}
details.case-b[open] summary{border-radius:8px 8px 0 0}
.calc-slot{margin:16px 0}
.calc{background:#FAFBFD;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:16px 0}
.calc h4{margin:0 0 4px;font-size:15.5px}
.calc .calc-desc{font-size:13px;color:var(--ink2);margin:0 0 14px}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.calc-grid label{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:4px;font-weight:600}
.calc-grid input,.calc-grid select{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:14px;font-family:var(--font-en);background:#fff;color:var(--ink)}
.calc-grid input:focus,.calc-grid select:focus{border-color:var(--blue);outline:none}
.calc-out{background:var(--navy);color:#fff;border-radius:10px;padding:14px 18px;font-size:14px}
.calc-out .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.18)}
.calc-out .row:last-child{border-bottom:0}
.calc-out .row b{font-family:var(--font-en)}
.calc-out .verdict{font-weight:700;color:#FFD9A8;margin-top:8px;font-size:14.5px}
.calc-out .ok{color:#9FE0C4}
.calc-out .bad{color:#FFB4B4}
.calc-note{font-size:12px;color:var(--ink2);margin-top:10px}
.calc-table{width:100%;margin-top:10px}
.calc-table th{background:var(--blue);font-size:12px}
.calc-table td{font-size:13px}
.calc-table input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;font-size:13px;font-family:var(--font-en)}
.fill-table input,.fill-table textarea,.fill-table select{border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%;font-size:13.5px;font-family:var(--font-cn);background:#fff;color:var(--ink)}
.fill-table textarea{min-height:60px;resize:vertical}
.fill-table input:focus,.fill-table textarea:focus{border-color:var(--blue);outline:none}
td.ce{background:#FFFDF5;box-shadow:inset 0 0 0 1px var(--warn-line);cursor:text}
td.ce:focus{outline:2px solid var(--blue);outline-offset:-2px}

/* ============ 案例 / 模拟 ============ */
.case{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:26px 30px;margin-bottom:26px}
.case h2{margin-top:0}
.sim{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:24px 28px;margin-bottom:20px}
.sim-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sim-head h3{margin:0;font-size:18px}
.sim-stage{display:none;border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}
.sim-stage:first-of-type{display:block;border-top:0;padding-top:0;margin-top:0}
.sim-stage h4{margin:0 0 8px;font-size:15.5px}
.sim-stage .dialogue{background:#FAFBFD;border-radius:9px;padding:12px 16px;font-size:14px;margin:10px 0}
.sim-stage .dialogue p{margin:.4em 0}
.sim-stage .dialogue .who{font-weight:700;color:var(--navy)}
.sim-ctrl{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sim-progress{font-size:12.5px;color:var(--ink2)}
.sim-done{display:none;font-size:13px;color:#3E6B5C;font-weight:600}

/* ============ 测评 ============ */
.rubric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:16px}
.rubric h3{margin:0 0 4px;font-size:16.5px}
.rubric .rd{font-size:13.5px;color:var(--ink2);margin:0 0 12px}
.self-rate{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:24px 28px;margin-bottom:20px}
.sr-row{display:grid;grid-template-columns:1fr 150px 90px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sr-row:last-child{border-bottom:0}
.sr-row .lbl{color:var(--navy);font-weight:600}
.sr-row input[type=range]{width:100%;accent-color:var(--blue)}
.sr-row .val{font-family:var(--font-en);font-weight:700;color:var(--blue);text-align:right}
.radar-box{display:flex;justify-content:center;padding:10px}

/* ============ 词典 / 参考 ============ */
.gloss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.gloss-item{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:16px 18px;font-size:13.5px}
.gloss-item .gloss-term{font-weight:700;color:var(--navy);margin:0 0 2px;font-size:15px;font-family:var(--font-en)}
.gloss-item .gloss-full{font-size:12.5px;color:var(--blue);margin:0 0 6px;font-weight:600}
.gloss-item p{font-size:13.5px;color:var(--ink2);margin:0 0 6px;line-height:1.7}
.gloss-item .gloss-see{font-size:12px;margin:0}
.ref-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ref-filter button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 14px;font-size:13px;color:var(--ink2);cursor:pointer;font-family:var(--font-cn)}
.ref-filter button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ref-item{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:16px 20px;margin-bottom:12px;font-size:13.5px}
.ref-item h4{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ref-item h4 .rid{font-family:var(--font-en);color:var(--blue);font-size:13px}
.ref-item .rmeta{font-size:12.5px;color:var(--ink2);margin:2px 0}
.ref-item .ruse{font-size:13.5px;margin:6px 0 0;color:var(--ink)}
.ref-item .rlim{font-size:12.5px;color:var(--warn-ink);margin:4px 0 0}
.ref-item a{word-break:break-all;font-size:12.5px}

/* 页脚 */
.site-foot{border-top:1px solid var(--line);margin-top:40px;padding:26px 22px 40px;text-align:center;color:var(--ink2);font-size:12.5px;line-height:1.9}
.site-foot b{color:var(--navy)}

/* 高亮动画 */
.hl{animation:hl 2.2s ease}
@keyframes hl{0%,60%{background:#FFF3D6}100%{background:transparent}}

/* 笔记 */
.note-area{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 18px}
.note-area label{font-size:13px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between}
.note-area label span{font-weight:400;color:var(--ink2);font-size:12px}
.note-area textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;font-family:var(--font-cn);margin-top:8px;min-height:70px;resize:vertical;background:#FAFBFD}
.note-area textarea:focus{border-color:var(--blue);outline:none;background:#fff}

/* ============ 响应式 ============ */
@media (max-width:1180px){
  .app{grid-template-columns:230px minmax(0,1fr)}
  .rail{display:none}
}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr);padding:calc(var(--topbar-h) + 16px) 16px 50px}
  .sidebar{position:fixed;left:-280px;top:var(--topbar-h);width:270px;background:#fff;border-right:1px solid var(--line);z-index:90;padding:18px;transition:left .25s;height:calc(100vh - var(--topbar-h))}
  .sidebar.open{left:0;box-shadow:12px 0 32px rgba(24,34,48,.12)}
  .menu-btn{display:block}
  .topnav{display:none}
  .topnav.open{display:flex;position:absolute;top:var(--topbar-h);left:0;right:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;flex-wrap:wrap;z-index:95}
  .searchbox input{width:150px}
  .searchbox input:focus{width:180px}
  .search-results{width:min(420px,calc(100vw - 32px));right:0}
  .page-head{padding:24px 20px}
  .page-head h1{font-size:25px}
  .hero{padding:30px 24px}
  .hero h1{font-size:29px}
  .stage-cards{grid-template-columns:1fr 1fr}
  .grid-2,.grid-3,.path-stage .ps-grid{grid-template-columns:1fr}
  .page-toc ol{columns:1}
  .prose h2{font-size:20px}
  .prose p,.prose li{font-size:15px}
  .sr-row{grid-template-columns:1fr;gap:4px}
  .sr-row .val{text-align:left}
}
@media (max-width:560px){
  body{font-size:15px}
  .stage-cards{grid-template-columns:1fr}
  .hero h1{font-size:25px}
  .hero .sub{font-size:16px}
  .brand small{display:none}
  .prog-chip .pc-text{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
@media print{
  .topbar,.sidebar,.rail,.mod-foot,.quiz,.note-area{display:none}
  .page{display:block!important}
  body{background:#fff}
}
</style>
</head>
