<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据分析与商业决策 · 交互式自学平台</title>
<meta name="description" content="从数据处理到业务洞察的完整自学知识体系：Excel、SQL、GA4、统计学、可视化与商业决策。">
<style>
:root{
  --navy:#172B4D; --navy2:#223F6E; --navy-bg:#EDF1F8;
  --teal:#0F766E; --teal-bg:#EAF6F4; --teal-deep:#0B5A54;
  --amber:#D97706; --amber-bg:#FDF3E3; --amber-deep:#9A5B08;
  --bg:#F6F8FB; --card:#FFFFFF;
  --text:#243247; --muted:#64748B; --border:#E2E8F0;
  --code-bg:#F4F7FB; --code-text:#1B2A41;
  --mono:"Cascadia Code","JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono","Courier New",monospace;
  --shadow:0 1px 2px rgba(23,43,77,.05),0 4px 14px rgba(23,43,77,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
code,kbd,pre{font-family:var(--mono)}
::selection{background:#CBD5E1}

/* ---------- 布局骨架 ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:266px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:60;transition:transform .25s ease}
.sidebar-brand{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.sidebar-brand .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--navy);letter-spacing:.5px}
.sidebar-brand .logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.sidebar-brand .sub{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.3px}
.nav{flex:1;overflow-y:auto;padding:10px 12px 20px}
.nav-group{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin:16px 8px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--text);font-size:13.5px;cursor:pointer;border-left:3px solid transparent;user-select:none}
.nav-item:hover{background:var(--navy-bg);text-decoration:none}
.nav-item.active{background:var(--teal-bg);color:var(--teal-deep);border-left-color:var(--teal);font-weight:600}
.nav-item .ni{width:18px;text-align:center;font-size:13px;color:var(--muted);flex:none}
.nav-item.active .ni{color:var(--teal)}
.nav-sub{padding-left:14px}
.nav-sub .nav-item{font-size:12.8px;padding:6px 10px}
.nav-badge{margin-left:auto;font-size:10.5px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:0 7px;line-height:16px}
.sidebar-foot{border-top:1px solid var(--border);padding:12px 16px;font-size:11.5px;color:var(--muted)}
.sidebar-foot .mini-bar{height:5px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.sidebar-foot .mini-bar i{display:block;height:100%;background:var(--teal)}
.main{margin-left:266px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:rgba(246,248,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 26px}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb b{color:var(--navy);font-weight:600}
.crumb .sep{color:#B6C2D4}
.hamburger{display:none;border:1px solid var(--border);background:#fff;border-radius:8px;width:36px;height:36px;font-size:17px;color:var(--navy);cursor:pointer;flex:none}
.search-wrap{margin-left:auto;position:relative;flex:1;max-width:460px;min-width:170px}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:7px 12px}
.search-box:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.search-box input{border:none;outline:none;flex:1;font-size:13.5px;background:transparent;color:var(--text);font-family:inherit}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:390px;overflow-y:auto;display:none;z-index:80}
.search-results.show{display:block}
.sr-item{display:block;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--navy-bg)}
.sr-item .t{font-size:13.5px;font-weight:600;color:var(--navy)}
.sr-item .d{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-item .tags{font-size:10.5px;color:var(--teal-deep);margin-right:8px}
.sr-empty{padding:14px;color:var(--muted);font-size:13px;text-align:center}
.top-progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex:none}
.top-progress .bar{width:90px;height:6px;background:var(--border);border-radius:4px;overflow:hidden}
.top-progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#14B8A6)}
.content{max-width:1380px;width:100%;margin:0 auto;padding:26px 30px 110px}
.overlay{display:none;position:fixed;inset:0;background:rgba(23,43,77,.35);z-index:55}
.overlay.show{display:block}

/* ---------- 通用组件 ---------- */
.hero{background:linear-gradient(120deg,var(--navy) 0%,#1D3E6B 55%,#0F766E 130%);border-radius:16px;color:#fff;padding:38px 40px;margin-bottom:26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:290px;height:290px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero h1{font-size:32px;letter-spacing:1px;line-height:1.3}
.hero .sub{font-size:15px;opacity:.85;margin-top:10px;max-width:760px}
.hero .meta{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hero .meta div{font-size:12.5px;opacity:.75}
.hero .meta b{display:block;font-size:21px;opacity:1;font-weight:700}
.sec{margin:34px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec h2{font-size:21px;color:var(--navy);letter-spacing:.5px}
.sec .desc{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:20px;padding:1px 10px;border:1px solid var(--border);background:#fff;color:var(--muted);line-height:20px;white-space:nowrap}
.chip.teal{background:var(--teal-bg);border-color:#BCE3DE;color:var(--teal-deep)}
.chip.amber{background:var(--amber-bg);border-color:#F3D9AE;color:var(--amber-deep)}
.chip.navy{background:var(--navy-bg);border-color:#C9D5E8;color:var(--navy)}
.chip.gray{background:#F1F5F9;color:#52637A}
.chip.red{background:#FDECEA;border-color:#F5C6C0;color:#9A2F22}
.lvl{font-weight:700}
.lvl.L0{color:#52637A}.lvl.L1{color:var(--teal)}.lvl.L2{color:var(--amber)}.lvl.L3{color:var(--amber-deep)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:9px;padding:7px 15px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-bg)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.teal:hover{background:var(--teal-deep);color:#fff}
.btn.sm{padding:3px 11px;font-size:12px;border-radius:7px}
.btn.on{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-deep);font-weight:600}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.tiny{font-size:12px;color:var(--muted)}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.divider{height:1px;background:var(--border);margin:18px 0}

/* 模块卡片 */
.mod-card{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s;position:relative}
.mod-card:hover{transform:translateY(-2px);border-color:#C4D2E6}
.mod-card .mh{display:flex;align-items:center;gap:12px}
.mod-card .micon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#fff;flex:none}
.mod-card h3{font-size:16.5px;color:var(--navy)}
.mod-card .en{font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.mod-card p{font-size:13px;color:var(--text);line-height:1.7}
.mod-card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--border);padding-top:10px}
.mini-progress{height:6px;background:var(--border);border-radius:4px;overflow:hidden;flex:1}
.mini-progress i{display:block;height:100%;background:var(--teal)}

/* 目录 / 折叠 */
details.chapter{border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:12px;overflow:hidden}
details.chapter>summary{cursor:pointer;list-style:none;padding:13px 18px;display:flex;align-items:center;gap:10px;background:#FBFCFE;user-select:none}
details.chapter>summary::-webkit-details-marker{display:none}
details.chapter>summary .arrow{transition:.2s;color:var(--muted);font-size:12px;flex:none}
details.chapter[open]>summary .arrow{transform:rotate(90deg)}
details.chapter>summary .tt{font-weight:600;color:var(--navy);font-size:14.5px}
details.chapter>summary .rt{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chapter-body{padding:6px 14px 14px}
.kp-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.kp-row:hover{background:var(--navy-bg);border-color:#D9E2EF}
.kp-row .dot{width:8px;height:8px;border-radius:50%;flex:none;background:#CBD5E1}
.kp-row.s-learning .dot{background:var(--amber)}
.kp-row.s-mastered .dot{background:var(--teal)}
.kp-row .kn{font-size:13.8px;color:var(--text);flex:1;min-width:0}
.kp-row .kn small{color:var(--muted);font-size:11.5px;margin-left:6px}

/* 知识详情 */
.kp-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.kp-head .kicon{width:46px;height:46px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:none}
.kp-head h1{font-size:24px;color:var(--navy);line-height:1.35}
.kp-head .en{font-size:12.5px;color:var(--muted);letter-spacing:.6px}
.kp-section{margin-top:18px}
.kp-section h4{font-size:15px;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.kp-section h4::before{content:"";width:4px;height:15px;background:var(--teal);border-radius:2px;flex:none}
.kp-section ul,.kp-section ol{padding-left:22px}
.kp-section li{margin:3px 0}
.kp-section p{margin:6px 0}
.callout{border-left:4px solid var(--amber);background:var(--amber-bg);border-radius:0 10px 10px 0;padding:12px 16px;font-size:13.5px;margin:10px 0}
.callout.teal{border-left-color:var(--teal);background:var(--teal-bg)}
.callout.navy{border-left-color:var(--navy);background:var(--navy-bg)}
.callout b{color:var(--navy)}
pre.code{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-size:12.8px;line-height:1.7;overflow-x:auto;color:var(--code-text);position:relative;margin:10px 0}
pre.code .cmt{color:#7A8AA0}
.code-cap{font-size:11.5px;color:var(--muted);margin:-4px 0 10px;letter-spacing:.3px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin:10px 0;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.tbl th{background:#F4F7FB;color:var(--navy);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#FAFCFE}
.term{font-weight:600;color:var(--navy)}
.fx{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--code-text);white-space:nowrap}

/* 练习 */
.exer{border:1px dashed #C9D5E8;border-radius:12px;padding:16px 18px;background:#FBFCFE;margin-top:12px}
.exer .lv{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.exer .ans{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;display:none}
.exer .ans.show{display:block}
.exer .ans .a-block{margin-top:8px}
.exer .ans ol{padding-left:20px}

/* 图谱/图示 */
.diagram{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin:14px 0;overflow-x:auto}
.diagram .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.diagram svg{max-width:100%;height:auto;display:block;margin:0 auto}

/* 路线 */
.stage{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
.stage:last-child{border-bottom:none}
.stage .num{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:15px}
.stage.done .num{background:var(--teal)}
.stage .body{flex:1;min-width:0}
.stage h4{font-size:15.5px;color:var(--navy)}
.stage .rows{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 20px}
.stage .rows .r{font-size:12.8px}
.stage .rows .r b{color:var(--navy);font-weight:600;display:block;font-size:11.5px;letter-spacing:.5px}

/* 项目 */
.proj-card{display:flex;flex-direction:column;gap:8px}
.proj-card .ph{display:flex;gap:12px;align-items:center}
.proj-card .picon{width:40px;height:40px;border-radius:10px;background:var(--teal-bg);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none;border:1px solid #BCE3DE}

/* 速查 */
.tool-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tool-item{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fff;margin-bottom:10px}
.tool-item .th{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool-item .th code{font-weight:700;color:var(--navy);font-size:13px}
.tool-item .td{font-size:13px;margin-top:5px;color:var(--text)}
.tool-item .tm{font-size:12px;color:var(--muted);margin-top:5px}
.tool-item .tm b{color:var(--amber-deep);font-weight:600}

/* 参考 */
.ref-item{display:flex;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border);align-items:flex-start}
.ref-item:last-child{border-bottom:none}
.ref-item .rtype{flex:none;width:64px;text-align:center;font-size:11px;border-radius:6px;padding:2px 0;border:1px solid var(--border);background:#F8FAFC;color:var(--muted)}
.ref-item .rmain{flex:1;min-width:0}
.ref-item .rt{font-size:14px;font-weight:600;color:var(--navy)}
.ref-item .rm{font-size:12.5px;color:var(--muted);margin-top:2px}
.ref-item .rm a{word-break:break-all}

/* 过滤器 */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filter-bar select{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff;color:var(--text);font-family:inherit;outline:none}
.filter-bar select:focus{border-color:var(--teal)}

/* 首页快捷入口 */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.quick{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 12px;text-align:center;cursor:pointer;transition:.15s;font-size:13px;color:var(--navy);font-weight:600}
.quick:hover{border-color:var(--teal);background:var(--teal-bg);text-decoration:none}
.quick .qi{font-size:19px;display:block;margin-bottom:5px}

/* 统计概览卡 */
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.stat-card .v{font-size:26px;font-weight:700;color:var(--navy);line-height:1.2}
.stat-card .k{font-size:12.5px;color:var(--muted)}
.stat-card .d{font-size:11.5px;color:var(--muted);margin-top:4px}

/* 面包屑下标题区 */
.page-head{margin-bottom:20px}
.page-head h1{font-size:25px;color:var(--navy);letter-spacing:.5px}
.page-head .sub{font-size:13.5px;color:var(--muted);margin-top:5px;max-width:860px}

/* 图谱节点 */
.gnode{cursor:pointer}
.gnode rect{stroke-width:1.5}
.gnode:hover rect{filter:brightness(.96)}
.glabel{font-size:11.5px;fill:var(--text)}
.gedge{stroke:#B9C6D8;stroke-width:1.5;fill:none;marker-end:url(#arr)}

/* toast */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:13px;padding:9px 20px;border-radius:24px;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 8px 24px rgba(23,43,77,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 页脚 */
.footer{margin-top:44px;border-top:1px solid var(--border);padding-top:18px;font-size:12px;color:var(--muted);line-height:1.8}

.backtop{position:fixed;right:22px;bottom:26px;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);color:var(--navy);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:70}
.backtop.show{display:flex}

/* 响应式 */
@media (max-width:1080px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:1024px){
  .sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(23,43,77,.15)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .hamburger{display:flex;align-items:center;justify-content:center}
  .content{padding:18px 16px 90px}
  .hero{padding:26px 22px}
  .hero h1{font-size:25px}
  .top-progress{display:none}
}
@media (max-width:640px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .mod-grid{grid-template-columns:1fr}
  .crumb{display:none}
  .stage{flex-direction:column;gap:8px}
  .kp-head h1{font-size:20px}
}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><span class="logo-mark">数</span>数据分析与商业决策</div>
      <div class="sub">Data Analysis &amp; Business Decision · 自学平台</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div>总体进度 <b id="sf-pct" style="color:var(--teal-deep)">0%</b></div>
      <div class="mini-bar"><i id="sf-bar" style="width:0%"></i></div>
      <div id="sf-text">已掌握 0 / 0 个知识点</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="btn-menu" aria-label="打开菜单">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="search-wrap">

function modStats(m){
  var tot=0,mas=0,lea=0;
  m.chapters.forEach(function(c){ c.points.forEach(function(p){ tot++; var s=state.progress[p.id]; if(s==='mastered')mas++; else if(s==='learning')lea++; }); });
  return {tot:tot,mas:mas,lea:lea,pct:tot?Math.round(mas/tot*100):0};
}
function totalStats(){
  var t=0,ma=0,l=0;
  ALL_KP.forEach(function(x){ t++; var s=state.progress[x.p.id]; if(s==='mastered')ma++; else if(s==='learning')l++; });
  return {tot:t,mas:ma,lea:l,pct:t?Math.round(ma/t*100):0};
}

  var d=DA.paths.default;

    var tot=0,ma=0; ms.forEach(function(m){var st=modStats(m);tot+=st.tot;ma+=st.mas;});

      '<div class="r"><b>前置要求</b>'+esc(s.prereq)+'</div>'+
      '<div class="r"><b>具体课程</b>'+s.modules.map(function(mid){var mm=DA.modules.filter(function(x){return x.id===mid;})[0];return '<a href="#/module/'+mid+'">'+(mm?mm.name:mid)+'</a>';}).join('、')+'</div>'+
      '<div class="r"><b>参考时间</b>'+esc(s.time)+'</div>'+

      '<div class="r"><b>阶段性产出</b>'+esc(s.output)+'</div>'+
      '<div class="r"><b>完成标准</b>'+esc(s.criteria)+'</div>'+
      '<div class="r"><b>常见卡点</b>'+esc(s.stuck)+'</div>'+
      '<div class="r"><b>进入下一阶段条件</b>'+esc(s.next)+'</div></div>'+
      '<div class="tag-row" style="margin-top:8px"><span class="mini-progress" style="max-width:160px"><i style="width:'+pct+'%"></i></span><span class="tiny">关联模块完成度 '+pct+'%</span></div>'+
      '</div></div></div>';

/* ---------- 视图：课程目录（索引+筛选） ---------- */
function viewCourses(){
  var f=state.filters;
  var mopts=DA.modules.map(function(m){return '<option value="'+m.id+'"'+(f.m===m.id?' selected':'')+'>'+esc(m.name)+'</option>';}).join('');
  var lv=['L0','L1','L2','L3'].map(function(l){return '<option value="'+l+'"'+(f.l===l?' selected':'')+'>'+l+'</option>';}).join('');
  var la=['核心必学','进阶增强','按需拓展'].map(function(l){return '<option value="'+l+'"'+(f.la===l?' selected':'')+'>'+l+'</option>';}).join('');
  var st=['mastered','learning',''].map(function(s){var n=s==='mastered'?'已掌握':(s==='learning'?'学习中':'未开始');return '<option value="'+s+'"'+(f.s===s?' selected':'')+'>'+n+'</option>';}).join('');
  var rows='';
  DA.modules.forEach(function(m){
    if(f.m&&f.m!==m.id)return;
    var list=[];
    m.chapters.forEach(function(c){ c.points.forEach(function(p){
      if(f.l&&p.level!==f.l)return;
      if(f.la&&p.layer!==f.la)return;
      if(f.s!==undefined&&f.s!==''&&(state.progress[p.id]||'')!==f.s)return;
      list.push({p:p,c:c});
    });});
    if(!list.length)return;
    rows+='<div class="card"><h4 style="color:var(--navy);margin-bottom:8px"><a href="#/module/'+m.id+'">'+esc(m.name)+'</a><span class="tiny" style="margin-left:8px">'+list.length+' 个知识点</span></h4>'+
      list.map(function(x){
        var cls=state.progress[x.p.id]==='mastered'?'s-mastered':(state.progress[x.p.id]==='learning'?'s-learning':'');
        return '<div class="kp-row '+cls+'" data-act="kp" data-id="'+x.p.id+'"><span class="dot"></span><span class="kn">'+esc(x.p.name)+'<small>'+esc(x.c.name)+'</small></span>'+lvlChip(x.p.level)+chip(x.p.layer,'gray')+statusChip(x.p.id)+'</div>';
      }).join('')+'</div>';
  });
  if(!rows)rows='<div class="card"><p class="muted">没有符合条件的学习内容，请调整筛选条件。</p></div>';
  return '<div class="page-head"><h1>课程目录</h1><div class="sub">全部 '+ALL_KP.length+' 个知识点。按模块、难度、层级与掌握状态筛选；点击行进入知识详情。</div></div>'+
    '<div class="card filter-bar"><select id="f-m"><option value="">全部模块</option>'+mopts+'</select>'+
    '<select id="f-l"><option value="">全部难度</option>'+lv+'</select>'+
    '<select id="f-la"><option value="">全部层级</option>'+la+'</select>'+
    '<select id="f-s"><option value="">全部状态</option>'+st+'</select>'+
    '<button class="btn sm" data-act="clearfilter">重置筛选</button></div>'+rows;
}

      '<div class="ans" id="ex-'+p.id+'-s"><b>建议步骤：</b><ol>'+e.steps.map(function(h){return '<li>'+esc(h)+'</li>';}).join('')+'</ol></div>'+
      '<div class="ans" id="ex-'+p.id+'-a"><b>参考答案：</b><p>'+nl(e.answer)+'</p></div></div>');

    return '<div class="card proj-card" data-act="project" data-id="'+p.id+'">'+
      '<div class="ph"><span class="picon">'+p.id.replace('P','')+'</span><div><h3 style="font-size:15.5px;color:var(--navy)">'+esc(p.name)+'</h3><div class="tiny">'+esc(p.tools)+' · '+esc(p.level)+'</div></div>'+
      (done?'<span class="chip teal" style="margin-left:auto">✓ 已完成</span>':'<span class="chip gray" style="margin-left:auto">未完成</span>')+'</div>'+
      '<p style="font-size:13px">'+esc(p.goal)+'</p>'+
      '<div class="tiny">背景：'+esc(p.background)+'</div></div>';
  }).join('');
  return '<div class="page-head"><h1>实战项目</h1><div class="sub">五个由浅入深的项目，体现完整分析过程而非单纯工具操作。所有项目数据均为教学模拟数据或公开演示数据，已明确标注。</div></div>'+
    '<div class="grid g2">'+cards+'</div>'+
    '<div class="callout" style="margin-top:16px"><b>完成标准总则：</b>项目成果应能通过“误区清单”（<a href="#/kp/X3-1">X3-1</a>）审查；结论分层（事实/解释/假设/建议）；行动建议含责任人与验证指标；数据模拟属性已声明。</div>';
}
function viewProject(id){
  var p=DA.projects.filter(function(x){return x.id===id;})[0];
  if(!p)return viewProjects();
  var done=state.projects[p.id];
  var dict=p.dictionary.map(function(d){
    if(Array.isArray(d))return '<tr><td><code>'+esc(d[0])+'</code></td><td>'+esc(d[1])+'</td><td>'+esc(d[2])+'</td></tr>';
    return '<li>'+esc(d)+'</li>';
  });
  var dictHtml=Array.isArray(p.dictionary[0])?('<div class="tbl-wrap"><table class="tbl"><thead><tr><th>字段</th><th>类型/角色</th><th>含义</th></tr></thead><tbody>'+dict.join('')+'</tbody></table></div>'):('<ul>'+dict.join('')+'</ul>');
  return '<div class="page-head"><div class="tag-row" style="margin-bottom:8px">'+chip(p.tools,'navy')+lvlChip(p.level.split('–')[0])+lvlChip(p.level.split('–')[1]||p.level)+
    p.modules.map(function(mid){var mm=DA.modules.filter(function(x){return x.id===mid;})[0];return '<a class="chip gray" href="#/module/'+mid+'">'+(mm?mm.name:mid)+'</a>';}).join('')+'</div>'+
    '<h1>'+esc(p.name)+'</h1><div class="sub">'+esc(p.background)+'</div></div>'+
    '<div class="card">'+
    sec('业务目标','<p>'+nl(p.goal)+'</p>')+
    sec('样例数据与获取方式','<p><b>类型：</b>'+esc(p.data.type)+'</p><p>'+nl(p.data.desc)+'</p><p><b>获取：</b>'+nl(p.data.get)+'</p><div class="callout"><b>数据声明：</b>'+esc(p.data.note)+'</div>')+
    sec('数据字典',dictHtml)+
    sec('需要回答的问题','<ol>'+p.questions.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ol>')+
    sec('分析过程与关键步骤','<ol>'+p.steps.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ol>')+
    sec('最终产出','<p>'+esc(p.output)+'</p>')+
    sec('验收标准','<ul>'+p.criteria.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ul>')+
    sec('常见失败方式','<ul>'+p.failures.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ul>')+
    sec('参考解法','<div class="exer" id="ex-p-'+p.id+'"><p><b>提示：</b></p><ul>'+p.solution.hints.map(function(h){return '<li>'+esc(h)+'</li>';}).join('')+'</ul>'+
      '<div class="lv"><button class="btn sm" data-act="exer" data-target="ex-p-'+p.id+'-a">显示参考思路</button></div>'+
      '<div class="ans" id="ex-p-'+p.id+'-a"><b>参考思路：</b><p>'+esc(p.solution.approach)+'</p></div></div>')+
    sec('作品集成果形式','<p>'+esc(p.portfolio)+'</p>')+
    '<div class="divider"></div><div class="btn-row"><button class="btn '+(done?'teal':'primary')+'" data-act="proj" data-id="'+p.id+'">'+(done?'✓ 已完成（点击取消）':'标记为已完成')+'</button><a class="btn" href="#/projects">返回项目列表</a></div>'+
    '</div>';
}

/* ---------- 视图：参考资料 ---------- */
function viewRefs(){
  var tys={}; DA.refs.forEach(function(r){tys[r.ty]=1;});
  var mods={}; DA.refs.forEach(function(r){r.m.forEach(function(m){mods[m]=1;});});
  var tyOpts=Object.keys(tys).map(function(t){return '<option value="'+t+'"'+(state.refTy===t?' selected':'')+'>'+t+'</option>';}).join('');
  var mOpts=Object.keys(mods).sort().map(function(m){var mm=DA.modules.filter(function(x){return x.id===m;})[0];return '<option value="'+m+'"'+(state.refM===m?' selected':'')+'>'+(mm?mm.name:m)+'</option>';}).join('');
  var list=DA.refs.filter(function(r){
    if(state.refTy&&r.ty!==state.refTy)return false;
    if(state.refM&&r.m.indexOf(state.refM)<0)return false;
    return true;
  });
  return '<div class="page-head"><h1>参考资料库</h1><div class="sub">以官方文档与权威教育资源为主。链接检索日期为 2026 年 10 月 16 日；标注“未逐一核实”的条目为稳定的官方/知名入口，但具体文章路径可能随站点改版变化，请以站点内搜索为准。</div></div>'+
    '<div class="card filter-bar"><select id="rf-ty"><option value="">全部类型</option>'+tyOpts+'</select>'+
    '<select id="rf-m"><option value="">全部模块</option>'+mOpts+'</select>'+
    '<button class="btn sm" data-act="clearref">重置筛选</button></div>'+
    '<div class="card">'+list.map(function(r){
      return '<div class="ref-item"><span class="rtype">'+esc(r.ty)+'</span><div class="rmain"><div class="rt">'+esc(r.t)+'</div>'+
        '<div class="rm">'+esc(r.o)+' · 优先级：'+esc(r.p)+' · 适用模块：'+r.m.map(function(m){var mm=DA.modules.filter(function(x){return x.id===m;})[0];return mm?mm.name:m;}).join('、')+'</div>'+
        '<div class="rm" style="margin-top:2px">推荐原因：'+esc(r.r)+'</div>'+
        '<div class="rm"><a href="'+r.u+'" target="_blank" rel="noopener noreferrer">'+esc(r.u)+'</a>'+(r.ok?'':' <span class="chip gray">未逐一核实</span>')+'</div></div></div>';
    }).join('')+'</div>'+
    '<div class="callout teal" style="margin-top:14px"><b>使用原则：</b>重要事实与工具操作以官方文档为准；官方定义、通用原理、行业实践与情境经验在课程中已尽量区分。如发现链接失效，请以来源机构官网内搜索定位最新页面。</div>';
}

/* ---------- 视图：搜索 ---------- */
function viewSearch(q){
  q=(q||'').trim();
  var res=[];
  if(q){
    var terms=q.toLowerCase().split(/\s+/);
    SEARCH.forEach(function(e){
      var hay=(e.title+' '+e.en+' '+e.brief+' '+e.mod+' '+e.level+' '+e.layer+' '+e.type).toLowerCase();
      var hit=terms.every(function(t){return hay.indexOf(t)>=0;});
      if(hit)res.push(e);
    });
  }
  var html='<div class="page-head"><h1>搜索</h1><div class="sub">支持中文标题、英文术语与关键词（如 透视表 / XLOOKUP / 跳出率 / 窗口函数 / cohort）。</div></div>'+
    '<div class="card"><div class="search-box" style="max-width:640px"><span style="color:var(--muted)">⌕</span><input id="search-page-input" type="text" placeholder="输入关键词后按回车" value="'+esc(q)+'"></div>'+
    (q?('<div class="tiny" style="margin-top:8px">找到 '+res.length+' 条结果</div>'):'')+'</div>';
  if(q){
    html+='<div class="card">'+(res.length?res.map(function(e){
      var cls=e.type==='kp'?(state.progress[e.id]==='mastered'?'teal':(state.progress[e.id]==='learning'?'amber':'gray')):'navy';
      return '<div class="kp-row" data-act="route" data-h="'+e.route+'"><span class="dot" style="background:var(--'+(cls==='teal'?'teal':(cls==='amber'?'amber':'navy'))+')"></span>'+
        '<span class="kn">'+esc(e.title)+(e.en?'<small>'+esc(e.en.slice(0,60))+'</small>':'')+'<small style="margin-left:6px">'+esc(e.brief.slice(0,50))+'</small></span>'+
        chip(e.mod,'gray')+(e.level?lvlChip(e.level):'')+'</div>';
    }).join(''):'<p class="muted">没有找到匹配内容。尝试更短的关键词，或从课程目录浏览。</p>')+'</div>';
  }
  return html;
}

/* ---------- 路由 ---------- */
function render(){
  var r=parseRoute(), p=r.parts;
  var html='', crumb=[{t:'学习首页',h:'#/home'}];
  var seg=(p[0]||'home');
  if(seg==='home'){ html=viewHome(); }
  else if(seg==='map'){ html=viewMap(); crumb.push({t:'知识地图'}); }
  else if(seg==='paths'){ html=viewPaths(); crumb.push({t:'学习路线'}); }
  else if(seg==='courses'){ html=viewCourses(); crumb.push({t:'核心课程'}); }
  else if(seg==='module'){
    var m=DA.modules.filter(function(x){return x.id===p[1];})[0];
    html=viewModule(p[1]); crumb.push({t:'核心课程',h:'#/courses'}); crumb.push({t:m?m.name:'模块'});
  }
  else if(seg==='kp'){
    var x=KP_BY_ID[p[1]];
    html=viewKp(p[1]);
    crumb.push({t:'核心课程',h:'#/courses'});
    if(x){crumb.push({t:x.m.name,h:'#/module/'+x.m.id});crumb.push({t:x.c.name,h:'#/module/'+x.m.id});crumb.push({t:x.p.name});}
  }
  else if(seg==='tools'){ html=viewTools(p[1]); crumb.push({t:'工具速查'}); }
  else if(seg==='methods'){ html=viewMethods(); crumb.push({t:'分析方法库'}); }
  else if(seg==='projects'){ html=viewProjects(); crumb.push({t:'实战项目'}); }
  else if(seg==='project'){ var pr=DA.projects.filter(function(x2){return x2.id===p[1];})[0]; html=viewProject(p[1]); crumb.push({t:'实战项目',h:'#/projects'}); crumb.push({t:pr?pr.name:'项目'}); }
  else if(seg==='refs'){ html=viewRefs(); crumb.push({t:'参考资料'}); }
  else if(seg==='search'){ html=viewSearch(qparam(r.qs,'q')); crumb.push({t:'搜索'}); }
  else { html=viewHome(); }
  $('#view').innerHTML=html;
  $('#crumb').innerHTML=crumb.map(function(c,i){
    return (i<crumb.length-1&&c.h)?('<a href="'+c.h+'">'+esc(c.t)+'</a>'):('<b>'+esc(c.t)+'</b>');
  }).join('<span class="sep">/</span>');
  afterRender();
}
function afterRender(){
  // 筛选器
  var fm=$('#f-m'); if(fm)fm.onchange=function(){state.filters.m=this.value;render();};
  var fl=$('#f-l'); if(fl)fl.onchange=function(){state.filters.l=this.value;render();};
  var fla=$('#f-la'); if(fla)fla.onchange=function(){state.filters.la=this.value;render();};
  var fs=$('#f-s'); if(fs)fs.onchange=function(){state.filters.s=this.value;render();};
  var rty=$('#rf-ty'); if(rty)rty.onchange=function(){state.refTy=this.value;render();};
  var rfm=$('#rf-m'); if(rfm)rfm.onchange=function(){state.refM=this.value;render();};
  var tq=$('#tool-q'); if(tq){
    tq.oninput=function(){ state.toolQ=this.value; var pos=this.selectionStart; render(); var nq=$('#tool-q'); if(nq){nq.focus(); nq.setSelectionRange(pos,pos);} };
  }
  var spi=$('#search-page-input'); if(spi){
    spi.onkeydown=function(e){ if(e.key==='Enter'){ go('#/search?q='+encodeURIComponent(this.value.trim())); } };
  }
  // 章节折叠状态
  $$('#view details.chapter').forEach(function(d){
    d.ontoggle=function(){ state.open['m'+(location.hash.split('/')[2]||'')+'-'+d.getAttribute('data-ch')]=d.open; };
  });
  // 导航高亮
  var seg=(parseRoute().parts[0]||'home');
  $$('#nav .nav-item').forEach(function(a){
    var h=a.getAttribute('href')||'';
    var s=h.replace('#/','').split('/')[0]||'home';
    a.classList.toggle('active', s===seg || (seg==='module'&&s==='courses') || (seg==='kp'&&s==='courses') || (seg==='project'&&s==='projects') || (seg==='pathstage'&&s==='paths'));
  });
  updateChrome();
  window.scrollTo(0,0);
}
function updateChrome(){
  var ts=totalStats();
  var pct=ts.pct;
  $('#tp-bar').style.width=pct+'%'; $('#tp-pct').textContent=pct+'%';
  $('#sf-bar').style.width=pct+'%'; $('#sf-pct').textContent=pct+'%';
  $('#sf-text').textContent='已掌握 '+ts.mas+' / '+ts.tot+' 个知识点 · 项目 '+projDone()+'/5';
}

/* ---------- 侧栏导航 ---------- */
function buildNav(){
  var items=[{t:'学习首页',i:'⌂',h:'#/home'},{t:'知识地图',i:'🗺',h:'#/map'},{t:'学习路线',i:'🛤',h:'#/paths'}];
  var html='<div class="nav-group">导航</div>'+items.map(function(n){
    return '<a class="nav-item" href="'+n.h+'"><span class="ni">'+n.i+'</span>'+n.t+'</a>';
  }).join('');
  html+='<div class="nav-group">核心课程</div><a class="nav-item" href="#/courses"><span class="ni">▤</span>课程目录与筛选<span class="nav-badge">'+ALL_KP.length+'</span></a>';
  DA.modules.forEach(function(m){
    var st=modStats(m);
    html+='<a class="nav-item nav-sub" href="#/module/'+m.id+'"><span class="ni">'+m.icon+'</span>'+esc(m.name)+'<span class="nav-badge">'+st.mas+'/'+st.tot+'</span></a>';
  });
  html+='<div class="nav-group">工具与项目</div>'+
    '<a class="nav-item" href="#/tools"><span class="ni">𝑓</span>工具速查库</a>'+
    '<a class="nav-item" href="#/methods"><span class="ni">📐</span>分析方法库</a>'+
    '<a class="nav-item" href="#/projects"><span class="ni">🚀</span>实战项目<span class="nav-badge">'+projDone()+'/5</span></a>'+
    '<a class="nav-item" href="#/refs"><span class="ni">🔗</span>参考资料</a>';
  $('#nav').innerHTML=html;
}

/* ---------- 搜索框 ---------- */
function bindSearch(){
  var input=$('#search-input'), box=$('#search-results');
  function show(q){
    q=q.trim();
    if(!q){box.classList.remove('show');box.innerHTML='';return;}
    var terms=q.toLowerCase().split(/\s+/);
    var res=SEARCH.filter(function(e){
      var hay=(e.title+' '+e.en+' '+e.brief+' '+e.mod).toLowerCase();
      return terms.every(function(t){return hay.indexOf(t)>=0;});
    }).slice(0,12);
    box.innerHTML=res.length?res.map(function(e){
      return '<a class="sr-item" href="'+e.route+'"><span class="t">'+esc(e.title)+'</span><span class="tags">'+esc(e.mod)+(e.level?' · '+e.level:'')+'</span><span class="d">'+esc(e.brief.slice(0,60))+'</span></a>';
    }).join(''):'<div class="sr-empty">没有匹配结果，换个关键词试试</div>';
    box.classList.add('show');
  }
  input.addEventListener('input',function(){show(this.value);});
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ box.classList.remove('show'); go('#/search?q='+encodeURIComponent(this.value.trim())); }
  });
  input.addEventListener('focus',function(){ if(this.value)show(this.value); });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.search-wrap'))box.classList.remove('show');
  });
}

/* ---------- 全局事件 ---------- */
function bindGlobal(){
  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-act]');
    if(!a)return;
    var act=a.getAttribute('data-act');
    if(act==='status'){ setStatus(a.getAttribute('data-id'),a.getAttribute('data-val')); }
    else if(act==='kp'){ go('#/kp/'+a.getAttribute('data-id')); }
    else if(act==='module'){ go('#/module/'+a.getAttribute('data-id')); }
    else if(act==='project'){ go('#/project/'+a.getAttribute('data-id')); }
    else if(act==='pathstage'){ go('#/paths'); }
    else if(act==='route'){ go(a.getAttribute('data-h')); }
    else if(act==='proj'){ toggleProj(a.getAttribute('data-id')); }
    else if(act==='tooltab'){ state.toolCat=a.getAttribute('data-cat'); state.toolQ=''; render(); }
    else if(act==='clearfilter'){ state.filters={m:'',l:'',la:'',s:''}; render(); }
    else if(act==='clearref'){ state.refTy=''; state.refM=''; render(); }
    else if(act==='exer'){
      var t=document.getElementById(a.getAttribute('data-target'));
      if(t){ t.classList.toggle('show'); a.textContent=t.classList.contains('show')?(a.textContent.replace('显示','隐藏')):a.textContent.replace('隐藏','显示'); }
    }
  });
  $('#btn-menu').addEventListener('click',function(){
    $('#sidebar').classList.toggle('open'); $('#overlay').classList.toggle('show');
  });
  $('#overlay').addEventListener('click',function(){
    $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show');
  });
  window.addEventListener('scroll',function(){
    $('#backtop').classList.toggle('show', window.scrollY>600);
  });
  $('#backtop').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
  window.addEventListener('hashchange',function(){
    $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show');
    render();
  });
}
var toastTimer=null;
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},2600);
}

/* ---------- 启动 ---------- */
buildNav(); bindSearch(); bindGlobal();
if(!location.hash)location.hash='#/home';
render();
})();

</script>
