    { id:"m7-1", title:"变现方式全景：前置条件与利润结构", html:`
<table class="tb">
<tr><th style="width:120px">方式</th><th>前置条件</th><th>利润结构</th><th>规模化</th><th>主要风险</th></tr>
<tr><td><b>职业机会</b></td><td>专业声誉+目标行业可见度</td><td>薪资/期权差异</td><td>低</td><td>与雇主利益冲突；单一雇主依赖</td></tr>
<tr><td><b>自由职业/接单</b></td><td>可交付技能+获客渠道</td><td>时间×单价</td><td>低（受时间上限）</td><td>收入波动、交付即停</td></tr>
<tr><td><b>咨询/顾问</b></td><td>深度专业+信任背书</td><td>高单价×少量客户</td><td>中</td><td>个人时间瓶颈</td></tr>
<tr><td><b>培训/ coaching</b></td><td>方法论+成果案例</td><td>课程价×学员数</td><td>中高</td><td>效果承诺合规风险；口碑依赖</td></tr>
<tr><td><b>知识产品</b></td><td>体系化知识+受众基数</td><td>制作成本前置，毛利高</td><td>高</td><td>同质化、盗版、退货</td></tr>
<tr><td><b>会员/订阅</b></td><td>持续价值供给+核心受众</td><td>月费×留存</td><td>高</td><td>留存压力、持续运营成本</td></tr>
<tr><td><b>赞助/广告</b></td><td>受众规模+垂直度</td><td>按曝光/转化计费</td><td>中</td><td>受众信任损耗、合规披露</td></tr>
<tr><td><b>联盟营销</b></td><td>受众+信任+相关产品</td><td>佣金分成</td><td>高</td><td>推荐与信任的冲突、合规</td></tr>
</table>
<div class="callout c-research"><div class="ct">研究证据：影响力≠变现</div><p>影响者营销元分析显示：影响者效果通过可信度与吸引力中介，且受产品类型调节——不同领域、不同客群的变现效率差异巨大<sup class="ref" data-src="S15">[S15]</sup><sup class="ref" data-src="S16">[S16]</sup>。计划行为理论则解释了「知道→认可→购买」的跳跃需要态度、规范与控制感同时到位<sup class="ref" data-src="S12">[S12]</sup>——受众喜欢你的内容（态度）不必然产生购买行为。</p></div>
<h3>1,000 真粉模型的正确用法</h3>
<p>Kevin Kelly 的模型：约 1,000 个每年直接付费约 100 美元的核心支持者即可支撑生计<sup class="ref" data-src="S36">[S36]</sup>。它是思想模型而非实证定律，正确用法是<b>反推</b>：你的目标收入 ÷ 期望客单价 = 需要的核心客户数。这个数字通常远小于你的粉丝数假设——从而把策略从「追流量」拉回「经营核心关系」。</p>
<div class="callout c-warn"><div class="ct">风险提示</div><p>「影响力变现课」最常见的误导是把变现描述成粉丝数的线性函数。现实是：垂直度、客单价、信任深度、产品匹配度的乘积。1 万个精准关注的变现效率可以超过 100 万个泛关注。</p></div>`,
    },
    { id:"m7-2", title:"单位经济与机会验证", html:`
<h3>最小商业模型计算</h3>
<table class="tb">
<tr><th style="width:170px">变量</th><th>说明</th><th>示例</th></tr>
<tr><td>目标月收入</td><td>你想从副业获得的金额</td><td>¥5,000</td></tr>
<tr><td>客单价</td><td>你的服务/产品定价</td><td>¥1,000/次咨询</td></tr>
<tr><td>需要的成交数</td><td>目标收入 ÷ 客单价</td><td>5 次/月</td></tr>
<tr><td>咨询→成交转化</td><td>咨询后成交比例</td><td>30%</td></tr>
<tr><td>需要的咨询数</td><td>成交数 ÷ 转化率</td><td>约 17 次/月</td></tr>
<tr><td>触达→咨询转化</td><td>看过内容而来咨询的比例</td><td>0.5%</td></tr>
<tr><td>需要的月触达</td><td>咨询数 ÷ 转化率</td><td>约 3,400 目标人群触达</td></tr>
</table>
<p>这个计算的价值不是精确，而是把模糊的「我要变现」变成可验证的数字链条。每一环都可以用实验校准（模块 6）。</p>
<h3>三级商业验证</h3>
<div class="grid3">
<div class="mini-card"><b>L1 付费意愿访谈</b><p>问已发生的付费：为类似问题花过多少钱？预算决策者是谁？什么情况下会再次付费？</p></div>
<div class="mini-card"><b>L2 试点项目</b><p>以折扣价做 1–3 个真实交付，验证「能做好+客户满意+可复现」。</p></div>
<div class="mini-card"><b>L3 预售</b><p>产品未完成前收费（或收定金）。最强的验证：用金钱投票。</p></div>
</div>
<div class="callout c-practice"><div class="ct">验证原则</div><p>The Mom Test 的纪律同样适用：不问「你会买吗」（未来意向），问「你上次为解决这个问题付了多少钱、给谁、为什么」（过去行为）<sup class="ref" data-src="S39">[S39]</sup>。试点项目务必限定数量与范围，避免用亏本交付换虚假验证。</p></div>`,
    },
    { id:"m7-3", title:"服务设计与定价", html:`
<h3>服务设计的四要素</h3>
<ul>
<li><b>范围</b>：明确交付什么、不交付什么。边界不清是咨询纠纷的主要来源。</li>
<li><b>流程</b>：从首次接触到交付完成的步骤，每一步有时限与产出。</li>
<li><b>成果定义</b>：客户用什么判断「值」？把这个标准写进合作开始前。</li>
<li><b>案例展示</b>：脱敏案例 + 数据 + 客户证言（模块 2 的证据层级）。</li>
</ul>
<h3>定价的三种逻辑</h3>
<table class="tb">
<tr><th style="width:130px">方法</th><th>逻辑</th><th>适用</th></tr>
<tr><td>成本加成</td><td>时间成本×倍数</td><td>早期无案例时</td></tr>
<tr><td>价值定价</td><td>按客户获得的价值定价</td><td>有可量化成果证据后</td></tr>
<tr><td>竞争锚定</td><td>参照市场同类服务</td><td>成熟市场</td></tr>
</table>
<p>定价的常见错误：用成本定价导致「越熟练越便宜」；用价值定价但拿不出价值证据。合理路径：早期用成本定价保底 → 用试点项目积累价值证据 → 逐步转向价值定价。每次提价后用数据验证转化率变化（模块 6）。</p>
<div class="callout c-practice"><div class="ct">报价结构</div><p>把服务拆成 2–3 档（基础/标准/深度），中间档作为主推。档位差异要清晰可感知（交付物数量、响应时效、定制程度），而不是制造信息不对称。报价单也是内容素材——「我的服务如何定价」本身是受众关心的问题。</p></div>`,
    },
    { id:"m7-4", title:"从受众到客户：转化路径设计", html:`
<h3>转化路径的四种入口</h3>
<table class="tb">
<tr><th style="width:130px">入口</th><th>机制</th><th>适用</th></tr>
<tr><td>内容直接转化</td><td>内容即销售（案例型内容自带证明）</td><td>高客单咨询、专业服务</td></tr>
<tr><td>免费资源钩子</td><td>模板/清单/工具换联系方式</td><td>知识产品、邮件列表建设</td></tr>
<tr><td>邮件序列</td><td>订阅后的自动化培育内容</td><td>长决策周期产品</td></tr>
<tr><td>直接邀约</td><td>对高意向受众主动发起咨询邀请</td><td>coaching、高价服务</td></tr>
</table>
<h3>转化的心理链条</h3>
<div class="callout c-research"><div class="ct">研究证据</div><p>计划行为理论：行为意图由态度（喜不喜欢）、主观规范（身边的人是否认可）、感知行为控制（做这件事容不容易）决定<sup class="ref" data-src="S12">[S12]</sup>。转化路径设计就是逐项降低阻力：用案例内容改善态度，用客户证言改善规范，用清晰的行动指引与低门槛入口改善控制感。「知名度≠信任≠购买意愿≠实际购买」——四者都要单独建设。</p></div>
<h3>订阅与私域：长期可触达的受众渠道</h3>
<ul>
<li>邮件订阅是「直接访问」资产：不依赖平台算法，转化路径最短。邮件基准：平均点击率约 2.1%、CTOR 约 6.8%（MailerLite 2025）<sup class="ref" data-src="S35">[S35]</sup>。</li>
<li>Substack 等平台把「订阅确认页互推」做成核心增长机制：新订阅者在最高意愿时刻看到推荐<sup class="ref" data-src="S26">[S26]</sup>。</li>
<li>私域运营的底线：不滥用触达。每封邮件/每条推送都要有「如果我是订阅者，这值得看吗」的答案。</li>
</ul>`,
    },
    { id:"m7-5", title:"从服务到产品化", html:`
<p>服务的天花板是时间；产品化是突破天花板的路径，但前置条件是「模式已被验证且需求稳定重复」。</p>
<table class="tb">
<tr><th style="width:130px">阶段</th><th>形态</th><th>特征</th></tr>
<tr><td>1. 定制服务</td><td>一对一咨询/项目</td><td>单价高、不可复制、验证需求</td></tr>
<tr><td>2. 标准化服务</td><td>固定范围/流程的套餐</td><td>交付可复制，质量可控</td></tr>
<tr><td>3. 小组产品</td><td>训练营/小班课</td><td>杠杆提升，开始考验内容化能力</td></tr>
<tr><td>4. 知识产品</td><td>课程/模板/工具/会员</td><td>边际成本趋零，考验营销与留存</td></tr>
</table>
<p>每上升一级，交付杠杆提高，但「与客户的直接接触」减少——而信任恰恰建立在直接接触上。常见失败是跳过 1、2 级直接做 4 级产品：没有验证的需求 + 没有信任的受众 = 库存积压的数字商品。</p>
<div class="callout c-practice"><div class="ct">产品化的信号</div><p>当同类问题被第 5 次问起、当你发现自己在重复同一套方案、当客户开始询问「有没有更轻量的选项」——这些是产品化时机的信号。把重复的解决方案沉淀为模板/课程/工具，而不是硬接每一次咨询。</p></div>`,
    },
    { id:"m7-6", title:"合规：利益披露、广告标识与知识产权", html: `
<div class="callout c-official"><div class="ct">中国法规</div><p>《互联网广告管理办法》（市场监管总局令第 72 号，2023 年 5 月 1 日施行）第九条：通过知识介绍、体验分享、消费测评等形式推销商品或服务，并附加购物链接等购买方式的，广告发布者应当<b>显著标明「广告」</b>；竞价排名商品或服务同样须显著标明「广告」。直播营销人员以自己名义作推荐证明的，承担广告代言人责任<sup class="ref" data-src="S30">[S30]</sup>。</p></div>
<div class="callout c-official"><div class="ct">美国法规</div><p>FTC 代言指南（16 CFR Part 255，2023 年修订）：代言必须反映真实体验；存在「实质关系」（付费、免费产品、折扣、合作关系等）必须清晰显著披露；「sp」「thanks」「ambassador」等模糊表述不合格；不得以激励换取正面评价。2024 年 10 月起《消费者评论与证言规则》(16 CFR Part 465) 对虚假评论设有民事罚款<sup class="ref" data-src="S29">[S29]</sup>。</p></div>
<h3>合规清单</h3>
<ul>
<li><b>利益披露</b>：任何收费合作、免费产品、联盟链接，在内容显著位置披露（国内标「广告」，国际惯例用 #ad/#sponsored 等明确措辞）。</li>
<li><b>真实体验</b>：只推荐自己用过/验证过的产品；专家背书须真实具备相应资质。</li>
<li><b>数据引用</b>：宣传中引用的数据须有来源；「最」「第一」等绝对化用语在境内广告中受《广告法》限制。</li>
<li><b>知识产权</b>：使用他人图片/字体/音乐/数据需授权；转载须许可；引用须注明出处。</li>
<li><b>隐私</b>：收集邮件/用户信息遵循最小必要，明示用途，不转卖。</li>
</ul>
<div class="callout c-warn"><div class="ct">风险提示</div><p>合规不是变现的对立面，而是变现的保护网。一次违规宣传对专业声誉的损害（信任模型的「正直」维度崩塌<sup class="ref" data-src="S06">[S06]</sup>），远大于单次合作的收益。医疗、金融等强监管领域尤其谨慎。</p></div>`,
    }

    { id:"m8-1", title:"战略层级：方向、目标与执行", html:`
<p>个人品牌的战略管理只需三层，多一层都是负担：</p>
<table class="tb">
<tr><th style="width:110px">层级</th><th>周期</th><th>内容</th><th>修改频率</th></tr>
<tr><td><b>方向</b></td><td>1–3 年</td><td>你想因什么被记住？服务谁？最终形态（专家/创作者/顾问/经营者）？</td><td>每年审视一次</td></tr>
<tr><td><b>阶段目标</b></td><td>1 个季度</td><td>1 个目标 + 2–3 个关键结果（如：完成定位验证、建立 500 人邮件列表）</td><td>每季度设定</td></tr>
<tr><td><b>近期执行</b></td><td>1 周</td><td>本周 3 件推进目标的事（不是 15 件）</td><td>每周规划</td></tr>
</table>
<p>三层的对齐检验：如果本周的三件事不能追溯到季度目标，季度目标不能追溯到方向，说明你的系统在空转。</p>
<div class="callout c-practice"><div class="ct">季度目标示例</div><p>方向：成为「B2B 内容营销方法」的可信参考。Q3 目标：完成定位验证并启动内容体系。关键结果：① 8 次受众访谈 ② 4 篇支柱内容发布 ③ 邮件列表 300 人 ④ 1 次商业验证（试点或预售）。</p></div>`,
    },
    { id:"m8-2", title:"资源分配：五条线怎么分", html:`
<p>个人品牌经营有五条线在争夺你的有限时间：专业学习、内容生产、平台运营、关系维护、商业开发。没有分配方案的人，会被最紧急的事（通常是平台运营的日常互动）吃掉全部时间。</p>
<h3>分配原则</h3>
<ul>
<li><b>按阶段倾斜</b>：阶段二（构建期）学习:内容 ≈ 4:6；阶段三（运营期）内容:运营 ≈ 6:4；阶段四（商业化）内容:商业 ≈ 4:6。</li>
<li><b>保护深度工作</b>：内容生产与专业学习需要连续时间块；运营互动可以碎片化处理。把最清醒的时段留给最重要的一条线。</li>
<li><b>关系维护下限</b>：每周 30 分钟的人脉维护（回复、连接、致谢），低于这个下限，网络会自然枯萎。</li>
<li><b>商业开发提前</b>：不要等内容「准备好了」再想变现——商业验证本身是最好的定位测试（模块 7）。</li>
</ul>
<h3>每周时间模板（参考）</h3>
<table class="tb">
<tr><th>时段</th><th>事项</th><th>时长</th></tr>
<tr><td>周一晚</td><td>周规划 + 复盘上周</td><td>30 分钟</td></tr>
<tr><td>周二/周四晚</td><td>内容生产（深度块）</td><td>各 2 小时</td></tr>
<tr><td>周三午休</td><td>专业学习/阅读</td><td>45 分钟</td></tr>
<tr><td>每天碎片</td><td>平台互动/关系维护</td><td>20–30 分钟</td></tr>
<tr><td>周五</td><td>数据记录 + 周复盘</td><td>30 分钟</td></tr>
<tr><td>周末半天</td><td>商业开发/项目交付/案例整理</td><td>3 小时</td></tr>
</table>
<p>总计约 8–9 小时/周。低于 5 小时的配置也能跑，但要接受更慢的节奏与更小的范围——关键是<b>稳定</b>而不是强度。</p>`,
    },
    { id:"m8-3", title:"工作系统：可重复、可复盘、不复杂", html:`
<h3>系统的三层</h3>
<ul>
<li><b>捕捉层</b>：选题灵感、受众问题、案例素材——一个入口，随时记。每周清空。</li>
<li><b>生产层</b>：模块 3 的七步工作流 + 模板（大纲模板、案例模板、检查表）。流程固定，减少每次的决策损耗。</li>
<li><b>治理层</b>：周复盘（数据+计划）、月复盘（主题有效性）、季复盘（策略调整）。</li>
</ul>
<div class="callout c-research"><div class="ct">数据参考</div><p>Orbit Media 调查显示：报告「强效果」的博主中每篇投入 6 小时以上者比例显著更高，且发表频率更高者效果更好<sup class="ref" data-src="S33">[S33]</sup>。系统的作用正是把「高质量+稳定频率」从意志力问题变成流程问题。</p></div>
<h3>防复杂化原则</h3>
<ul>
<li>任何工具/流程，如果连续两周没在用，删掉。</li>
<li>复盘表格超过一屏，就是在制造负担而非洞察。</li>
<li>先跑纸笔流程，痛点了再上工具——工具不产生生产力，流程才产生。</li>
</ul>`,
    },

    { id:"m8-5", title:"低谷期管理：没有起色时怎么办", html: `
<h3>三种「没有起色」的区分</h3>
<table class="tb">
<tr><th style="width:130px">类型</th><th>特征</th><th>处方</th></tr>
<tr><td>延迟期</td><td>方向正确、动作到位，反馈未到</td><td>坚持+缩小比较范围（只对比自己的历史）</td></tr>
<tr><td>策略失效</td><td>数据持续低迷且诊断指向内容/定位问题</td><td>回到模块 1/3 修正假设，做新实验</td></tr>
<tr><td>环境变化</td><td>平台规则、市场需求、竞争格局突变</td><td>调整渠道/形态，资产与声誉保留</td></tr>
</table>
<h3>选题枯竭的处理</h3>
<ul>
<li>回到受众：评论区/私信/访谈里的未回答问题。</li>
<li>回到自己：最近解决了什么问题？写「我如何解决 X」。</li>
<li>回到体系：把旧内容更新/合并/重写（模块 3 生命周期管理）。</li>
<li>降级节奏：从周更改双周，保质量不保数量——停更恐惧一半是算法传言，一半是自我加压。</li>
</ul>
<div class="callout c-research"><div class="ct">倦怠的研究证据</div><p>康奈尔大学对 78 位创作者的访谈研究发现：倦怠在创作者中普遍存在，但「不敢停更」的焦虑部分来自平台劳动的结构性压力（停更可能影响推荐），部分来自「梦想职业」叙事使公开抱怨面临社会阻力<sup class="ref" data-src="S17">[S17]</sup>。研究者同时指出：把结构性问题个体化（「是我不够努力」）是二次伤害。应对：把节奏设计成「即使状态差也能维持的下限」，并接受阶段性减速。</p></div>
<div class="callout c-warn"><div class="ct">风险提示</div><p>用「加大剂量」应对倦怠（更多更新、更多平台）是最常见的错误反应。个人品牌是数年周期的事，任何需要牺牲健康与主业关系的节奏都不可持续——不可持续的策略等于没有策略。</p></div>`,

    { id:"m8-6", title:"阶段性审查：继续、暂停、优化、放弃", html: `
<p>每季度末，把个人品牌的全部事项过一遍，归入四类：</p>
<table class="tb">
<tr><th style="width:90px">决策</th><th>判据</th><th>示例</th></tr>
<tr><td><b>继续</b></td><td>数据或证据支持有效</td><td>某类主题持续带来目标受众互动</td></tr>
<tr><td><b>暂停</b></td><td>有效但优先级让位，或环境未到</td><td>短视频：等长文体系稳定后再启动</td></tr>
<tr><td><b>优化</b></td><td>方向对、执行有待改进</td><td>选题准但开头弱——改模板</td></tr>
<tr><td><b>放弃</b></td><td>连续两个季度无证据支持且有机会成本</td><td>某平台运营半年无目标受众互动</td></tr>
</table>
<p>「放弃」是最难也最重要的决策。沉没成本不是继续的理由——写下来你从这件事上学到了什么，然后体面地结束它。停做清单和待办清单一样重要。</p>
<details class="fold"><summary>延伸：个人品牌与「职业身份」的长期关系</summary><div class="fold-body">
<p>学术综述提醒：个人品牌研究领域把大量篇幅放在「如何呈现自己」，但较少处理「呈现的自己与真实自我断裂」的风险<sup class="ref" data-src="S01">[S01]</sup>。一个健康的个人品牌系统，应该让你的职业身份更清晰而不是更分裂：当你为了维持形象而做与价值观相反的事时，系统已经在消耗你。每季度除了数据复盘，加一个问题：这件事我还愿不愿意做三年？</p>
</div></details>`,

<div class="callout c-practice"><div class="ct">案例性质说明</div><p>以下案例<b>主体为假设性人物</b>（教学用途，非真实个人），但其关键决策依据来自实证研究：个人品牌行为与感知可雇佣性/职业满意度的关系见 Gorbatov 等 (2019, N=477)<sup class="ref" data-src="S04">[S04]</sup>；B2B 场景中思想领导力对采购评估的影响见 Edelman-LinkedIn 2024<sup class="ref" data-src="S31">[S31]</sup>。假设性部分仅为把研究发现放入具体情境，不构成对真实事件的陈述。</p></div>
<h3>背景与资源限制</h3>
<p>「陈屿」，32 岁，二线城市 B2B 企业市场部经理，无社交媒体积累，每周可投入 6 小时，目标是两年内进入更大平台或转型咨询。资源限制：不能露脸拍视频、公司内容需脱敏、无历史作品集。</p>
<h3>定位决策</h3>
<ul>
<li>盘点发现：真实能力集中在「把散乱的市场数据变成决策报告」（有 3 个可量化案例）；未验证优势是「行业人脉广」（自评，无证据）。</li>
<li>受众研究：访谈 6 位同梯队市场经理，痛点集中在「数据到洞察的翻译」而非工具操作。</li>
<li>定位：「帮 B2B 市场经理把数据报告做成决策工具」——放弃「行业人脉」方向（无证据）。</li>
</ul>
<h3>策略与执行</h3>
<table class="tb">
<tr><th style="width:110px">阶段</th><th>动作</th><th>数据/反馈</th></tr>
<tr><td>1–2 月</td><td>LinkedIn 改造（定位句+证据+自定义按钮）；每周 1 篇方法论短文</td><td>粉丝增长慢（3 个月 400），但评论出现目标人群提问</td></tr>
<tr><td>3–6 月</td><td>把 3 个案例写成深度复盘文；开始月度邮件通讯（80 人起步）</td><td>邮件打开率高于平台互动；出现 2 次同行请教</td></tr>
<tr><td>7–12 月</td><td>与相邻领域创作者互推；接受 1 次行业播客访谈；试点 3 个低价咨询</td><td>试点全部续约意向；1 次内推机会；简历被动关注上升</td></tr>
</table>
<h3>迭代与风险</h3>
<ul>
<li><b>迭代</b>：第 2 个月发现「工具教程」内容互动差（受众是经理不是执行层），砍掉该支柱，转向「决策场景」。</li>
<li><b>风险</b>：公司内容脱敏处理不当的风险 → 建立「不碰在途项目、只用已结束项目、数据做区间化」的自我规则。</li>
<li><b>失败记录</b>：尝试过 2 期视频，产能不济且数据平庸，第 8 周主动放弃（四分类决策的「放弃」实例）。</li>
</ul>
<div class="callout c-research"><div class="ct">可迁移的结论</div><p>① 早期互动质量（目标人群提问）比粉丝数更能预测方向正确性；② 邮件列表的深度连接在 B2B 场景优先于公域粉丝；③ 真实案例+可量化结果是信任的主通道（与 S04/S31 的证据方向一致）。不可迁移的部分：具体平台选择与内容形态取决于个人产能与受众场景。</p></div>`,

    { id:"m9-2", title:"案例二：自由职业者通过专业内容获客", html:`
<div class="callout c-practice"><div class="ct">案例性质说明</div><p>本案例基于 Substack 生态的公开记录与第三方报道：Substack 官方帮助中心说明了 Recommendations 互推机制<sup class="ref" data-src="S26">[S26]</sup>；第三方（WriteStack）引述平台数据称「推荐与应用内网络贡献约 50% 新订阅、25% 新付费订阅」，并报道头部商业专栏作者 Lenny Rachitsky 将推荐列为主要增长渠道<sup class="ref" data-src="S43">[S43]</sup>。<b>注意：该比例数字为第三方引述，未经官方页面直接核验；个案结果有个体差异，不构成普遍规律。</b>以下叙事为综合公开信息的教学化重构，非对单一真实人物的完整传记。</p></div>
<h3>可验证的机制事实</h3>
<ul>
<li>Substack 的 Recommendations：作者互相推荐，出现在订阅确认页——新订阅者决策意愿最高的时刻<sup class="ref" data-src="S26">[S26]</sup>。</li>
<li>该机制的复利逻辑：被推荐 → 获得订阅 → 成为推荐者 → 获得更多被推荐。网络效应使「被推荐资格」本身成为资产。</li>
</ul>
<h3>自由职业者的获客路径（结构化重构）</h3>
<table class="tb">
<tr><th style="width:110px">阶段</th><th>动作</th><th>逻辑</th></tr>
<tr><td>冷启动</td><td>选定极窄主题（如「SaaS 定价」），每周 1 篇深度文，主动推荐 10 个相邻刊物</td><td>推荐是双向的：推荐他人是获得被推荐的最短路径</td></tr>
<tr><td>增长期</td><td>内容持续回答同一受众的高频问题；在 Substack Notes 保持可见度</td><td>被推荐的前提是「同行愿意把名字放在你的作品旁边」</td></tr>
<tr><td>变现期</td><td>付费订阅（会员专属深度内容）+ 咨询转化（订阅者是天然线索池）</td><td>邮件/订阅是「直接访问」资产，转化路径最短</td></tr>
</table>
<h3>可迁移的结论</h3>
<ul>
<li>细分领域的深度专业内容，比泛流量内容更容易获得同行推荐（推荐者承担信任成本，只推值得推的）。</li>
<li>「主动推荐他人」是被低估的增长动作——它同时是关系建设（模块 5 的互惠原理）与获客。</li>
<li>订阅制内容的收入下限 = 订阅数 × 定价 × 留存，用 1,000 真粉模型可反推所需规模<sup class="ref" data-src="S36">[S36]</sup>。</li>
</ul>
<div class="callout c-warn"><div class="ct">不可迁移与风险</div><p>该路径的前提是「能持续产出窄领域的深度内容」——对多数人是产能幻觉而非策略。且订阅增长高度依赖平台生态（Substack 的推荐网络、算法与政策），单一平台依赖风险见模块 8。头部个案（如被广泛报道的 Rachitsky）存在明显的幸存者偏差。</p></div>`,

    { id:"m9-3", title:"案例三（假设性）：垂直领域创作者的商业化探索", html: `
<div class="callout c-warn"><div class="ct">案例性质声明</div><p>本案例为<b>明确标注的假设性案例</b>，人物与数据均为教学虚构，用于展示「内容→影响力→商业化」的完整决策结构与失败路径。不指向任何真实个人或企业。</p></div>
<h3>设定</h3>
<p>「林一天」，28 岁，收纳整理师，三线城市，小红书 1.2 万粉，客单价 300 元/次上门服务，月收入 6–8k。目标：提升收入但不依赖纯体力劳动。约束：本地市场天花板明显，拍摄条件有限，无团队。</p>
<h3>四轮决策与结果</h3>
<table class="tb">
<tr><th style="width:90px">轮次</th><th>尝试</th><th>假设</th><th>结果</th></tr>
<tr><td>1</td><td>99 元线上图文课</td><td>粉丝会为低价内容付费</td><td>售出 41 份，差评 3 条（期望错位），利润 2,100 元——验证了付费意愿，暴露了产品设计问题</td></tr>
<tr><td>2</td><td>1,980 元「21 天陪伴营」</td><td>高价服务可过滤用户</td><td>2 期满员，续费率 45%，但交付重（每周 3 次直播），个人时间被锁死</td></tr>
<tr><td>3</td><td>收纳用品联盟链接</td><td>内容流量可导购</td><td>月佣金 400–900 元，但粉丝信任度下降（评论区出现「广告多了」）——及时收缩</td></tr>
<tr><td>4</td><td>「整理师接单 SOP」工具包（面向同行）</td><td>把从业经验卖给从业者</td><td>月销 30–50 份，毛利高、交付轻；且购买者成为新的人际网络</td></tr>
</table>
<h3>复盘要点</h3>
<ul>
<li><b>受众分层</b>：粉丝（想自己收拾屋子的人）与客户（愿意付钱的人）不是一群人；第 4 轮转向「同行」后，商业效率质变——这印证了定位理论中「受众即市场」的选择权重。</li>
<li><b>信任守恒</b>：第 3 轮联盟导购短期增收但消耗信任——来源可信度研究早已指出利益动机被察觉后说服效果反转为负<sup class="ref" data-src="S07">[S07]</sup>。</li>
<li><b>产品化信号</b>：第 2 轮「同一问题被反复问起」是产品化的正确信号（模块 7-5），但直接跳到课程（第 1 轮）失败，因为跳过了标准化验证。</li>
<li><b>失败价值</b>：前三轮的失败数据（差评原因、交付时间账、信任损耗）正是第四轮成功的前提——没有前两轮的学费，选不出第四轮的方向。</li>
</ul>`,

}catch(e){ store.ok = false; }

var SEARCH_INDEX = [];
(function buildIndex(){
  COURSE.modules.forEach(function(m){
    SEARCH_INDEX.push({ type:"模块", href:"#/m/"+m.id, title:"模块 "+m.num+" · "+m.title, text:stripTags(m.sub+" "+m.goals.join(" ")+" "+m.questions.join(" ")), mod:m.num });
    m.sections.forEach(function(s){
      SEARCH_INDEX.push({ type:"章节", href:"#/m/"+m.id+"/"+s.id, title:s.title, text:stripTags(s.html).slice(0,600), mod:m.num });
    });
    m.terms.forEach(function(t){
      SEARCH_INDEX.push({ type:"术语", href:"#/m/"+m.id, title:t.t, text:stripTags(t.d), mod:m.num });
    });
  });
  COURSE.sources.forEach(function(s){
    SEARCH_INDEX.push({ type:"来源", href:"#/library", title:s.id+" "+s.title, text:s.author+" "+s.note, mod:"资料库" });
  });
})();
var searchSel = -1;
function doSearch(q){
  var pop=$("searchPop");
  q=q.trim();
  if(!q){ pop.classList.remove("show"); pop.innerHTML=""; return; }
  var ql=q.toLowerCase();
  var hits=[];
  SEARCH_INDEX.forEach(function(it){
    var ti=it.title.toLowerCase().indexOf(ql), bi=it.text.toLowerCase().indexOf(ql);
    if(ti>=0||bi>=0){ hits.push({it:it,score:(ti>=0?100:0)+(ti===0?50:0)+(bi>=0?10:0),ti:ti,bi:bi}); }
  });
  hits.sort(function(a,b){ return b.score-a.score; });
  hits=hits.slice(0,15);
  if(!hits.length){ pop.innerHTML='<div class="sr-empty">未找到与「'+esc(q)+'」匹配的内容。试试更短的关键词，或到 <a href="#/library">资料库</a> 浏览来源。</div>'; pop.classList.add("show"); return; }
  pop.innerHTML = hits.map(function(h,hi){
    var it=h.it;
    var title=esc(it.title), text=esc(it.text.slice(0,140));
    if(h.ti>=0){ title=esc(it.title.slice(0,h.ti))+'<span class="mt">'+esc(it.title.slice(h.ti,h.ti+q.length))+'</span>'+esc(it.title.slice(h.ti+q.length)); }
    if(h.bi>=0 && h.bi<130){ text=esc(it.text.slice(0,h.bi))+'<span class="mt">'+esc(it.text.slice(h.bi,h.bi+q.length))+'</span>'+esc(it.text.slice(h.bi+q.length,h.bi+q.length+60)); }
    return '<a class="sr-item" href="'+it.href+'"><div class="t"><span class="tagline">'+esc(it.type)+(typeof it.mod==="number"?" · M"+it.mod:"")+'</span>'+title+'</div><div class="d">'+text+'</div></a>';
  }).join("");
  pop.classList.add("show"); searchSel=-1;
  pop.querySelectorAll(".sr-item").forEach(function(a){ a.onclick=function(){ pop.classList.remove("show"); $("sbSearchInput").blur(); }; });
}

/* ==================== 路由 ==================== */
function route(){
  var h=location.hash||"#/";
  var parts=h.replace(/^#\/?/,"").split("/").filter(Boolean);
  var article=$("article");
  window.scrollTo(0,0);
  closeSidebar();
  if(parts.length===0){ renderHome(); }
  else if(parts[0]==="path"){ renderPath(); }
  else if(parts[0]==="project"){ renderProject(); }
  else if(parts[0]==="library"){ renderLibrary(parts[1]||null); }
  else if(parts[0]==="m"){
    var m=byId(COURSE.modules,parts[1]);
    if(!m){ renderHome(); return; }
    if(parts[2]==="quiz"||!parts[2]){ if(parts[2]==="quiz") renderQuizPage(m); else renderModulePage(m); }
    else{
      var s=null; m.sections.forEach(function(x){ if(x.id===parts[2]) s=x; });
      if(s) renderSectionPage(m,s); else renderModulePage(m);
    }
  }
  else renderHome();
  renderProgress(); renderStoreNote();
  updateReadBar();
}

/* ==================== 全局事件 ==================== */
function bindGlobal(){
  var input=$("sbSearchInput");
  input.addEventListener("input",function(){ doSearch(input.value); });
  input.addEventListener("keydown",function(e){
    var pop=$("searchPop"); var items=pop.querySelectorAll(".sr-item");
    if(e.key==="Escape"){ pop.classList.remove("show"); input.blur(); }
    else if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      if(!items.length) return;
      searchSel += (e.key==="ArrowDown"?1:-1);
      if(searchSel<0) searchSel=items.length-1; if(searchSel>=items.length) searchSel=0;
      items.forEach(function(a,i){ a.classList.toggle("sel",i===searchSel); });
      items[searchSel].scrollIntoView({block:"nearest"});
    }
    else if(e.key==="Enter"){
      var sel=pop.querySelector(".sr-item.sel")||items[0];
      if(sel){ location.hash=sel.getAttribute("href"); pop.classList.remove("show"); input.blur(); }
    }
  });
  input.addEventListener("focus",function(){ if(input.value.trim()) doSearch(input.value); });
  document.addEventListener("click",function(e){
    if(!e.target.closest(".sb-search")) $("searchPop").classList.remove("show");
    var doneBtn=e.target.closest("[data-done]");
    if(doneBtn){
      var sid=doneBtn.getAttribute("data-done");
      if(isSectionDone(sid)) delete store.data.sections[sid]; else store.data.sections[sid]=Date.now();
      save();
      doneBtn.classList.toggle("on");
      doneBtn.textContent = isSectionDone(sid)?"✓ 已学完（点击取消）":"标记为已学完";
      renderNav(currentRoute()); renderProgress();
      var sec=doneBtn.closest(".sec"); if(sec){ sec.style.borderColor = isSectionDone(sid)?"#BFE3DE":""; }
    }
    var tcb=e.target.closest("[data-task]");
    if(tcb && e.target.type==="checkbox"){
      var tid=tcb.getAttribute("data-task");
      if(isTaskDone(tid)) delete store.data.tasks[tid]; else store.data.tasks[tid]=Date.now();
      save(); tcb.classList.toggle("done", isTaskDone(tid));
      renderProgress();
    }
    /* 来源引用跳转 */
    var ref=e.target.closest("sup.ref");
    if(ref){ var rid=ref.getAttribute("data-src"); if(rid){ location.hash="#/library/"+rid; } }
  });
  $("hamburger").onclick=function(){ $("sidebar").classList.add("open"); $("overlay").classList.add("show"); };
  $("overlay").onclick=closeSidebar;
  $("resetBtn").onclick=function(){
    if(confirm("确定要清空全部学习进度、任务勾选与测试记录吗？此操作不可恢复。")){
      store.data={sections:{},tasks:{},quiz:{}}; save(); route();
    }
  };
  $("toTop").onclick=function(){ window.scrollTo({top:0,behavior:"smooth"}); };
  window.addEventListener("scroll",updateReadBar,{passive:true});
  window.addEventListener("hashchange",route);
}
function closeSidebar(){ $("sidebar").classList.remove("open"); $("overlay").classList.remove("show"); }
function currentRoute(){
  var h=location.hash||"#/"; var p=h.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(!p.length) return "home";
  if(p[0]==="m"){ if(p[2]==="quiz") return "quiz:"+p[1]; if(p[2]) return "section:"+p[2]; return "module:"+p[1]; }
  return p[0];
}
function updateReadBar(){
  var st=window.scrollY, dh=document.body.scrollHeight-window.innerHeight;
  var p= dh>0 ? Math.min(100, st/dh*100) : 0;
  $("readBar").style.width=p+"%";
  $("toTop").style.display = st>500?"flex":"none";
}
