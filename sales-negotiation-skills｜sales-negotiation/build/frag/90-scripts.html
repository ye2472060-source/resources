<script>
"use strict";
/* ============================================================
   Sales & Negotiation Mastery — 全站交互脚本（无外部依赖）
   ============================================================ */
var MODULES = [
 {id:1,  t:"销售的底层逻辑与商业交易原理", s:1, d:"价值交换、信任、风险与交易结构"},
 {id:2,  t:"客户研究与销售前准备", s:1, d:"ICP、客户调研、线索分层与首联准备"},
 {id:3,  t:"顾问式销售与需求挖掘", s:1, d:"SPIN、倾听、显性与隐性需求"},
 {id:4,  t:"客户资格判断与商机管理", s:1, d:"BANT / MEDDPICC、商机阶段与止损"},
 {id:5,  t:"决策链分析与组织采购行为", s:2, d:"利益相关者、Champion 与采购委员会"},
 {id:6,  t:"价值销售与解决方案设计", s:2, d:"价值主张、TCO / ROI 与证据"},
 {id:7,  t:"客户心理与行为决策机制", s:2, d:"损失厌恶、锚定、框架与社会认同"},
 {id:8,  t:"异议处理与销售沟通", s:2, d:"异议诊断库与回应逻辑"},
 {id:9,  t:"销售过程推进与成交策略", s:2, d:"阶段管理、下一步行动与成交时机"},
 {id:10, t:"价格策略与价格谈判", s:3, d:"报价结构、谈判区间与降价纪律"},
 {id:11, t:"谈判理论与利益交换", s:3, d:"BATNA、ZOPA、让步与 MESO"},
 {id:12, t:"复杂B2B与跨境采购谈判", s:4, d:"大客户、账期、贸易术语与采购"},
 {id:13, t:"跨文化谈判与国际商务沟通", s:4, d:"语境、信任与书面确认"},
 {id:14, t:"合同谈判、承诺管理与交易风险", s:4, d:"条款、承诺边界与法务升级"},
 {id:15, t:"客户关系维护与客户成功", s:4, d:"分层、续约、健康度与风险"},
 {id:16, t:"销售数据、预测与成交率优化", s:5, d:"漏斗指标、预测与实验"},
 {id:17, t:"销售系统整合与综合实战", s:5, d:"三个贯穿案例与个人工作系统"}
];
var STAGE_MODS = {1:[1,2,3],2:[4,5,6,7,8],3:[9,10,11],4:[12,13,14,15],5:[16,17]};
var LS_KEY = "snm_progress_v1";

/* ---------- 存储 ---------- */
function loadState(){
  try{ var s = JSON.parse(localStorage.getItem(LS_KEY)||"{}"); if(!s||typeof s!=="object") s={}; return s; }
  catch(e){ return {}; }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){} }
var STATE = loadState();
if(!STATE.mods) STATE.mods = {};
if(!STATE.quiz) STATE.quiz = {};
if(!STATE.notes) STATE.notes = {};
if(!STATE.toolfill) STATE.toolfill = {};

/* ---------- 工具 ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ---------- 路由 ---------- */
var currentPage = "p-HOME";
function pageOf(el){ var p = el.closest ? el.closest(".page") : null; return p ? p.id : null; }
function go(id, anchor){
  var target = document.getElementById(id);
  if(!target) id = "p-HOME";
  $$(".page").forEach(function(p){ p.classList.remove("active"); });
  var pg = document.getElementById(id);
  if(pg) pg.classList.add("active");
  currentPage = id;
  STATE.last = id; saveState();
  // 导航高亮
  $$("[data-nav]").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-nav")===id); });
  // 侧栏模块高亮
  var modMatch = id.match(/^p-MOD(\d+)$/);
  $$("#sideMods a").forEach(function(a){
    a.classList.toggle("on", modMatch && a.getAttribute("data-nav")===id);
    a.classList.toggle("done", modMatch && STATE.mods[modMatch[1]] && STATE.mods[modMatch[1]].done);
  });
  buildRail(id);
  window.scrollTo({top:0, behavior:"auto"});
  if(anchor){
    var el = document.getElementById(anchor);
    if(el){ setTimeout(function(){ el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("hl"); setTimeout(function(){el.classList.remove("hl");},2400); }, 60); }
  }
  if(history.replaceState) history.replaceState(null,"","#"+id);
}
document.addEventListener("click", function(e){
  var nav = e.target.closest("[data-nav]");
  if(nav){ e.preventDefault(); go(nav.getAttribute("data-nav")); closeMenus(); return; }
  var a = e.target.closest('a[href^="#"]');
  if(a){
    var h = a.getAttribute("href").slice(1);
    if(!h) return;
    if(/^p-/.test(h)){
      e.preventDefault(); go(h); closeMenus(); return;
    }
    // 页内锚点：若不在当前页则先跳页
    var el = document.getElementById(h);
    var pg = pageOf(a);
    if(el && pg && pg !== currentPage){ e.preventDefault(); go(pg, h); }
  }
});
function closeMenus(){ $("#sidebar").classList.remove("open"); $("#topnav").classList.remove("open"); }

/* ---------- 首页模块网格 ---------- */
function buildHomeGrid(){
  var g = $("#homeModGrid"); if(!g) return;
  g.innerHTML = MODULES.map(function(m){
    var done = STATE.mods[m.id] && STATE.mods[m.id].done;
    return '<div class="mod-card'+(done?" completed":"")+'" data-nav="p-MOD'+m.id+'" role="button" tabindex="0">'+
      '<div class="num">'+String(m.id).padStart(2,"0")+'</div>'+
      '<div><h3>'+esc(m.t)+'</h3><p>'+esc(m.d)+'</p><span class="st">'+(done?"✓ 已学完":"阶段"+m.s+" · 未完成")+'</span></div></div>';
  }).join("");
}
function refreshProgress(){
  var done = 0;
  MODULES.forEach(function(m){
    var d = STATE.mods[m.id] && STATE.mods[m.id].done;
    if(d) done++;
    var card = $('.mod-card[data-nav="p-MOD'+m.id+'"]');
    if(card){ card.classList.toggle("completed", !!d); var st = $(".st",card); if(st) st.textContent = d?"✓ 已学完":"阶段"+m.s+" · 未完成"; }
  });
  $("#progText").textContent = done + "/17";
  Object.keys(STAGE_MODS).forEach(function(s){
    var ids = STAGE_MODS[s], c = 0;
    ids.forEach(function(i){ if(STATE.mods[i] && STATE.mods[i].done) c++; });
    var bar = $('[data-stage-bar="'+s+'"]');
    if(bar) bar.style.width = (c/ids.length*100)+"%";
  });
  // 继续学习
  var box = $("#continueBox"), txt = $("#continueText"), btn = $("#continueBtn");
  if(box){
    var lastId = STATE.last && document.getElementById(STATE.last) ? STATE.last : null;
    if(lastId && lastId !== "p-HOME"){
      var m = lastId.match(/^p-MOD(\d+)$/);
      var name = m ? ("模块 "+m[1]+" · "+MODULES[+m[1]-1].t) : (document.querySelector("#"+lastId+" .page-head h1")||{}).textContent || lastId;
      txt.innerHTML = "<b>"+esc(name)+"</b><p>上次学习位置（本浏览器记录）。已完成 "+done+"/17 个模块。</p>";
      btn.textContent = "继续 →";
      btn.setAttribute("data-nav", lastId);
      box.style.display = "";
    } else if(done>0){
      txt.innerHTML = "<b>已完成 "+done+"/17 个模块</b><p>从第一个未完成的模块继续，或回到学习路径规划进度。</p>";
      btn.textContent = "继续 →";
      btn.setAttribute("data-nav", "p-PATH");
      box.style.display = "";
    } else { box.style.display = "none"; }
  }
}

/* ---------- 右侧目录 rail ---------- */
function buildRail(id){
  var rail = $("#rail"); if(!rail) return;
  var pg = document.getElementById(id); if(!pg){ rail.innerHTML=""; return; }
  var heads = $$("h2", pg).filter(function(h){ return !h.closest(".page-head"); });
  var html = "<h4>本页目录</h4>";
  heads.forEach(function(h){
    if(!h.id) h.id = "sec-" + id + "-" + Math.random().toString(36).slice(2,7);
    html += '<a href="#'+h.id+'">'+esc(h.textContent.replace(/^\d+(\.\d+)?\s*/,"").slice(0,26))+'</a>';
  });
  html += '<div class="rail-tools"><h4>快捷入口</h4>'+
    '<a href="#" data-nav="p-TOOLS">工具库</a><a href="#" data-nav="p-CASES">综合案例</a>'+
    '<a href="#" data-nav="p-SIMS">模拟训练</a><a href="#" data-nav="p-ASSESS">测评成长</a>'+
    '<a href="#" data-nav="p-GLOSSARY">术语词典</a><a href="#" data-nav="p-REFS">参考资料</a></div>';
  rail.innerHTML = html;
}

/* ---------- 搜索 ---------- */
var SEARCH_IDX = [];
function buildSearchIndex(){
  SEARCH_IDX = [];
  $$(".page").forEach(function(pg){
    var pname = (pg.querySelector(".page-head h1")||{}).textContent || pg.id;
    $$("h1,h2,h3", pg).forEach(function(h){
      if(h.closest(".page-head") && h.tagName==="H1") return;
      var t = h.textContent.trim();
      if(t.length < 2) return;
      SEARCH_IDX.push({t:t, p:pname, pid:pg.id, el:h});
    });
    $$(".tool-head h3", pg).forEach(function(h){
      SEARCH_IDX.push({t:h.textContent.trim(), p:"工具库", pid:pg.id, el:h});
    });
    $$(".gloss-term", pg).forEach(function(h){
      SEARCH_IDX.push({t:h.textContent.trim(), p:"术语词典", pid:pg.id, el:h});
    });
  });
}
function initSearch(){
  var input = $("#searchInput"), box = $("#searchResults");
  if(!input||!box) return;
  input.addEventListener("input", function(){
    var q = input.value.trim().toLowerCase();
    if(q.length < 1){ box.classList.remove("open"); box.innerHTML=""; return; }
    var hits = SEARCH_IDX.filter(function(it){ return it.t.toLowerCase().indexOf(q)>=0; }).slice(0,12);
    if(!hits.length){ box.innerHTML = '<div class="sr-empty">未找到「'+esc(input.value)+'」相关内容<br>试试：BATNA、SPIN、异议、谈判区间、漏斗</div>'; box.classList.add("open"); return; }
    box.innerHTML = hits.map(function(it,i){
      return '<div class="sr-item" data-i="'+i+'"><div class="t">'+esc(it.t)+'</div><div class="c">'+esc(it.p)+'</div></div>';
    }).join("");
    box.classList.add("open");
    $$(".sr-item", box).forEach(function(el){
      el.addEventListener("click", function(){
        var it = hits[+el.getAttribute("data-i")];
        box.classList.remove("open"); input.value = "";
        go(it.pid);
        setTimeout(function(){
          it.el.scrollIntoView({behavior:"smooth",block:"center"});
          it.el.classList.add("hl"); setTimeout(function(){it.el.classList.remove("hl");},2400);
        }, 80);
      });
    });
  });
  input.addEventListener("keydown", function(e){ if(e.key==="Escape"){ box.classList.remove("open"); input.blur(); } });
  document.addEventListener("click", function(e){ if(!e.target.closest(".searchbox")) box.classList.remove("open"); });
  document.addEventListener("keydown", function(e){
    if(e.key==="/" && document.activeElement!==input && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
      e.preventDefault(); input.focus();
    }
  });
}

/* ---------- 模块完成按钮 ---------- */
function initCompleteButtons(){
  $$(".btn-complete").forEach(function(btn){
    var mod = btn.getAttribute("data-mod");
    function paint(){
      var d = STATE.mods[mod] && STATE.mods[mod].done;
      btn.classList.toggle("done", !!d);
      btn.innerHTML = d ? "✓ 本模块已学完（点击取消）" : "标记本模块为已学完";
    }
    btn.addEventListener("click", function(){
      if(!STATE.mods[mod]) STATE.mods[mod] = {};
      STATE.mods[mod].done = !STATE.mods[mod].done;
      saveState(); paint(); refreshProgress();
    });
    paint();
  });
}

/* ---------- 随堂测验 ---------- */
function initQuizzes(){
  $$(".quiz").forEach(function(quiz, qi){
    var pid = pageOf(quiz) || "x";
    $$("li[data-ans]", quiz).forEach(function(li, ai){
      var ans = +li.getAttribute("data-ans");
      var key = pid + "_" + qi + "_" + ai;
      var opts = $$(".q-opts li", li);
      var exp = $(".q-exp", li);
      function answer(idx, silent){
        if(li.getAttribute("data-done")==="1") return;
        li.setAttribute("data-done","1");
        opts.forEach(function(o,oi){
          o.classList.remove("picked");
          if(oi===idx) o.classList.add(oi===ans?"right":"wrong");
          if(oi===ans) o.classList.add("right");
        });
        if(exp) exp.classList.add("show");
        STATE.quiz[key] = idx; saveState(); updateQuizScore(quiz, pid, qi);
      }
      opts.forEach(function(o,oi){
        o.addEventListener("click", function(){ answer(oi); });
      });
      if(STATE.quiz[key]!==undefined){ answer(STATE.quiz[key], true); }
    });
    updateQuizScore(quiz, pid, qi);
  });
}
function updateQuizScore(quiz, pid, qi){
  var total = $$("li[data-ans]", quiz).length, correct = 0;
  $$("li[data-ans]", quiz).forEach(function(li, ai){
    if(STATE.quiz[pid+"_"+qi+"_"+ai] === +li.getAttribute("data-ans")) correct++;
  });
  var sc = $(".q-score", quiz);
  if(!sc){ sc = document.createElement("p"); sc.className="q-score"; quiz.appendChild(sc); }
  sc.textContent = "本页测验得分：" + correct + " / " + total + (correct===total && total>0 ? " · 全部正确 ✓" : "（得分记录在本浏览器）");
}

/* ---------- 模拟训练推进 ---------- */
function initSims(){
  $$(".sim").forEach(function(sim){
    var stages = $$(".sim-stage", sim);
    if(!stages.length) return;
    var ctrl = document.createElement("div");
    ctrl.className = "sim-ctrl";
    ctrl.innerHTML = '<button class="btn btn-primary sim-next">推进对话 ▶</button>'+
      '<span class="sim-progress"></span>'+
      '<span class="sim-done">✓ 本模拟已完成</span>'+
      '<button class="btn sim-reset" style="display:none">重新开始</button>';
    sim.appendChild(ctrl);
    var next = $(".sim-next", ctrl), prog = $(".sim-progress", ctrl),
        done = $(".sim-done", ctrl), reset = $(".sim-reset", ctrl);
    function paint(){
      var shown = stages.filter(function(s){ return s.style.display==="block"; }).length;
      stages.forEach(function(s,i){ s.style.display = i<shown ? "block" : "none"; });
      prog.textContent = shown + " / " + stages.length + " 阶段";
      var fin = shown>=stages.length;
      next.style.display = fin ? "none" : "";
      done.style.display = fin ? "" : "none";
      reset.style.display = fin ? "" : "none";
    }
    next.addEventListener("click", function(){
      var shown = stages.filter(function(s){ return s.style.display==="block"; }).length;
      if(shown < stages.length){ stages[shown].style.display = "block"; }
      paint();
    });
    reset.addEventListener("click", function(){
      stages.forEach(function(s,i){ s.style.display = i===0?"block":"none"; });
      paint();
    });
    paint();
  });
}

/* ---------- 每页笔记 ---------- */
function initNotes(){
  $$(".page").forEach(function(pg){
    if(pg.id==="p-HOME") return;
    var wrap = document.createElement("div");
    wrap.className = "note-area";
    wrap.innerHTML = '<label>本页笔记 <span>自动保存在本浏览器（localStorage），不会跨设备同步</span></label>'+
      '<textarea placeholder="记录你的疑问、灵感、待验证的假设……">'+esc(STATE.notes[pg.id]||"")+'</textarea>';
    pg.appendChild(wrap);
    var ta = $("textarea", wrap);
    ta.addEventListener("input", function(){ STATE.notes[pg.id]=ta.value; saveState(); });
  });
}

/* ---------- 参考来源过滤 ---------- */
function initRefFilter(){
  var bar = $("#refFilter"); if(!bar) return;
  bar.addEventListener("click", function(e){
    var btn = e.target.closest("button"); if(!btn) return;
    $$("button", bar).forEach(function(b){ b.classList.remove("on"); });
    btn.classList.add("on");
    var cat = btn.getAttribute("data-cat");
    $$("#refList .ref-item").forEach(function(it){
      it.style.display = (cat==="ALL" || (it.getAttribute("data-cat")||"").indexOf(cat)>=0) ? "" : "none";
    });
  });
  // ref-tag 跳转
  $$(".ref-tag").forEach(function(tag){
    tag.addEventListener("click", function(){
      var rid = tag.getAttribute("data-ref") || tag.textContent.trim();
      go("p-REFS");
      setTimeout(function(){
        var item = $$("#refList .ref-item").filter(function(it){
          var r = $(".rid", it); return r && r.textContent.trim()===rid;
        })[0];
        if(item){ item.scrollIntoView({behavior:"smooth",block:"center"}); item.classList.add("hl"); setTimeout(function(){item.classList.remove("hl");},2400); }
      }, 100);
    });
  });
}

/* ---------- 图示渲染 ---------- */
function renderDiagrams(){
  $$(".fig-slot").forEach(function(fig){
    var key = fig.getAttribute("data-diagram");
    if(window.DIAGRAMS && DIAGRAMS[key]){
      fig.insertAdjacentHTML("afterbegin", DIAGRAMS[key]);
    } else {
      fig.insertAdjacentHTML("afterbegin", '<div style="padding:26px;text-align:center;color:#667085;font-size:13px">图示「'+esc(key||"?")+'」加载中或暂缺</div>');
    }
  });
}

/* ---------- 计算器 ---------- */
function fmt(n, d){ return (n||0).toFixed(d===undefined?2:d); }
function initCalcs(){
  // —— 谈判区间计算器（BATNA/ZOPA） ——
  var z = $('[data-calc="zopa"]'); if(z){
    z.innerHTML = calcShell("谈判区间计算器（BATNA / ZOPA）",
      "输入你与对方的四个关键数字，系统判断 ZOPA 是否存在、可谈空间大小，并给出开价与退出建议。对方底线为估计值，须在谈判中验证。",
      [
        {id:"role", label:"我的角色", type:"select", opts:["卖方（我出价）","买方（我采购）"]},
        {id:"target", label:"我的目标价（理想结果）", type:"num", ph:"如 100"},
        {id:"reserve", label:"我的保留价（底线）", type:"num", ph:"低于/高于即退出"},
        {id:"oTarget", label:"预估对方目标价", type:"num", ph:"估计值"},
        {id:"oReserve", label:"预估对方底线", type:"num", ph:"对方最高可付/最低可收"}
      ], "calcOutZopa");
    function run(){
      var role = $("#calc-role").value, target=+$("#calc-target").value, reserve=+$("#calc-reserve").value,
          ot=+$("#calc-oTarget").value, orv=+$("#calc-oReserve").value;
      var out = $("#calcOutZopa");
      if(!target||!reserve||!ot||!orv){ out.innerHTML='<div class="row"><span>请完整填写四个价格</span><b></b></div>'; return; }
      // 统一换算为"价格"维度：卖方 reserve=最低可收；买方 reserve=最高可付
      var myMin, myMax, theirMin, theirMax;
      if(role.indexOf("卖方")===0){ myMin=reserve; myMax=target; theirMin=ot; theirMax=orv; }
      else { myMin=target; myMax=reserve; theirMin=orv; theirMax=ot; }
      // ZOPA = [max(myMin, theirMin), min(myMax, theirMax)]
      var lo = Math.max(myMin, theirMin), hi = Math.min(myMax, theirMax);
      var html = "";
      if(hi >= lo){
        var space = hi - lo;
        html += '<div class="row"><span>ZOPA 是否存在</span><b class="ok">存在</b></div>';
        html += '<div class="row"><span>可能成交区间</span><b>'+fmt(lo)+' — '+fmt(hi)+'</b></div>';
        html += '<div class="row"><span>可谈空间</span><b>'+fmt(space)+'</b></div>';
        // 锚点策略：卖方高开（不低于目标价再上一个台阶，必要时顶到对方上限以拉高ZOPA）；买方低开（不高于目标价再下一个台阶，必要时压到对方下限）
        var open = role.indexOf("卖方")===0 ? Math.max(target*1.1, theirMax) : Math.min(target*0.9, theirMin);
        html += '<div class="row"><span>建议开价（锚点）</span><b>'+fmt(open)+'</b></div>';
        html += '<div class="verdict">ZOPA 存在：把谈判任务从"能否成交"转为"在区间内拿到多好位置"。区间越窄，越要尽快转向多议题交换（见模块11 MESO）。</div>';
      } else {
        html += '<div class="row"><span>ZOPA 是否存在</span><b class="bad">不存在</b></div>';
        html += '<div class="row"><span>我的底线</span><b>'+fmt(role.indexOf("卖方")===0?myMin:myMax)+'</b></div>';
        html += '<div class="row"><span>对方底线（估计）</span><b>'+fmt(role.indexOf("卖方")===0?theirMax:theirMin)+'</b></div>';
        html += '<div class="verdict">按当前数字无成交区间：不要硬压价格。①验证对方底线是否估计错误；②引入新议题（交期、付款、服务范围）扩大价值；③启动 BATNA。若三者都无效，有纪律地退出。</div>';
      }
      out.innerHTML = html;
    }
    $$('[data-calc="zopa"] input,[data-calc="zopa"] select').forEach(function(el){ el.addEventListener("input", run); });
  }

  // —— 降价影响与利润计算器 ——
  var p = $('[data-calc="price"]'); if(p){
    p.innerHTML = calcShell("降价影响与利润计算器",
      "计算一次折扣对利润率、利润额与盈亏平衡的影响，并检查是否突破底线。所有金额为不含税单价口径。",
      [
        {id:"price", label:"原报价（单价）", type:"num", ph:"如 100"},
        {id:"cost", label:"单位成本", type:"num", ph:"如 60"},
        {id:"qty", label:"当前订单量", type:"num", ph:"如 1000"},
        {id:"disc", label:"拟给折扣 %", type:"num", ph:"如 5"},
        {id:"floor", label:"底线折扣 %（最高可给）", type:"num", ph:"如 10"},
        {id:"rep", label:"换来后续复购概率 %", type:"num", ph:"如 30（可为空）"}
      ], "calcOutPrice");
    function run(){
      var price=+$("#calc-price").value, cost=+$("#calc-cost").value, qty=+$("#calc-qty").value,
          disc=+$("#calc-disc").value, floor=+$("#calc-floor").value, rep=+$("#calc-rep").value;
      var out=$("#calcOutPrice");
      if(!price||!cost){ out.innerHTML='<div class="row"><span>请填写报价与成本</span><b></b></div>'; return; }
      var d = disc||0, q = qty||0;
      var newPrice = price*(1-d/100);
      var oldProfit = price-cost, newProfit = newPrice-cost;
      var oldRate = oldProfit/price*100, newRate = newProfit/price*100;
      var oldMargin = oldProfit*q, newMargin = newProfit*q;
      var breakEven = newProfit>0 ? (oldProfit/newProfit-1)*100 : Infinity;
      var html = "";
      html += '<div class="row"><span>成交单价</span><b>'+fmt(newPrice)+'</b></div>';
      html += '<div class="row"><span>单件利润（原 → 新）</span><b>'+fmt(oldProfit)+' → '+fmt(newProfit)+'</b></div>';
      html += '<div class="row"><span>利润率（原 → 新）</span><b>'+fmt(oldRate,1)+'% → '+fmt(newRate,1)+'%</b></div>';
      if(q){ html += '<div class="row"><span>同量利润变化</span><b>'+fmt(newMargin-oldMargin)+'</b></div>'; }
      html += '<div class="row"><span>盈亏平衡所需订单增幅</span><b>'+(isFinite(breakEven)?fmt(breakEven,1)+'%':'无法平衡')+'</b></div>';
      if(newProfit<=0){ html += '<div class="verdict bad">该折扣已击穿成本：零利润或负利润订单。拒绝，或改变交易结构（规格/范围/交期），而不是降价。</div>'; }
      else if(floor && d>floor){ html += '<div class="verdict bad">超出底线折扣 '+fmt(d-floor,1)+' 个百分点。每一次让步都必须换取对价（见 T23 让步计划表）。</div>'; }
      else if(breakEven>50){ html += '<div class="verdict">需要 '+fmt(breakEven,0)+'% 以上的增量才能补回利润——若换不来这个增量，让价就是净损失。优先用非价格条件交换。</div>'; }
      else { html += '<div class="verdict ok">利润仍在安全区：可让，但必须"有条件地让"（换量、换条款、换长期承诺），并记录在案防止连续让价。</div>'; }
      if(rep>0 && rep<=100 && q){
        var expect = newProfit*q*(rep/100);
        html += '<div class="row"><span>期望后续利润（粗算）</span><b>'+fmt(expect)+'</b></div>';
        html += '<div class="calc-note">粗算假设：后续订单量=当前量、利润率=本次折扣后利润率。仅用于量级判断，不能替代真实客户数据。</div>';
      }
      out.innerHTML = html;
    }
    $$('[data-calc="price"] input').forEach(function(el){ el.addEventListener("input", run); });
  }

  // —— 加权销售预测表 ——
  var f = $('[data-calc="forecast"]'); if(f){
    f.innerHTML = calcShell("加权销售预测表",
      "输入每个商机的金额与所处阶段概率，自动计算简单合计、加权金额与对目标的覆盖率。阶段概率应使用你团队的历史真实成交率校准（见 T32 指标字典）。",
      [
        {id:"goal", label:"期间销售目标", type:"num", ph:"如 1000000"}
      ], "calcOutForecast");
    var tbl = document.createElement("div");
    tbl.className = "table-wrap";
    tbl.innerHTML = '<table class="calc-table" id="fcTable"><thead><tr><th style="width:34%">商机名称</th><th>金额</th><th>阶段概率</th><th>加权金额</th><th></th></tr></thead><tbody></tbody></table>';
    f.appendChild(tbl);
    var addBtn = document.createElement("button");
    addBtn.className = "btn"; addBtn.textContent = "+ 添加商机行";
    f.appendChild(addBtn);
    var out = document.createElement("div"); out.className = "calc-out"; out.id = "calcOutForecast2";
    f.appendChild(out);
    var probs = [["10%",0.1],["25%",0.25],["40%",0.4],["50%",0.5],["70%",0.7],["90%",0.9]];
    function row(name, amt, prob){
      var tr = document.createElement("tr");
      var opts = probs.map(function(p){ return '<option value="'+p[1]+'"'+(p[1]===prob?" selected":"")+'>'+p[0]+'</option>'; }).join("");
      tr.innerHTML = '<td><input type="text" class="fc-n" value="'+esc(name||"")+'" placeholder="商机名"></td>'+
        '<td><input type="number" class="fc-a" value="'+(amt||"")+'" placeholder="0" min="0"></td>'+
        '<td><select class="fc-p">'+opts+'</select></td>'+
        '<td class="fc-w">0</td>'+
        '<td><button class="btn fc-del" title="删除本行" style="padding:2px 9px">×</button></td>';
      $(".fc-del", tr).addEventListener("click", function(){ tr.remove(); run(); });
      $$("input,select", tr).forEach(function(el){ el.addEventListener("input", run); });
      $("tbody", tbl).appendChild(tr);
      return tr;
    }
    function run(){
      var sum=0, wsum=0;
      $$("tbody tr", tbl).forEach(function(tr){
        var a=+$(".fc-a",tr).value||0, p=+$(".fc-p",tr).value||0, w=a*p;
        $(".fc-w",tr).textContent = w.toLocaleString();
        sum+=a; wsum+=w;
      });
      var goal=+$("#calc-goal").value||0;
      var html = '<div class="row"><span>商机数量</span><b>'+$$("tbody tr",tbl).length+'</b></div>'+
        '<div class="row"><span>管道简单合计</span><b>'+sum.toLocaleString()+'</b></div>'+
        '<div class="row"><span>加权预测金额</span><b>'+wsum.toLocaleString()+'</b></div>';
      if(goal){
        var cover = sum/goal*100, wcover = wsum/goal*100;
        html += '<div class="row"><span>管道覆盖率（简单）</span><b>'+fmt(cover,0)+'%</b></div>';
        html += '<div class="row"><span>加权目标完成率</span><b class="'+(wcover>=100?"ok":"bad")+'">'+fmt(wcover,0)+'%</b></div>';
        html += '<div class="verdict">加权金额远低于目标且覆盖率不足 3 倍时，问题通常在管道顶部（线索量）而非底部技巧；先补量再优化转化。</div>';
      } else {
        html += '<div class="verdict">填写期间销售目标后显示覆盖率。经验参考：管道覆盖率常需 3—4 倍，但合理倍数取决于你的成交率与周期，须用历史数据校准。</div>';
      }
      out.innerHTML = html;
    }
    addBtn.addEventListener("click", function(){ row("",0,0.5); run(); });
    $$('[data-calc="forecast"] input').forEach(function(el){ el.addEventListener("input", run); });
    row("示例商机 A", 200000, 0.7); row("示例商机 B", 150000, 0.4); run();
  }

  // —— 客户资格评分计算器 ——
  var q = $('[data-calc="qualify"]'); if(q){
    var crit = [
      ["M · Metrics 量化价值","客户认可的、可量化的业务结果是什么？（证据：客户亲口说出的数字）"],
      ["E · Economic Buyer 经济决策者","已见过并确认能动用预算的人是谁？（证据：姓名+会面）"],
      ["D · Decision Criteria 决策标准","知道客户将用什么标准比较方案吗？"],
      ["D · Decision Process 决策流程","了解客户的决策步骤、审批与时间表吗？"],
      ["I · Identify Pain 痛点","痛点被客户自己说出、且被理解其影响吗？"],
      ["C · Champion 支持者","存在愿意替你说话的内部人吗？"],
      ["C · Competition 竞争","知道还包括谁（含「维持现状」）吗？"],
      ["P · Paper Process 采购流程","了解决策后的合同/法务/采购流程吗？"]
    ];
    var rows = crit.map(function(c,i){
      return '<div class="sr-row" style="grid-template-columns:1fr 120px"><span class="lbl" title="'+esc(c[1])+'">'+esc(c[0])+'</span>'+
        '<select class="qq" data-i="'+i+'"><option value="0">无证据 0</option><option value="1">部分证据 1</option><option value="2">充分证据 2</option></select></div>';
    }).join("");
    q.innerHTML = '<div class="calc"><h4>客户资格评分计算器（MEDDPICC 简版）</h4>'+
      '<p class="calc-desc">对每个维度按证据充分程度打 0—2 分。分数只反映"证据强度"，不反映客户好坏；评分的目的是决定下一步动作，而不是给商机贴标签。</p>'+
      rows + '<div class="calc-out" id="calcOutQualify"></div>'+
      '<p class="calc-note">评分口径：0=没有证据或仅猜测；1=有间接证据或单一联系人说法；2=有一手证据（客户书面/亲口确认、多方交叉验证）。</p></div>';
    function run(){
      var vals = $$(".qq", q).map(function(s){ return +s.value; });
      var got = vals.reduce(function(a,b){return a+b;},0), max = vals.length*2;
      var pct = got/max*100;
      var out = $("#calcOutQualify");
      var html = '<div class="row"><span>总分</span><b>'+got+' / '+max+'</b></div>'+
        '<div class="row"><span>证据强度</span><b>'+fmt(pct,0)+'%</b></div>';
      var zero = [];
      crit.forEach(function(c,i){ if(vals[i]===0) zero.push(c[0].split(" · ")[0]); });
      if(zero.length) html += '<div class="row"><span>零证据维度</span><b>'+esc(zero.join("、"))+'</b></div>';
      if(pct>=75) html += '<div class="verdict ok">商机证据充分：全力推进，按阶段要求准备下一步证据。</div>';
      else if(pct>=45) html += '<div class="verdict">部分维度缺证据：不要撒手，也不要加码——把资源集中在补零证据维度上（通常是经济决策者与决策流程）。</div>';
      else html += '<div class="verdict bad">证据严重不足：这更像"愿望"而不是"商机"。降低投入节奏，设定补证期限，到期无证据则按 T07 停止跟进条件处理。</div>';
      out.innerHTML = html;
    }
    $$(".qq", q).forEach(function(s){ s.addEventListener("change", run); });
    run();
  }
}
function calcShell(title, desc, fields, outId){
  var inputs = fields.map(function(f){
    if(f.type==="select"){
      var opts = f.opts.map(function(o){return '<option>'+esc(o)+'</option>';}).join("");
      return '<div><label>'+esc(f.label)+'</label><select id="calc-'+f.id+'">'+opts+'</select></div>';
    }
    return '<div><label>'+esc(f.label)+'</label><input id="calc-'+f.id+'" type="number" placeholder="'+esc(f.ph||"")+'"></div>';
  }).join("");
  return '<div class="calc"><h4>'+esc(title)+'</h4><p class="calc-desc">'+esc(desc)+'</p>'+
    '<div class="calc-grid">'+inputs+'</div><div class="calc-out" id="'+outId+'"></div></div>';
}

/* ---------- 能力自评雷达 ---------- */
var RATE_LABELS = ["信息收集","提问倾听","资格判断","价值表达","异议诊断","谈判准备","BATNA底线","让步纪律","风险伦理","推进复盘"];
function initSelfRate(){
  var box = $(".self-rate"); if(!box) return;
  $$('input[type=range][data-dim]', box).forEach(function(r){
    var val = $(".val", r.closest(".sr-row"));
    function paint(){
      if(val) val.textContent = r.value;
      if(STATE.rate && STATE.rate[+r.getAttribute("data-dim")-1] !== undefined && document.activeElement!==r){}
    }
    r.addEventListener("input", function(){ if(val) val.textContent = r.value; drawRadar(); });
    // 恢复
    if(STATE.rate){
      var v = STATE.rate[+r.getAttribute("data-dim")-1];
      if(v!==undefined){ r.value = v; if(val) val.textContent = v; }
    }
    paint();
  });
  var save = $("#saveRateBtn");
  if(save) save.addEventListener("click", function(){
    STATE.rate = $$('input[type=range][data-dim]', box).map(function(r){ return +r.value; });
    saveState();
    save.textContent = "✓ 已保存到本浏览器";
    setTimeout(function(){ save.textContent = "保存自评结果"; }, 1800);
    drawRadar();
  });
  // 重置按钮
  var reset = document.createElement("button");
  reset.className = "btn"; reset.id = "resetProgBtn"; reset.textContent = "重置全部学习数据";
  reset.style.marginLeft = "10px";
  reset.addEventListener("click", function(){
    if(confirm("将清空本浏览器中保存的所有学习进度、测验得分、笔记与自评数据，且不可恢复。确定吗？")){
      localStorage.removeItem(LS_KEY);
      location.reload();
    }
  });
  if(save && save.parentNode) save.parentNode.insertBefore(reset, save.nextSibling);
  drawRadar();
}
function drawRadar(){
  var box = $("#radarBox"); if(!box) return;
  var vals = $$('input[type=range][data-dim]').map(function(r){ return +r.value; });
  if(vals.length!==10){ box.innerHTML=""; return; }
  var cx=340, cy=170, R=120, n=10;
  function pt(i, r){ var a = -Math.PI/2 + i*2*Math.PI/n; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; }
  var s = '<svg viewBox="0 0 680 340" role="img" aria-label="十维能力自评雷达图" font-family="PingFang SC,Microsoft YaHei,sans-serif">';
  [1,2,3,4,5].forEach(function(k){
    var pts = [];
    for(var i=0;i<n;i++){ var p=pt(i, R*k/5); pts.push(p[0].toFixed(1)+","+p[1].toFixed(1)); }
    s += '<polygon points="'+pts.join(" ")+'" fill="'+(k===5?"#FAFBFD":"none")+'" stroke="#E2E7EE" stroke-width="1"/>';
  });
  for(var i=0;i<n;i++){ var p=pt(i,R); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#E2E7EE"/>'; }
  var poly = [];
  for(var i=0;i<n;i++){ var p=pt(i, R*Math.max(vals[i],0.02)/5); poly.push(p[0].toFixed(1)+","+p[1].toFixed(1)); }
  s += '<polygon points="'+poly.join(" ")+'" fill="rgba(71,118,168,.18)" stroke="#4776A8" stroke-width="2"/>';
  for(var i=0;i<n;i++){
    var p=pt(i, R*Math.max(vals[i],0.02)/5);
    s += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#4776A8"/>';
    var lp = pt(i, R+26);
    s += '<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+4).toFixed(1)+'" text-anchor="middle" font-size="11" fill="#182230">'+RATE_LABELS[i]+'</text>';
    var vp = pt(i, R+40);
    s += '<text x="'+vp[0].toFixed(1)+'" y="'+(vp[1]+4).toFixed(1)+'" text-anchor="middle" font-size="10" fill="#7BA69A" font-weight="700">'+vals[i]+'</text>';
  }
  s += '<text x="'+(cx-R-10)+'" y="'+(cy-R-8)+'" font-size="10" fill="#667085">5</text>';
  s += '<text x="'+(cx-R-10)+'" y="'+(cy+4)+'" font-size="10" fill="#667085">0</text>';
  s += '</svg>';
  box.innerHTML = s;
}

/* ---------- 工具填写模式 ---------- */
function initToolFill(){
  $$(".tool").forEach(function(tool){
    var id = tool.id || ("tool-"+Math.random().toString(36).slice(2,7));
    var head = $(".tool-head", tool); if(!head) return;
    var btn = document.createElement("button");
    btn.className = "btn"; btn.style.marginLeft="auto"; btn.textContent="填写模式";
    head.appendChild(btn);
    var on = false;
    btn.addEventListener("click", function(){
      on = !on;
      btn.textContent = on ? "退出填写（内容已保存）" : "填写模式";
      btn.classList.toggle("done", on);
      $$("table td", tool).forEach(function(td, i){
        td.contentEditable = on ? "true" : "false";
        td.classList.toggle("ce", on);
        if(on){
          var key = id+"_"+i;
          if(STATE.toolfill[key]) td.textContent = STATE.toolfill[key];
          td.addEventListener("input", function(){ STATE.toolfill[key]=td.textContent; saveState(); });
        }
      });
      if(on){
        var hint = $(".fill-hint", tool);
        if(!hint){
          hint = document.createElement("p");
          hint.className = "fill-hint note";
          hint.textContent = "填写模式已开启：直接点击表格单元格输入，内容自动保存在本浏览器。打印或导出前建议先退出填写模式。";
          tool.appendChild(hint);
        }
        hint.style.display = "";
      }
    });
  });
}
