<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO + GEO Growth Academy — 网站增长与数字营销知识体系</title>
<meta name="description" content="系统学习 SEO、GEO（生成式引擎优化）、网站运营、内容营销、全渠道流量、数据分析与转化优化的交互式知识平台。">
<style>
:root{
  --bg:#F5F7FA; --card:#FFFFFF; --text:#1F2937; --sub:#64748B; --primary:#2563EB; --accent:#0F766E;
  --border:#E2E8F0; --hover:#F1F5F9; --chip:#F1F5F9;
  --m-base:#64748B; --m-seo:#2563EB; --m-geo:#7C3AED; --m-site:#0F766E; --m-content:#D97706;
  --m-channel:#DB2777; --m-data:#0891B2; --m-cro:#16A34A; --m-tools:#475569; --m-proj:#EA580C;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
  --mono:"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
  --radius:8px;
}
[data-theme="dark"]{
  --bg:#0B1220; --card:#111C2E; --text:#E6EDF5; --sub:#93A4B8; --border:#24334D; --hover:#17233A; --chip:#17233A;
  --primary:#5B9BFF; --accent:#2DD4BF; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:.92em;background:var(--chip);padding:1px 5px;border-radius:4px;color:var(--text)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(37,99,235,.18)}

/* ============ 顶部导航 ============ */
.topbar{position:fixed;top:0;left:0;right:0;height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:100}
.brand{display:flex;flex-direction:column;min-width:0}
.brand .t1{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand .t2{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.searchbox{position:relative;width:min(420px,38vw)}
.searchbox input{width:100%;height:38px;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:0 34px 0 34px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.searchbox input:focus{border-color:var(--primary);background:var(--card)}
.searchbox .s-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.searchbox kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--sub);border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--card);font-family:var(--mono)}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:var(--card);transition:background .15s;white-space:nowrap}
.tbtn:hover{background:var(--hover);text-decoration:none}
.tbtn svg{flex:none}
.hamburger{display:none}

/* 搜索结果下拉 */
.searchdrop{position:absolute;top:44px;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.14);max-height:60vh;overflow:auto;display:none;z-index:120}
.searchdrop.open{display:block}
.sd-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.sd-item:last-child{border-bottom:none}
.sd-item:hover{background:var(--hover)}
.sd-item .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sd-item .nm{font-size:13px;font-weight:600}
.sd-item .md{font-size:11px;color:var(--sub);margin-left:auto;white-space:nowrap}
.sd-empty{padding:16px;color:var(--sub);font-size:13px;text-align:center}
.sd-head{padding:8px 14px;font-size:11px;color:var(--sub);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}

/* ============ 布局 ============ */
#app{display:flex;padding-top:64px;min-height:100vh}
.sidebar{position:fixed;top:64px;bottom:0;left:0;width:264px;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:14px 10px 40px;z-index:90;transition:transform .25s}
.sb-group{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.08em;padding:12px 10px 6px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text);user-select:none}
.sb-item:hover{background:var(--hover)}
.sb-item.active{background:rgba(37,99,235,.09);color:var(--primary);font-weight:600}
.sb-item .badge{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.sb-item .pbar{margin-left:auto;width:38px;height:4px;border-radius:2px;background:var(--border);overflow:hidden;flex:none}
.sb-item .pbar i{display:block;height:100%;border-radius:2px}
.sb-item .pct{font-size:10px;color:var(--sub);width:30px;text-align:right;flex:none}
.sb-sec{padding-left:22px}
.sb-sec .sb-item{font-size:12.5px;color:var(--sub);padding:5px 10px}
.sb-sec .sb-item:hover{color:var(--text)}
.sb-sec .sb-item.active{color:var(--primary)}
.main{flex:1;margin-left:264px;padding:26px 32px 80px;min-width:0}
.main-inner{max-width:1200px;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h2{font-size:20px;font-weight:650;margin-bottom:4px}
.card h3{font-size:15px;font-weight:650;margin:16px 0 8px}
.page-head{margin-bottom:20px}
.page-head h1{font-size:28px;font-weight:700;letter-spacing:.2px}
.page-head p{color:var(--sub);max-width:760px;margin-top:6px}
.muted{color:var(--sub)}
.small{font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--sub);background:var(--chip);white-space:nowrap}
.badge.l1{color:#0369A1;border-color:#BAE6FD;background:#F0F9FF}
.badge.l2{color:#7C3AED;border-color:#DDD6FE;background:#F5F3FF}
.badge.l3{color:#B45309;border-color:#FDE68A;background:#FFFBEB}
.badge.ev-官方{color:#166534;border-color:#BBF7D0;background:#F0FDF4}
.badge.ev-研究{color:#1D4ED8;border-color:#BFDBFE;background:#EFF6FF}
.badge.ev-实践{color:#9A3412;border-color:#FED7AA;background:#FFF7ED}
.badge.ev-待验证{color:#6D28D9;border-color:#E9D5FF;background:#FAF5FF}
[data-theme="dark"] .badge.l1,[data-theme="dark"] .badge.l2,[data-theme="dark"] .badge.l3,[data-theme="dark"] .badge.ev-官方,[data-theme="dark"] .badge.ev-研究,[data-theme="dark"] .badge.ev-实践,[data-theme="dark"] .badge.ev-待验证{background:var(--chip)}
.pbar-lg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.pbar-lg i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--chip);border:1px solid var(--border);color:var(--text)}
.chip.link{cursor:pointer}
.chip.link:hover{border-color:var(--primary);color:var(--primary);text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);transition:all .15s}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 12px;font-size:12px}
.btn.on{background:rgba(22,163,74,.12);border-color:#16A34A;color:#15803D}
.btn.learn{background:rgba(217,119,6,.1);border-color:#D97706;color:#B45309}
table{border-collapse:collapse;width:100%}
.refs-table th{font-size:11px;color:var(--sub);text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card)}
.refs-table td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:top}
.refs-table tr:hover td{background:var(--hover)}
.refs-wrap{max-height:64vh;overflow:auto;border:1px solid var(--border);border-radius:8px}

/* ============ 首页 ============ */
.hero{background:linear-gradient(135deg,var(--card),var(--card));border:1px solid var(--border);border-radius:12px;padding:34px 36px;margin-bottom:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.10),transparent 65%)}
.hero::before{content:"";position:absolute;right:90px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.08),transparent 65%)}
.hero h1{font-size:30px;font-weight:700;position:relative}
.hero .sub{color:var(--sub);margin-top:8px;max-width:720px;position:relative}
.hero .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;position:relative}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 16px;min-width:110px}
.stat b{font-size:20px;font-weight:700}
.stat span{display:block;font-size:11px;color:var(--sub)}
.flowdiag{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0}
.flow-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.flow-node{border:1px solid var(--border);border-radius:8px;background:var(--card);padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.flow-node:hover{transform:translateY(-1px);box-shadow:var(--shadow);text-decoration:none}
.flow-node .fb{width:18px;height:18px;border-radius:4px;color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.flow-arrow{color:var(--sub);font-size:14px;line-height:1;padding:5px 0}
.flow-note{margin-top:10px;font-size:12px;color:var(--sub);text-align:center}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:14px}
.mod-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,23,42,.10);text-decoration:none}
.mod-card .mc-head{display:flex;align-items:center;gap:10px}
.mod-card .mc-badge{width:30px;height:30px;border-radius:7px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.mod-card .mc-name{font-weight:650;font-size:15px}
.mod-card .mc-desc{font-size:12.5px;color:var(--sub);flex:1}
.mod-card .mc-foot{display:flex;align-items:center;gap:10px}
.mod-card .mc-foot .pbar-lg{flex:1}
.mod-card .mc-foot .t{font-size:11px;color:var(--sub);white-space:nowrap}

/* ============ 模块视图 ============ */
.mod-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.mod-head .mh-badge{width:52px;height:52px;border-radius:11px;color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.mod-head h1{font-size:24px;font-weight:700}
.mod-head .mh-sub{color:var(--sub);max-width:760px;margin-top:4px}
.mod-head .mh-goals{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px;position:sticky;top:78px;z-index:40;box-shadow:var(--shadow)}
.filters .fl-label{font-size:12px;color:var(--sub);font-weight:600}
.fchip{font-size:12px;padding:3px 11px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer}
.fchip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.filters input{border:1px solid var(--border);border-radius:6px;height:28px;padding:0 10px;font-size:12px;background:var(--bg);color:var(--text);width:180px;outline:none}
.count-note{font-size:12px;color:var(--sub);margin-left:auto}
.cols{display:flex;gap:20px;align-items:flex-start}
.cols .col-main{flex:1;min-width:0}
.cols .col-rt{width:262px;flex:none;position:sticky;top:96px}
.rt-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.rt-card h4{font-size:13px;font-weight:650;margin-bottom:8px}
.rt-card ul{list-style:none}
.rt-card li{font-size:12px;padding:4px 0;border-bottom:1px dashed var(--border)}
.rt-card li:last-child{border:none}
.rt-card a{display:block;font-size:12px;padding:3px 0;color:var(--text)}
.rt-card a:hover{color:var(--primary)}
.sec-block{margin-bottom:22px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:650;padding:6px 0 10px;cursor:pointer;user-select:none}
.sec-title .chev{color:var(--sub);transition:transform .15s;font-size:12px}
.sec-block.closed .chev{transform:rotate(-90deg)}
.sec-block.closed .tree{display:none}
.sec-title .cnt{font-size:11px;color:var(--sub);font-weight:400}
.tree{list-style:none;margin-left:6px;border-left:2px solid var(--border);padding-left:14px}
.node-row{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:7px;margin:6px 0;cursor:pointer;transition:all .13s}
.node-row:hover{border-color:var(--primary);box-shadow:var(--shadow);text-decoration:none}
.node-row .st{width:9px;height:9px;border-radius:50%;border:2px solid var(--border);flex:none}
.node-row .st.done{background:#16A34A;border-color:#16A34A}
.node-row .st.learning{background:#D97706;border-color:#D97706}
.node-row .nm{font-weight:600;font-size:13.5px}
.node-row .tags{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.node-detail-inline{display:none}

/* ============ 详情抽屉 ============ */
.detail{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:var(--card);border-left:1px solid var(--border);box-shadow:-8px 0 32px rgba(15,23,42,.16);transform:translateX(105%);transition:transform .28s ease;z-index:200;display:flex;flex-direction:column}
.detail.open{transform:none}
.detail .d-head{padding:18px 22px 14px;border-bottom:1px solid var(--border);flex:none}
.detail .d-head .row1{display:flex;align-items:flex-start;gap:10px}
.detail .d-head h2{font-size:18px;font-weight:700;line-height:1.4;flex:1}
.detail .d-close{font-size:18px;color:var(--sub);padding:2px 8px;border-radius:6px}
.detail .d-close:hover{background:var(--hover);color:var(--text)}
.detail .d-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.detail .d-body{overflow-y:auto;padding:18px 22px 30px;flex:1}
.detail .d-body h4{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 6px}
.detail .d-body h4:first-child{margin-top:0}
.detail .d-body p{font-size:13.5px}
.detail .d-body ol,.detail .d-body ul{padding-left:20px;font-size:13.5px}
.detail .d-body li{margin:3px 0}
.detail .d-foot{flex:none;border-top:1px solid var(--border);padding:12px 22px;display:flex;gap:8px;flex-wrap:wrap;background:var(--bg)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:150;display:none}
.overlay.show{display:block}
.rel-link{cursor:pointer;color:var(--primary);font-size:12.5px}
.rel-link:hover{text-decoration:underline}

/* ============ 学习路径 ============ */
.stage{position:relative;padding:0 0 8px 34px;border-left:2px solid var(--border);margin-left:12px}
.stage:last-child{border-left-color:transparent}
.stage .dot{position:absolute;left:-11px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--primary);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stage-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.stage-card h3{font-size:17px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage-card .dur{font-size:11px;color:var(--sub);font-weight:400}
.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.stage-grid h5{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:5px}
.stage-grid ul{padding-left:18px;font-size:12.5px}
.stage-grid li{margin:2px 0}
.gate{margin-top:12px;background:var(--chip);border-radius:7px;padding:9px 13px;font-size:12.5px}
.gate b{color:var(--accent)}

/* ============ 项目卡片 ============ */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.proj-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--m-proj);border-radius:8px;padding:16px 18px;cursor:pointer;box-shadow:var(--shadow)}
.proj-card:hover{box-shadow:0 6px 18px rgba(15,23,42,.10)}
.proj-card h4{font-size:14.5px;font-weight:650;display:flex;gap:8px;align-items:center}
.proj-card .pid{font-family:var(--mono);font-size:11px;color:var(--m-proj);font-weight:700}
.proj-card p{font-size:12.5px;color:var(--sub);margin-top:6px}
.proj-card .meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* ============ 关于/说明 ============ */
.doc h3{font-size:16px;font-weight:650;margin:20px 0 8px}
.doc p{font-size:13.5px;margin:6px 0;max-width:860px}
.doc ul,.doc ol{padding-left:22px;font-size:13.5px;max-width:860px}
.doc li{margin:4px 0}
.doc table{max-width:860px;margin:10px 0}
.doc th,.doc td{border:1px solid var(--border);padding:7px 12px;font-size:12.5px;text-align:left}
.doc th{background:var(--chip)}
.callout{border-left:3px solid var(--primary);background:rgba(37,99,235,.06);padding:10px 16px;border-radius:0 8px 8px 0;font-size:13px;margin:12px 0;max-width:860px}
.callout.warn{border-color:#D97706;background:rgba(217,119,6,.07)}
.callout.ev{border-color:#7C3AED;background:rgba(124,58,237,.06)}

/* ============ 响应式 ============ */
@media (max-width:1200px){.cols .col-rt{display:none}}
@media (max-width:960px){
  .sidebar{transform:translateX(-100%);box-shadow:none;width:280px}
  .sidebar.open{transform:none;box-shadow:8px 0 32px rgba(15,23,42,.18)}
  .main{margin-left:0;padding:20px 16px 60px}
  .hamburger{display:inline-flex}
  .brand .t2{display:none}
  .searchbox{width:auto;flex:1}
  .searchbox kbd{display:none}
  .filters{position:static}
  .stage-grid{grid-template-columns:1fr}
  .hero{padding:24px 22px}
  .hero h1{font-size:24px}
}
@media (max-width:640px){
  .topbar{padding:0 12px;gap:8px}
  #progressBtn span,#aboutBtn span{display:none}
  .mod-head{flex-direction:column;gap:10px}
  .refs-table th:nth-child(4),.refs-table td:nth-child(4),.refs-table th:nth-child(6),.refs-table td:nth-child(6){display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="tbtn hamburger" id="menuBtn" aria-label="菜单">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

(function(){
'use strict';
const LS_PROG='seogeo_growth_progress_v1', LS_THEME='seogeo_growth_theme';
const $=s=>document.querySelector(s);
const state={view:'home',mod:null,prog:{},filters:{lvl:[],diff:[],status:'',q:''}};

/* ---- 数据索引 ---- */
const FLAT=[];const BY_ID={};
MODULES.forEach(m=>m.sections.forEach(s=>s.nodes.forEach(n=>{const x={node:n,mod:m,sec:s};FLAT.push(x);BY_ID[n.id]=x;})));
const TOTAL=FLAT.length;

/* ---- 本地存储 ---- */
function loadProg(){try{return JSON.parse(localStorage.getItem(LS_PROG))||{};}catch(e){return{};}}
function saveProg(){try{localStorage.setItem(LS_PROG,JSON.stringify(state.prog));}catch(e){}}
state.prog=loadProg();
function setStatus(id,st){if(st==='none')delete state.prog[id];else state.prog[id]=st;saveProg();}
function statusOf(id){return state.prog[id]||'none';}

/* ---- 主题 ---- */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(LS_THEME,t);}catch(e){}}
applyTheme(localStorage.getItem(LS_THEME)||'light');
$('#themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'));

/* ---- 工具函数 ---- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function modOf(id){return BY_ID[id]?BY_ID[id].mod:null;}
function modStats(m){let done=0,learn=0,tot=0;m.sections.forEach(s=>s.nodes.forEach(n=>{tot++;const st=statusOf(n.id);if(st==='done')done++;else if(st==='learn')learn++;}));return{tot,done,learn,pct:tot?Math.round(done/tot*100):0};}
function overallStats(){let done=0,learn=0;FLAT.forEach(x=>{const st=statusOf(x.node.id);if(st==='done')done++;else if(st==='learn')learn++;});return{done,learn,total:TOTAL,pct:Math.round(done/TOTAL*100)};}
const LVL={1:['L1 基础认知','l1'],2:['L2 独立执行','l2'],3:['L3 分析与优化','l3']};
const DIFF={1:'基础',2:'进阶',3:'高阶'};
function nodeBadges(n,mini){let h='';
 h+='<span class="badge '+LVL[n.lvl][1]+'">'+LVL[n.lvl][0]+'</span>';
 h+='<span class="badge">难度：'+DIFF[n.diff]+'</span>';
 h+='<span class="badge">优先级 '+n.pri+'</span>';
 if(n.ev)h+='<span class="badge ev-'+n.ev+'">'+n.ev+'</span>';
 return h;}
function srcLinks(arr){if(!arr||!arr.length)return '<span class="muted small">暂无直接来源（通用知识或实践总结）</span>';
 return '<ul style="list-style:none;padding:0">'+arr.map(i=>{const s=SOURCES[i-1];if(!s)return'';return '<li style="margin:5px 0"><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a><div class="small muted">'+esc(s.org)+' · '+esc(s.type)+' · 核验于 '+UPD+'</div></li>';}).join('')+'</ul>';}
function relChips(arr){if(!arr||!arr.length)return '<span class="muted small">无</span>';
 return '<div class="chips">'+arr.map(id=>{const x=BY_ID[id];if(!x)return'';return '<a class="chip link" data-node="'+id+'" style="border-color:'+x.mod.color+'44">'+esc(id)+' '+esc(x.node.n)+'</a>';}).join('')+'</div>';}

  if(f.diff.length&&!f.diff.includes(n.diff))return false;
  if(f.status&&statusOf(n.id)!==f.status)return false;
  if(f.q){const q=f.q.toLowerCase();const hay=(n.n+n.def+(n.why||'')+m.name).toLowerCase();if(hay.indexOf(q)<0)return false;}

 m.sections.forEach(sec=>{const vis=sec.nodes.filter(match);total+=sec.nodes.length;shown+=vis.length;

 '<select id="srcType" style="height:28px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)"><option value="">全部类型</option>'+types.map(t=>'<option'+(f.type===t?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'+
 '<input id="srcQ" placeholder="搜索标题/机构/结论…" value="'+esc(f.q)+'"><span class="count-note">'+list.length+' 条</span></div>';
 h+='<div class="refs-wrap"><table class="refs-table"><thead><tr><th>#</th><th>标题</th><th>机构/作者</th><th>类型</th><th>对应模块</th><th>更新时间</th><th>可支持的结论</th></tr></thead><tbody>';
 list.forEach((s,i)=>{h+='<tr><td class="muted">'+(i+1)+'</td><td><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a></td><td>'+esc(s.org)+'</td><td>'+esc(s.type)+'</td><td>'+s.mods.join(' ')+'</td><td class="muted">'+esc(s.date)+'</td><td class="muted">'+esc(s.sup)+'</td></tr>';});
 h+='</tbody></table></div></div>';
 $('#mainInner').innerHTML=h;
}

/* ---- 视图：项目说明 ---- */
function renderAbout(){
 const st=overallStats();
 $('#mainInner').innerHTML='<div class="view active" id="view-about"><div class="page-head"><h1>项目说明</h1><p>关于本平台的定位、功能、证据规则、数据存储与更新机制。</p></div>'+
 '<div class="card doc"><h3>这是什么</h3><p>一个可以直接在浏览器中打开的交互式 SEO + GEO 自学知识平台：'+MODULES.length+' 个模块、'+TOTAL+' 个知识节点、'+STAGES.length+' 个学习阶段、'+SOURCES.length+' 条参考资料。内容按「模块→章节→知识点」三级组织，每个知识点包含定义、原理、操作步骤、工具、案例、常见错误、练习、验收标准与资料来源。</p>'+
 '<h3>如何使用</h3><ul><li><b>模块切换：</b>点击左侧导航或首页模块卡片。</li><li><b>树状浏览：</b>模块页按章节展开/收起知识点；点击节点打开详情面板。</li><li><b>全局搜索：</b>顶部搜索框（快捷键 /）搜索节点、定义与模块。</li><li><b>条件筛选：</b>模块页按学习层级（L1/L2/L3）、难度、学习状态与关键词筛选。</li><li><b>学习进度：</b>在节点详情中标记「学习中 / 已掌握」；顶栏查看总体进度，可导出或重置。</li><li><b>学习路径：</b>按六个阶段推进，每阶段有知识点、任务、验收与进入条件。</li><li><b>参考资料：</b>所有节点详情与资料清单中的链接均可直接打开。</li></ul>'+
 '<h3>证据分级规则</h3><p>本平台对知识结论区分证据类型，节点徽章与资料清单均有标注：</p><table><tr><th>标记</th><th>含义</th><th>示例</th></tr><tr><td>官方</td><td>Google/平台官方文档或帮助明确说明</td><td>AI Overviews 引用需被索引且具备摘要资格</td></tr><tr><td>研究</td><td>学术论文或有方法论的行业研究结论（注意适用范围）</td><td>GEO 论文中引用/统计提升可见度（实验环境）</td></tr><tr><td>实践</td><td>从业者经验与方法论，缺乏公开验证数据</td><td>内容集群的内链结构设计</td></tr><tr><td>待验证</td><td>流传但缺乏证据的假设，仅作提示</td><td>各类「AI 排名算法破解」话术</td></tr></table>'+
 '<div class="callout warn"><b>GEO 特别声明：</b>任何 GEO 方法都不能保证被 AI 搜索引用或推荐。AI 平台的选择机制不公开、持续变化且存在随机性；引用相关研究的数字口径差异很大（不同研究的重叠度从 17% 到 94% 不等，原因是统计单位与截断位置不同）。请以官方文档与可复现研究为准，把 GEO 当作持续实验而非确定套利。</div>'+
 '<h3>学习状态与本地存储</h3><div class="callout"><b>存储限制：</b>学习进度保存在当前浏览器的 localStorage 中（键名 <code>'+LS_PROG+'</code>），刷新不丢失，但<b>仅存在于这台设备的这个浏览器</b>——不等于云端同步或备份。更换浏览器、清除站点数据或使用隐私模式都会丢失。重要进度请用「导出」按钮定期备份 JSON。</div>'+
 '<h3>更新机制</h3><ul><li>静态 HTML 文件<b>不会</b>自动更新。知识更新需要重新研究并修改文件。</li><li>GEO、AI 搜索、平台政策等变化快的领域：建议每 3 个月按「参考资料清单」复核一次官方文档（清单内含各条目的最后核验日期）。</li><li>内容数据（<code>MODULES / STAGES / SOURCES</code>）与样式、交互代码分离，修改数据即可新增或修订知识点。</li></ul>'+
 '<h3>当前进度</h3><p>已掌握 <b>'+st.done+'</b> / '+st.total+'（'+st.pct+'%），学习中 '+st.learn+' 个。</p><button class="btn" data-openprog>查看进度详情</button>'+
 '<h3>技术说明</h3><p>单文件实现：原生 HTML/CSS/JavaScript，无外部 CDN、框架或字体依赖，可离线打开。响应式适配桌面、平板与手机；支持浅色/深色主题。</p></div></div>';
}

/* ---- 视图切换 ---- */
function showView(v,mod){
 state.view=v;if(mod)state.mod=mod;
 if(v==='home')renderHome();
 else if(v==='path')renderPath();
 else if(v==='sources')renderSources();
 else if(v==='about')renderAbout();
 else if(v==='module')renderModule();
 renderSidebar();window.scrollTo(0,0);
}

/* ---- 节点详情 ---- */
function openNode(id){
 const x=BY_ID[id];if(!x)return;const n=x.node;curNodeId=id;
 if(state.view!=='module'||state.mod!==x.mod.id){state.mod=x.mod.id;renderModule();renderSidebar();}
 const st=statusOf(id);
 let h='';
 h+='<h4>所属</h4><p>'+esc(x.mod.id+' · '+x.mod.name)+' / '+esc(x.sec.name)+'</p>';
 h+='<h4>核心定义</h4><p>'+esc(n.def)+'</p>';
 if(n.why)h+='<h4>重要性及解决的问题</h4><p>'+esc(n.why)+'</p>';
 if(n.pre&&n.pre.length)h+='<h4>前置知识</h4>'+relChips(n.pre);
 if(n.principle)h+='<h4>核心原理</h4><p>'+esc(n.principle)+'</p>';
 if(n.how&&n.how.length)h+='<h4>实际操作步骤</h4><ol>'+n.how.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>';
 if(n.tools&&n.tools.length)h+='<h4>相关工具</h4><div class="chips">'+n.tools.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div>';
 if(n.case)h+='<h4>典型案例</h4><p>'+esc(n.case)+'</p>';
 if(n.inputs)h+='<h4>输入资料</h4><p>'+esc(n.inputs)+'</p>';
 if(n.err&&n.err.length)h+='<h4>常见错误</h4><ul>'+n.err.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';
 if(n.prac)h+='<h4>实践练习</h4><p>'+esc(n.prac)+'</p>';
 if(n.deliver)h+='<h4>交付成果</h4><p>'+esc(n.deliver)+'</p>';
 if(n.ok)h+='<h4>学习成果 / 验收标准</h4><p>'+esc(n.ok)+'</p>';
 h+='<h4>官方资料与延伸阅读</h4>'+srcLinks(n.src);
 if(n.rel&&n.rel.length)h+='<h4>相关知识节点</h4>'+relChips(n.rel);
 h+='<h4>核验信息</h4><p class="small muted">内容最后核验日期：'+n.upd+' · 学习层级 '+LVL[n.lvl][0]+' · 难度 '+DIFF[n.diff]+' · 优先级 '+n.pri+(n.ev?' · 证据等级：'+n.ev:'')+'</p>';
 $('#dTitle').textContent=n.n;
 $('#dMeta').innerHTML='<span class="badge" style="color:'+x.mod.color+';border-color:'+x.mod.color+'">'+x.mod.id+' '+esc(x.mod.name)+'</span>'+nodeBadges(n);
 $('#dBody').innerHTML=h;
 $('#dFoot').innerHTML='<button class="btn sm '+(st==='learn'?'learn':'')+'" data-set="learn">标记为学习中</button><button class="btn sm '+(st==='done'?'on':'')+'" data-set="done">标记为已掌握</button><button class="btn sm" data-set="none">重置状态</button>';
 $('#detailPanel').classList.add('open');$('#overlay').classList.add('show');
 $('#detailPanel').scrollTop=0;$('#dBody').scrollTop=0;
}
function closeDetail(){$('#detailPanel').classList.remove('open');$('#overlay').classList.remove('show');}
$('#dClose').addEventListener('click',closeDetail);
$('#overlay').addEventListener('click',()=>{closeDetail();$('#sidebar').classList.remove('open');});

/* ---- 全局搜索 ---- */
const sd=$('#searchDrop'),si=$('#globalSearch');
function doSearch(){
 const q=si.value.trim().toLowerCase();
 if(!q){sd.classList.remove('open');sd.innerHTML='';return;}
 const res=FLAT.filter(x=>{const n=x.node;return (n.n+' '+n.def+' '+(n.why||'')+' '+x.mod.name+' '+x.sec.name+' '+n.id).toLowerCase().indexOf(q)>=0;}).slice(0,14);
 let h='<div class="sd-head">找到 '+FLAT.filter(x=>{const n=x.node;return (n.n+' '+n.def+' '+(n.why||'')+' '+x.mod.name+' '+x.sec.name+' '+n.id).toLowerCase().indexOf(q)>=0;}).length+' 个匹配节点（显示前 14）</div>';
 if(!res.length)h+='<div class="sd-empty">未找到相关知识点，试试更短的关键词</div>';
 h+=res.map(x=>'<div class="sd-item" data-node="'+x.node.id+'"><span class="dot" style="background:'+x.mod.color+'"></span><span class="nm">'+esc(x.node.n)+'</span><span class="md">'+x.mod.id+' · '+esc(x.sec.name)+'</span></div>').join('');
 sd.innerHTML=h;sd.classList.add('open');
}
si.addEventListener('input',doSearch);
si.addEventListener('focus',doSearch);
si.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=sd.querySelector('.sd-item');if(first)first.click();}if(e.key==='Escape'){sd.classList.remove('open');si.blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))sd.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==si&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();si.focus();}});

/* ---- 事件委托 ---- */
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){showView(nav.getAttribute('data-nav'));$('#sidebar').classList.remove('open');return;}
 const mod=e.target.closest('[data-mod]');if(mod){showView('module',mod.getAttribute('data-mod'));$('#sidebar').classList.remove('open');return;}
 const node=e.target.closest('[data-node]');if(node){openNode(node.getAttribute('data-node'));sd.classList.remove('open');return;}
 const tsec=e.target.closest('[data-tsec]');if(tsec){tsec.closest('.sec-block').classList.toggle('closed');return;}
 const f=e.target.closest('[data-f]');if(f){const k=f.getAttribute('data-f');const v=f.getAttribute('data-v');
  if(k==='lvl'||k==='diff'){const n=Number(v);const i=state.filters[k].indexOf(n);if(i>=0)state.filters[k].splice(i,1);else state.filters[k].push(n);}
  else{state.filters[k]=(state.filters[k]===v)?'':v;}
  renderModule();return;}
 const op=e.target.closest('[data-openprog]');if(op){openProgress();return;}
});
/* 详情面板内进度按钮 */
let curNodeId=null;
$('#dFoot').addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(!b||!curNodeId)return;
 setStatus(curNodeId,b.getAttribute('data-set'));renderModule();renderSidebar();openNode(curNodeId);});

/* ---- 进度面板 ---- */
function openProgress(){
 const st=overallStats();
 let old=document.getElementById('progModal');if(old)old.remove();
 const div=document.createElement('div');div.id='progModal';
 div.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
 let rows=MODULES.map(m=>{const s=modStats(m);return '<div style="display:flex;align-items:center;gap:10px;margin:7px 0"><span style="width:22px;height:22px;border-radius:5px;background:'+m.color+';color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center">'+m.id+'</span><span style="width:150px;font-size:13px">'+esc(m.name)+'</span><span class="pbar-lg" style="flex:1"><i style="width:'+s.pct+'%;background:'+m.color+'"></i></span><span class="small muted" style="width:90px;text-align:right">'+s.done+'/'+s.tot+'（'+s.pct+'%）</span></div>';}).join('');
 div.innerHTML='<div class="card" style="max-width:560px;width:100%;max-height:82vh;overflow:auto;margin:0"><h2>学习进度</h2><p class="muted small">总体：已掌握 '+st.done+' / '+st.total+'（'+st.pct+'%），学习中 '+st.learn+' 个。状态保存在本浏览器 localStorage，清除站点数据或更换设备会丢失。</p><div style="margin:14px 0">'+rows+'</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="progExport">导出进度 JSON</button><button class="btn" id="progReset">重置全部进度</button><button class="btn" id="progClose">关闭</button></div></div>';
 document.body.appendChild(div);
 div.addEventListener('click',e=>{if(e.target===div)div.remove();});
 div.querySelector('#progClose').addEventListener('click',()=>div.remove());
 div.querySelector('#progReset').addEventListener('click',()=>{if(confirm('确定重置全部学习进度？此操作不可撤销。')){state.prog={};saveProg();div.remove();renderSidebar();if(state.view==='module')renderModule();if(state.view==='home')renderHome();}});
 div.querySelector('#progExport').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),progress:state.prog},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='seogeo-growth-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);});
}

/* ---- 移动端菜单 ---- */
$('#menuBtn').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');});
$('#progressBtn').addEventListener('click',openProgress);
$('#aboutBtn').addEventListener('click',()=>showView('about'));

/* ---- 模块内筛选输入 ---- */
document.addEventListener('input',e=>{
 if(e.target&&e.target.id==='modFilterQ'){state.filters.q=e.target.value;const p=e.target.selectionStart;renderModule();const el=document.getElementById('modFilterQ');if(el){el.focus();el.setSelectionRange(p,p);}}
 if(e.target&&e.target.id==='srcQ'){srcFilter.q=e.target.value;const p=e.target.selectionStart;renderSources();const el=document.getElementById('srcQ');if(el){el.focus();el.setSelectionRange(p,p);}}
});
document.addEventListener('change',e=>{
 if(e.target&&e.target.id==='srcMod'){srcFilter.mod=e.target.value;renderSources();}
 if(e.target&&e.target.id==='srcType'){srcFilter.type=e.target.value;renderSources();}
});

/* ---- 启动 ---- */
showView('home');
})();
</script>
</body>
</html>
